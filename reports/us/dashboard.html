<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>US (NYSE/Nasdaq) dashboard</title>
<style>/* Market Brief dashboard. Light theme only (owner decision). Palette: the dataviz reference instance —
   diverging blue (up) / red (down) with a gray midpoint, status colours always paired with an icon and a
   label, recessive grid and axes, system font stack, tabular figures in tables. */
:root{
  color-scheme: light;
  --page:#f5f6f8; --surface:#ffffff; --surface-2:#fafafa; --ink:#0b0b0b; --ink-2:#52514e; --muted:#6f6d68;
  --grid:#e6e7ea; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --focus:#1c5cab;
  --up:#2a78d6; --up-ink:#1c5cab; --down:#e34948; --down-ink:#b42727; --mid:#f0efec;
  --band:#4a3aa7; --band80:rgba(74,58,167,.10); --band50:rgba(74,58,167,.22);
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --warn-ink:#7a5200; --warn-bg:#fff4dc;
  --serious:#ec835a; --serious-ink:#9a3412; --critical:#d03b3b; --neutral-bg:#eef0f3;
  --radius:10px; --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
body{min-width:320px}
a{color:var(--up-ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:0;background:var(--surface);padding:8px 12px;z-index:30}
.skip:focus{left:8px}
.num,.tab-num,table{font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top-row{display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap;max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em}
.logo{color:var(--up)}
.markets{display:flex;gap:2px;background:var(--neutral-bg);border-radius:8px;padding:2px}
.markets a,.markets span{padding:4px 12px;border-radius:6px;text-decoration:none;color:var(--ink-2);font-size:14px}
.markets [aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;background:var(--neutral-bg)}
.banner{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:8px 20px;background:var(--warn-bg);color:var(--warn-ink);font-size:13.5px;border-top:1px solid rgba(122,82,0,.15)}
.banner .inner{max-width:1320px;margin:0 auto;width:100%;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.banner strong{font-weight:700}
.banner.shown{background:#e9f6e9;color:var(--good-ink)}
main{max-width:1320px;margin:0 auto;padding:18px 20px 40px}
main:focus{outline:none}
.view{display:none}
.view.active{display:block}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:14.5px;margin:0 0 8px;color:var(--ink)}
p{margin:0 0 8px}
.sub{color:var(--ink-2);font-size:13.5px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-width:0}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack>*+*{margin-top:14px}
.section{margin-top:18px}
.tile .label{font-size:12.5px;color:var(--ink-2);text-transform:none}
.tile .value{font-size:24px;font-weight:650;letter-spacing:-.01em;margin-top:2px}
.tile .delta{font-size:13.5px;margin-top:2px}
.up{color:var(--up-ink)} .down{color:var(--down-ink)} .flat{color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--neutral-bg);color:var(--ink-2);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.st-good{background:#e7f6e7;color:var(--good-ink);border-color:rgba(12,163,12,.35)}
.st-warn{background:var(--warn-bg);color:var(--warn-ink);border-color:rgba(250,178,25,.6)}
.st-serious{background:#fdeee7;color:var(--serious-ink);border-color:rgba(236,131,90,.6)}
.st-critical{background:#fbe9e9;color:#9b1c1c;border-color:rgba(208,59,59,.5)}
.st-neutral{background:var(--neutral-bg);color:var(--ink-2);border-color:var(--border)}
.paper{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:6px;background:var(--warn-bg);color:var(--warn-ink);font-weight:650;font-size:12.5px;border:1px solid rgba(250,178,25,.6)}
.paper.shown{background:#e7f6e7;color:var(--good-ink);border-color:rgba(12,163,12,.35)}
/* tables */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--grid);white-space:nowrap}
th{font-weight:600;color:var(--ink-2);font-size:12.5px;background:var(--surface-2);position:sticky;top:0}
td.r,th.r{text-align:right}
tbody tr:hover{background:#f7f9fc}
th button.sort{border:0;background:none;padding:0;font-weight:600;color:inherit;cursor:pointer;font-size:inherit}
th[aria-sort="ascending"] button.sort::after{content:" ▲";font-size:10px}
th[aria-sort="descending"] button.sort::after{content:" ▼";font-size:10px}
.tick{border:0;background:none;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column}
.tick b{color:var(--up-ink);font-size:13.5px}
.tick span{color:var(--ink-2);font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters input,.filters select,.stock-pick select{font:inherit;padding:6px 10px;border:1px solid var(--axis);border-radius:8px;background:var(--surface);min-width:0}
.prob{display:inline-flex;align-items:center;gap:6px}
.pbar{position:relative;width:54px;height:6px;background:var(--neutral-bg);border-radius:3px;overflow:hidden}
.pbar i{position:absolute;top:0;bottom:0;background:var(--up)}
.pbar i.dn{background:var(--down)}
.pbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--ink-2)}
/* heatmap */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.heat .sector{border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--surface)}
.heat .sector h3{font-size:12.5px;display:flex;justify-content:space-between;margin:0 0 6px;color:var(--ink-2);font-weight:600}
.heat .cells{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px}
.heat .cell{border:0;border-radius:4px;padding:8px 6px;cursor:pointer;text-align:left;min-height:48px;min-width:0;overflow:hidden}
.heat .cell b{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.heat .cell span{font-size:12px}
.scale{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.scale .bar{width:140px;height:8px;border-radius:4px}
.seg{display:inline-flex;background:var(--neutral-bg);padding:2px;border-radius:8px;gap:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* stock page */
.stock-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.stock-pick{display:flex;gap:6px;align-items:center}
.stock-pick button{border:1px solid var(--axis);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer}
.price-big{font-size:30px;font-weight:650;letter-spacing:-.02em}
.session-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}
.session-strip>div{background:var(--surface-2);border:1px solid var(--grid);border-radius:8px;padding:8px 10px}
.session-strip .k{font-size:12px;color:var(--ink-2)}
.session-strip .v{font-weight:600}
.session-strip .v .small{font-weight:400}
.chart-card{padding:12px 12px 8px}
.chart-tools{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);align-items:center}
.sw{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.chart-box{position:relative;height:420px}
.chart-box .lw{position:absolute;inset:0}
.chart-box svg.fan{position:absolute;inset:0;pointer-events:none;z-index:3}
.ohlc{font-size:12px;color:var(--ink-2);min-height:18px;margin-bottom:4px}
.fc{display:flex;flex-direction:column;gap:10px}
.fc .big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}
.fc .when{font-size:13px;color:var(--ink-2)}
.meter{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,#f6d3d3,var(--mid) 50%,#d3e4f8)}
.meter .base{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2)}
.meter .dot{position:absolute;top:-4px;width:18px;height:18px;margin-left:-9px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--ink)}
.meter-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.contrib{display:grid;grid-template-columns:minmax(90px,130px) 1fr 54px;gap:6px 8px;align-items:center;font-size:12.5px}
.contrib .track{position:relative;height:12px;background:var(--surface-2);border-radius:3px}
.contrib .track::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--axis)}
.contrib .track i{position:absolute;top:1px;bottom:1px;border-radius:3px}
.drivers{margin:0;padding-left:18px;font-size:13px}
.drivers li{margin:2px 0}
details{border-top:1px solid var(--grid);padding-top:8px}
details summary{cursor:pointer;font-weight:600;font-size:13.5px}
.formula{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface-2);border:1px solid var(--grid);border-radius:6px;padding:8px 10px;overflow-x:auto;white-space:pre}
.case{border-left:4px solid var(--grid);padding-left:12px}
.case.bull{border-color:var(--up)} .case.bear{border-color:var(--down)}
.news li{list-style:none;padding:8px 0;border-bottom:1px solid var(--grid);display:flex;flex-direction:column;gap:3px}
.news{padding:0;margin:0}
.news .meta{font-size:12px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rsi{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,#d3e4f8 0 30%,var(--mid) 30% 70%,#f6d3d3 70% 100%);margin:6px 0 2px}
.rsi .dot{position:absolute;top:-4px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--ink);border:2px solid var(--surface)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right;font-weight:600}
.empty{padding:14px;border:1px dashed var(--axis);border-radius:8px;color:var(--ink-2);font-size:13.5px;background:var(--surface-2)}
.how h2{margin-top:18px}
.how p,.how li{max-width:760px}
.foot{max-width:1320px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:12px}
@media (max-width: 1000px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:1fr 1fr} }
@media (max-width: 720px){
  .top{position:static}
  .top-row{padding:8px 12px;gap:8px}
  .tabs{margin-left:0;width:100%;flex-wrap:wrap}
  .tabs button{padding:6px 8px;font-size:14px}
  .heat{grid-template-columns:1fr}
  .tile .value{font-size:20px}
  .banner{padding:8px 12px}
  main{padding:12px 12px 32px}
  .g4,.g3,.g2{grid-template-columns:1fr}
  .g4.tiles{grid-template-columns:1fr 1fr}
  .session-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chart-box{height:320px}
  .price-big{font-size:26px}
  .foot{padding:0 12px 24px}
  .hide-sm{display:none}
}
@media (forced-colors: active){ .heat .cell{border:1px solid CanvasText} .pbar i,.contrib .track i{background:CanvasText} }
</style>
</head>

<script>/* Market Brief dashboard app. Reads the JSON embedded by scripts/dashboard.py and renders four views
   (overview, stock, track record, how to read). Every number shown is a stored value or a plain ratio
   of stored prices computed by the builder; this script only formats. No network access. */
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('mb-data').textContent);
  var LOC = D.market === 'india' ? 'en-IN' : 'en-US';
  var UP = '#2a78d6', DOWN = '#e34948', BAND = '#4a3aa7', LATE = '#898781';
  var STATUS = {
    confirmed_primary: ['st-good', '✓', 'Confirmed by filing'],
    corroborated: ['st-good', '✓', 'Corroborated'],
    single_source: ['st-warn', '!', 'Single source'],
    unverified: ['st-neutral', '?', 'Unverified'],
    rumour: ['st-serious', '✕', 'Rumour'],
    promotional: ['st-serious', '✕', 'Promotional'],
    contradicted: ['st-critical', '✕', 'Contradicted']
  };
  var byTicker = {};
  (D.companies || []).forEach(function (c) { byTicker[c.ticker] = c; });
  var state = { view: 'overview', ticker: D.companies && D.companies.length ? D.companies[0].ticker : null,
    span: D.default_span, sort: { key: 'sector', dir: 1 }, q: '', sector: '', heat: '1d' };
  var chart = null, chartRedraw = null;

  // ---------- formatting ----------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function safeUrl(u) { return typeof u === 'string' && /^https?:\/\/\S+$/i.test(u.trim()) ? u.trim() : null; }
  function isNum(v) { return typeof v === 'number' && isFinite(v); }
  function num(v, d) {
    if (!isNum(v)) return '–';
    d = d == null ? (Math.abs(v) >= 10000 ? 1 : 2) : d;
    return v.toLocaleString(LOC, { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function money(v, d) { return isNum(v) ? D.symbol + num(v, d) : '–'; }
  function pct(v, d, sign) {
    if (!isNum(v)) return '–';
    var s = (v * 100).toFixed(d == null ? 1 : d);
    if (sign !== false && v > 0) s = '+' + s;
    return s.replace('-', '−') + '%';
  }
  function prob(v) { return isNum(v) ? (v * 100).toFixed(1) + '%' : '–'; }
  function cls(v) { return !isNum(v) || v === 0 ? 'flat' : (v > 0 ? 'up' : 'down'); }
  function arrow(v) { return !isNum(v) || v === 0 ? '' : (v > 0 ? '▲ ' : '▼ '); }
  function signed(v, d) { return '<span class="' + cls(v) + '">' + arrow(v) + pct(v, d) + '<\/span>'; }
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function day(iso) {
    if (!iso) return '–';
    var p = iso.slice(0, 10).split('-').map(Number), dt = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    return DAYS[dt.getUTCDay()] + ' ' + p[2] + ' ' + MONTHS[p[1] - 1];
  }
  function stamp(iso) {
    if (!iso) return '–';
    var t = new Date(iso);
    if (isNaN(t)) return iso;
    return t.getUTCDate() + ' ' + MONTHS[t.getUTCMonth()] + ' ' + String(t.getUTCHours()).padStart(2, '0') + ':' +
      String(t.getUTCMinutes()).padStart(2, '0') + ' UTC';
  }
  function badge(status) {
    var s = STATUS[status] || STATUS.unverified;
    return '<span class="badge ' + s[0] + '"><span aria-hidden="true">' + s[1] + '<\/span>' + esc(s[2]) + '<\/span>';
  }
  function link(title, url) {
    var u = safeUrl(url);
    return u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(title) + '<\/a>' : esc(title);
  }
  function paperTag() {
    return '<span class="paper' + (D.skill.state === 'shown' ? ' shown' : '') + '"><span aria-hidden="true">' +
      (D.skill.state === 'shown' ? '✓' : '⚠') + '<\/span>' + esc(D.skill.label) + '<\/span>';
  }
  function empty(text) { return '<div class="empty">' + esc(text) + '<\/div>'; }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function modelOf(c, h) { return (c.model || []).filter(function (m) { return m.h === h; })[0] || null; }
  function rangeOf(c, h) { return (c.ranges || []).filter(function (r) { return r.h === h; })[0] || null; }
  function probBar(p) {
    if (!isNum(p)) return '<span class="muted">–<\/span>';
    var w = Math.min(50, Math.abs(p - 0.5) * 100 * 4), left = p >= 0.5 ? 50 : 50 - w;
    return '<span class="prob"><span class="tab-num">' + prob(p) + '<\/span><span class="pbar" aria-hidden="true"><i class="' +
      (p >= 0.5 ? '' : 'dn') + '" style="left:' + left + '%;width:' + w + '%"><\/i><\/span><\/span>';
  }
  function spark(points, w, h) {
    var vals = points.map(function (p) { return p[1]; }).filter(isNum);
    if (vals.length < 2) return '';
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), span = hi - lo || 1;
    var d = vals.map(function (v, i) {
      return (i ? 'L' : 'M') + (i * (w - 2) / (vals.length - 1) + 1).toFixed(1) + ' ' + (h - 1 - (v - lo) / span * (h - 2)).toFixed(1);
    }).join(' ');
    var colour = vals[vals.length - 1] >= vals[0] ? UP : DOWN;
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true"><path d="' + d +
      '" fill="none" stroke="' + colour + '" stroke-width="1.5" stroke-linejoin="round"/><\/svg>';
  }

  // ---------- shell: market switch, tabs, banner, footer ----------
  function shell() {
    document.getElementById('markets').innerHTML = (D.markets || [D.market]).map(function (m) {
      var label = m === 'us' ? 'US' : cap(m);
      return m === D.market ? '<span aria-current="page">' + esc(label) + '<\/span>' :
        '<a href="../' + encodeURIComponent(m) + '/dashboard.html">' + esc(label) + '<\/a>';
    }).join('');
    var b = document.getElementById('banner');
    if (D.skill.state === 'shown') b.classList.add('shown');
    b.innerHTML = '<div class="inner"><strong><span aria-hidden="true">' + (D.skill.state === 'shown' ? '✓ ' : '⚠ ') + '<\/span>' +
      esc(D.skill.label) + '<\/strong><span>' + esc(D.disclaimer) + '<\/span><span class="small hide-sm">' + esc(D.skill.why) + '<\/span><\/div>';
    document.getElementById('foot').innerHTML = '<p>' + esc(D.disclaimer) + ' Nothing here places a trade. Data as of the close of ' +
      esc(day(D.as_of)) + '; page built ' + esc(stamp(D.generated_at)) + ' from the stored data of the ' + esc(D.name) +
      ' routine.<\/p><p>Charts: TradingView Lightweight Charts™ (Apache-2.0), bundled in this file; no network needed.<\/p>';
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (btn) {
      btn.addEventListener('click', function () { go(btn.dataset.view, btn.dataset.view === 'stock' ? state.ticker : null); });
      btn.addEventListener('keydown', function (e) {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        var tabs = Array.prototype.slice.call(document.querySelectorAll('#tabs button'));
        var i = (tabs.indexOf(btn) + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length;
        tabs[i].focus(); tabs[i].click();
      });
    });
  }

  function go(view, ticker) {
    var hash = view === 'stock' && ticker ? '#stock/' + encodeURIComponent(ticker) : '#' + view;
    if (location.hash !== hash) location.hash = hash; else route();
  }

  function route() {
    var h = decodeURIComponent((location.hash || '#overview').slice(1));
    var view = h.split('/')[0] || 'overview', ticker = h.indexOf('/') > 0 ? h.slice(h.indexOf('/') + 1) : null;
    if (['overview', 'stock', 'track', 'how'].indexOf(view) < 0) view = 'overview';
    if (ticker && byTicker[ticker]) state.ticker = ticker;
    state.view = view;
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (btn) {
      var on = btn.dataset.view === view;
      btn.setAttribute('aria-selected', on ? 'true' : 'false'); btn.tabIndex = on ? 0 : -1;
    });
    Array.prototype.forEach.call(document.querySelectorAll('.view'), function (v) { v.classList.toggle('active', v.id === 'view-' + view); });
    if (view === 'overview') renderOverview();
    if (view === 'stock') renderStock();
    if (view === 'track') renderTrack();
    if (view === 'how') renderHow();
  }

  window.MB = { D: D, locale: LOC, state: state, go: go, esc: esc, num: num, money: money, pct: pct, prob: prob, day: day, stamp: stamp,
    badge: badge, link: link, paperTag: paperTag, empty: empty, cap: cap, modelOf: modelOf, rangeOf: rangeOf,
    probBar: probBar, spark: spark, signed: signed, cls: cls, isNum: isNum, byTicker: byTicker,
    colours: { UP: UP, DOWN: DOWN, BAND: BAND, LATE: LATE },
    chart: function (c) { return chart; }, setChart: function (c, r) { chart = c; chartRedraw = r; } };
  var renderOverview = function () { window.MB.renderOverview(); };
  var renderStock = function () { window.MB.renderStock(); };
  var renderTrack = function () { window.MB.renderTrack(); };
  var renderHow = function () { window.MB.renderHow(); };
  window.MB.boot = function () { shell(); window.addEventListener('hashchange', route); route(); };
})();

/* Overview view: market tiles, cues, sector heatmap and the full watchlist table. */
(function (MB) {
  'use strict';
  var D = MB.D, state = MB.state, esc = MB.esc;

  function tile(label, value, delta, extra) {
    return '<div class="card tile"><div class="label">' + esc(label) + '<\/div><div class="value">' + value + '<\/div>' +
      (delta ? '<div class="delta">' + delta + '<\/div>' : '') + (extra || '') + '<\/div>';
  }

  function tiles(o) {
    var out = [], b = o.benchmark, v = o.vol_index, r = o.regime;
    if (b && b.last) {
      out.push(tile(b.name + ' · ' + MB.day(b.last.date), MB.num(b.last.close), MB.signed(b.last.change, 2) +
        ' <span class="muted small">gap ' + MB.pct(b.last.gap, 2) + '<\/span>', '<div style="margin-top:6px">' + MB.spark(b.spark, 160, 32) + '<\/div>'));
    }
    if (v && v.last) out.push(tile(v.name + ' (fear gauge)', MB.num(v.last.close, 2), MB.signed(v.last.change, 1)));
    if (r) {
      out.push(tile('Market regime · ' + MB.day(r.as_of), esc(r.code.replace('_', ' ').toLowerCase()), '',
        '<p class="small sub" style="margin-top:4px">' + esc(r.plain) + (r.stress ? ' Stress mode is on.' : '') + '<\/p>'));
    }
    if (D.plan) {
      out.push(tile('Next session plan', esc(MB.day(D.plan.entry)), '',
        '<p class="small sub" style="margin-top:4px">Signals assume a buy at the open of ' + esc(MB.day(D.plan.entry)) +
        '. 1 day: sell at the close of ' + esc(MB.day(D.plan.exit_1d)) + '. 5 days: sell at the close of ' + esc(MB.day(D.plan.exit_5d)) + '.<\/p>'));
    }
    return '<div class="grid g4 tiles">' + out.join('') + '<\/div>';
  }

  function cues(o) {
    if (!o.cues.length) return '';
    var rows = o.cues.map(function (q) {
      return '<tr><td>' + esc(q.name) + '<\/td><td>' + esc(q.role) + '<\/td><td class="r">' + MB.num(q.price) + '<\/td><td class="r">' +
        MB.signed(q.change, 2) + '<\/td><td class="small muted">' + esc(MB.stamp(q.collected_at)) + '<\/td><\/tr>';
    }).join('');
    return '<div class="card section"><h2>Overnight cues and global factors<\/h2><p class="sub small">Newest stored quote per symbol; the change is against the previous close. Times are when the routine stored the quote.<\/p>' +
      '<div class="table-wrap"><table><thead><tr><th>Symbol<\/th><th>Role<\/th><th class="r">Price<\/th><th class="r">Change<\/th><th>Stored<\/th><\/tr><\/thead><tbody>' +
      rows + '<\/tbody><\/table><\/div><\/div>';
  }

  // diverging scale: red (down) - gray - blue (up), clamped at +-3% (1 day) or +-6% (5 days)
  var NEG = [227, 73, 72], MID = [240, 239, 236], POS = [42, 120, 214];
  function heatColour(v, limit) {
    if (!MB.isNum(v)) return ['#f5f6f8', '#6f6d68'];
    var t = Math.max(-1, Math.min(1, v / limit)), end = t < 0 ? NEG : POS, a = Math.abs(t);
    var rgb = MID.map(function (m, i) { return Math.round(m + (end[i] - m) * a); });
    return ['rgb(' + rgb.join(',') + ')', a > 0.7 ? '#ffffff' : '#0b0b0b'];
  }

  function heatmap(o) {

      '<h2>The two questions<\/h2><ul><li><strong>Buy today, sell tomorrow (1 day):<\/strong> buy at the open of the next session' +
      (plan.entry ? ' (' + esc(MB.day(plan.entry)) + ')' : '') + ' and sell at the close of the session after it' + (plan.exit_1d ? ' (' + esc(MB.day(plan.exit_1d)) + ')' : '') + '.<\/li>' +
      '<li><strong>Buy today, sell within 5 days:<\/strong> the same open, sold at the close of the fifth session' + (plan.exit_5d ? ' (' + esc(MB.day(plan.exit_5d)) + ')' : '') + '.<\/li><\/ul>' +
      '<h2>P(up): the signal model\'s probability<\/h2><p>For each stock and question, a logistic model turns today\'s indicators into the probability that the trade above ends with a gain (before costs). ' +
      '50% means no view. The <em>base rate<\/em> is how often such trades gained in the training data; the model starts there and each group of indicators adds or takes away ' +
      '<em>points<\/em> (percentage points of probability). The groups and the top drivers, in plain words, are listed under every probability; "The formula" shows the exact calculation and the fitted numbers.<\/p>' +
      '<h2>"' + esc(D.skill.label) + '"<\/h2><p>Each week the review reruns a walk-forward backtest: the model is fitted only on the past and scored on days it never saw, then compared with ' +
      'the base rate and with simple baselines (always buy, 5-day momentum, RSI mean reversion, the index) after trading costs. ' + esc(D.skill.rule) + ' Until that test is passed, every probability is labelled paper only: ' +
      'it is a hypothesis being tracked, not an edge. Latest verdict: ' + esc(D.skill.why) + '<\/p>' +
      '<h2>Price ranges on the chart<\/h2><p>The shaded fan starts at the last close. The darker band is the <strong>50% range<\/strong> (the close should land inside about half the time), the lighter band with dashed edges the <strong>80% range<\/strong>. ' +
      'They come from a volatility formula, not from the AI, and are scored every day. Gray ranges were made after the session had already opened: kept for the record, never scored.<\/p>' +
      '<h2>Risk/reward<\/h2><p>Upside is the distance from the last close to the top of the 80% range, downside to its bottom. Reward : risk above 1 means the range reaches further up than down. ' +
      'The round-trip cost (buy plus sell, from config/costs.yaml) is shown beside it: a gain smaller than the cost is a loss.<\/p>' +
      '<h2>Open, close and the gap<\/h2><p><strong>Overnight gap<\/strong> = the last session\'s open against the close before it: how much the price jumped before anyone could trade. ' +
      '<strong>Open → close<\/strong> is the move during the session. The signals buy at the open, so a large gap at the next open changes the trade.<\/p>' +
      '<h2>Bull vs bear<\/h2><p>Two research agents argue each side from the stored data and news; the forecaster weighs them and may abstain. Ids in brackets are the cited headlines, listed with their status.<\/p>' +
      '<h2>News badges<\/h2><ul>' + statuses.map(function (s) { return '<li>' + MB.badge(s) + ' ' + esc(meaning[s]) + '<\/li>'; }).join('') + '<\/ul>' +
      '<h2>Market regime<\/h2><p>Calm, trending, event-heavy or unstable, from the volatility index, the benchmark\'s recent moves and scheduled events. Event-heavy and unstable regimes widen the ranges and lower confidence.<\/p>' +
      '<h2>Track record<\/h2><p>Live results only count calls and ranges made before the market opened. Calls are scored two ways, close to close and open to close, and the two are never added together. ' +
      'Each hit rate has a 95% interval (Wilson): with few scored calls the interval is wide and the rate means little. The always-up baseline shows what buying everything would have scored. ' +
      'The historical replay re-runs the rules on past prices and is shown apart because it is not live.<\/p><\/div>';
  };
})(window.MB);

window.MB.boot();</script>
