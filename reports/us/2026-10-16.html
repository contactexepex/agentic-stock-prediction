<style>/* market-brief cockpit: design tokens, scheme v2 "modern admin light" (2026-10-08).
   The owner asked for the look of modern admin templates (Pixinvent Materialize with its semi-dark vertical
   menu, Aurora) applied to a broker-style cockpit: a soft light-grey page, white cards lifted by a faint shadow
   (no hairline borders), one periwinkle-indigo accent, a dark navy sidebar with labels, icon tiles on the KPI
   cards, gradient area charts, generous spacing. Token names keep the Material role vocabulary
   (--md-sys-color-*) so components.css and every page need no renaming; the previous scheme ("terminal
   light") used the same names with other values.
   Verdict rule (owner): NO is red; YES is green, darker green for a strong signal, lighter green for an okay
   one. Up/down/hit/miss always carry a glyph and a word. Text tones are AA on white (figures in the comments);
   the vivid template tones live on fills and tints with a dark ink on them.
   Self-contained: no @import, no font files, system font stack. */
:root {
  color-scheme: light;

  /* ---- Colour roles --------------------------------------------------------------------- */
  --md-sys-color-primary: #5a5ee6;                 /* periwinkle indigo (5.0:1 on white) */
  --md-sys-color-on-primary: #ffffff;
  --md-sys-color-primary-container: #e9eaff;       /* accent tint: selected segment, icon tiles */
  --md-sys-color-on-primary-container: #3a3db8;    /* 7.0:1 on the tint */
  --md-sys-color-secondary: #65708a;
  --md-sys-color-on-secondary: #ffffff;
  --md-sys-color-secondary-container: #eef0f5;
  --md-sys-color-on-secondary-container: #3f4756;
  --md-sys-color-tertiary: #7c3aed;
  --md-sys-color-on-tertiary: #ffffff;
  --md-sys-color-tertiary-container: #f1ebff;      /* Paper tag */
  --md-sys-color-on-tertiary-container: #5b21b6;
  --md-sys-color-error: #dc2626;
  --md-sys-color-on-error: #ffffff;
  --md-sys-color-error-container: #fde8e8;
  --md-sys-color-on-error-container: #991b1b;
  --md-sys-color-surface: #ffffff;
  --md-sys-color-on-surface: #4b465c;              /* ink, 9.0:1 on white */
  --md-sys-color-surface-variant: #f3f4f8;
  --md-sys-color-on-surface-variant: #65708a;      /* muted labels, 5.0:1 on white */
  --md-sys-color-surface-dim: #e4e6ee;
  --md-sys-color-surface-bright: #ffffff;
  --md-sys-color-surface-container-lowest: #ffffff; /* cards */
  --md-sys-color-surface-container-low: #f7f7f9;    /* the page */
  --md-sys-color-surface-container: #f3f4f8;        /* tiles, table heads, inputs */
  --md-sys-color-surface-container-high: #eceef3;   /* table rules, dividers */
  --md-sys-color-surface-container-highest: #e4e6ee;
  --md-sys-color-outline: #a3a9b8;
  --md-sys-color-outline-variant: #e7e9ef;          /* control borders */
  --md-sys-color-inverse-surface: #2f3349;          /* tooltips, the sidebar */
  --md-sys-color-inverse-on-surface: #f4f5fa;
  --md-sys-color-inverse-primary: #b4b6ff;
  --md-sys-color-surface-tint: #5a5ee6;
  --md-sys-color-background: #f7f7f9;
  --md-sys-color-on-background: #4b465c;
  --md-sys-color-scrim: #000000;
  --md-sys-color-shadow: #2f3349;

  /* ---- Sidebar (semi-dark vertical menu) -------------------------------------------------- */
  --mb-sidebar-bg: #2f3349;
  --mb-sidebar-ink: #d7d8e5;         /* 8.8:1 on the sidebar */
  --mb-sidebar-muted: #9fa2b7;       /* 4.9:1 */
  --mb-sidebar-active: linear-gradient(72deg, #5a5ee6 0%, #7a7df0 100%);
  --mb-sidebar-active-shadow: 0 4px 12px rgba(90, 94, 230, .45);

  /* ---- Semantic tokens (finance) --------------------------------------------------------
     up/hit = green, down/miss = red; text tones 5.0:1 / 4.8:1 on white. The tints are fresher than
     before (template "label" badges): ink on tint 6.4:1 / 7.1:1 / 4.6:1. */
  --mb-color-up: #15803d;
  --mb-color-on-up: #ffffff;
  --mb-color-up-container: #e3f8e9;
  --mb-color-on-up-container: #166534;
  --mb-color-down: #dc2626;
  --mb-color-on-down: #ffffff;
  --mb-color-down-container: #fde8e8;
  --mb-color-on-down-container: #991b1b;
  --mb-color-neutral: #65708a;
  --mb-color-on-neutral: #ffffff;
  --mb-color-neutral-container: #eef0f5;
  --mb-color-on-neutral-container: #3f4756;
  --mb-color-warn: #e07b00;               /* "direction unclear", flags (icons and fills) */
  --mb-color-on-warn: #ffffff;
  --mb-color-warn-container: #fff3e0;
  --mb-color-on-warn-container: #b45309;  /* 4.6:1 on the tint, 5.0:1 on white */
  --mb-color-info: #0b8fa6;
  --mb-color-info-container: #e0f7fb;
  --mb-color-on-info-container: #0c5d6b;
  --mb-color-hit: var(--mb-color-up);
  --mb-color-hit-container: var(--mb-color-up-container);
  --mb-color-on-hit-container: var(--mb-color-on-up-container);
  --mb-color-miss: var(--mb-color-down);
  --mb-color-miss-container: var(--mb-color-down-container);
  --mb-color-on-miss-container: var(--mb-color-on-down-container);
  /* Verdict (decision header) */
  --mb-verdict-no-bg: #fde8e8;        --mb-verdict-no-box: #dc2626;    --mb-verdict-no-ink: #991b1b;
  --mb-verdict-strong-bg: #bff0cf;    --mb-verdict-strong-box: #166534; --mb-verdict-strong-ink: #14532d;
  --mb-verdict-ok-bg: #e3f8e9;        --mb-verdict-ok-box: #15803d;    --mb-verdict-ok-ink: #166534;
  /* Provenance labels: Live (green tint), Back-test (hatched accent tint), Mock (dashed), Paper (violet tint).
     Each has a texture or border style besides its colour. */
  --mb-color-live: var(--mb-color-up);
  --mb-color-live-container: var(--mb-color-up-container);
  --mb-color-on-live-container: var(--mb-color-on-up-container);
  --mb-color-backtest: var(--md-sys-color-primary);
  --mb-color-backtest-container: repeating-linear-gradient(135deg, rgba(90,94,230,.14) 0 3px, transparent 3px 6px);
  --mb-color-on-backtest-container: var(--md-sys-color-on-primary-container);
  --mb-color-mock: var(--md-sys-color-outline);
  --mb-color-on-mock-container: var(--md-sys-color-on-surface-variant);
  --mb-color-paper: var(--md-sys-color-tertiary);
  --mb-color-paper-container: var(--md-sys-color-tertiary-container);
  --mb-color-on-paper-container: var(--md-sys-color-on-tertiary-container);

  /* ---- Chart tokens (dataviz skill) ------------------------------------------------------- */
  --mb-chart-surface: var(--md-sys-color-surface-container-lowest);
  --mb-chart-1: #5a5ee6;   /* series 1 = the accent: ranges, model, rule strategies, everything "ours" */
  --mb-chart-2: #e07b00;   /* series 2 (orange; 3.0:1 on white: shapes with direct labels) */
  --mb-chart-3: #0b8fa6;   /* series 3 (teal, 3.8:1) */
  --mb-chart-4: #d6338f;   /* series 4 (pink, 4.4:1) */
  --mb-chart-1-fill: rgba(90,94,230,.28);     /* gradient top of an area chart, fades to 0 */
  --mb-chart-2-fill: rgba(224,123,0,.22);
  --mb-chart-3-fill: rgba(11,143,166,.22);
  --mb-chart-band-50: rgba(90,94,230,.30);   /* inner band, series 1 */
  --mb-chart-band-80: rgba(90,94,230,.12);   /* outer band */
  --mb-chart-fan: rgba(90,94,230,.10);
  --mb-chart-ink: var(--md-sys-color-on-surface);           /* the actual line */
  --mb-chart-grid: var(--md-sys-color-surface-container-high);
  --mb-chart-axis: var(--md-sys-color-outline-variant);
  --mb-chart-label: var(--md-sys-color-on-surface-variant);
  --mb-chart-future: var(--md-sys-color-surface-container-low);

  /* ---- Typography: M3 type scale on the system sans ------------------------------------ */
  --md-ref-typeface-plain: "Inter", "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --md-ref-typeface-brand: var(--md-ref-typeface-plain);
  --md-ref-typeface-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --md-sys-typescale-display-large: 400 57px/64px var(--md-ref-typeface-brand);
  --md-sys-typescale-display-medium: 400 45px/52px var(--md-ref-typeface-brand);
  --md-sys-typescale-display-small: 400 36px/44px var(--md-ref-typeface-brand);
  --md-sys-typescale-headline-large: 600 32px/40px var(--md-ref-typeface-brand);
  --md-sys-typescale-headline-medium: 600 28px/36px var(--md-ref-typeface-brand);
  --md-sys-typescale-headline-small: 600 24px/32px var(--md-ref-typeface-brand);
  --md-sys-typescale-title-large: 600 22px/28px var(--md-ref-typeface-brand);
  --md-sys-typescale-title-medium: 600 16px/24px var(--md-ref-typeface-plain);
  --md-sys-typescale-title-small: 600 14px/20px var(--md-ref-typeface-plain);
  --md-sys-typescale-body-large: 400 16px/24px var(--md-ref-typeface-plain);
  --md-sys-typescale-body-medium: 400 14px/22px var(--md-ref-typeface-plain);
  --md-sys-typescale-body-small: 400 12.5px/18px var(--md-ref-typeface-plain);
  --md-sys-typescale-label-large: 500 14px/20px var(--md-ref-typeface-plain);
  --md-sys-typescale-label-medium: 500 12.5px/16px var(--md-ref-typeface-plain);
  --md-sys-typescale-label-small: 500 11px/16px var(--md-ref-typeface-plain);
  --md-sys-typescale-label-large-tracking: 0.1px;
  --md-sys-typescale-label-medium-tracking: 0.3px;
  --md-sys-typescale-label-small-tracking: 0.4px;
  --md-sys-typescale-title-medium-tracking: 0.1px;
  --md-sys-typescale-body-medium-tracking: 0.15px;
  --md-sys-typescale-body-small-tracking: 0.3px;

  /* ---- Shape ---------------------------------------------------------------------------- */
  --md-sys-shape-corner-none: 0;
  --md-sys-shape-corner-extra-small: 6px;
  --md-sys-shape-corner-small: 8px;
  --md-sys-shape-corner-medium: 12px;
  --md-sys-shape-corner-large: 16px;
  --md-sys-shape-corner-extra-large: 28px;
  --md-sys-shape-corner-full: 9999px;
  --mb-card-radius: 12px;        /* cards */
  --mb-panel-radius: 10px;       /* tiles and columns inside a card */
  --mb-card-border: 1px solid transparent;   /* cards are lifted by a shadow, not a hairline */
  --mb-card-shadow: 0 2px 8px rgba(47, 51, 73, .08), 0 0 1px rgba(47, 51, 73, .14);
  --mb-card-shadow-hover: 0 6px 18px rgba(47, 51, 73, .12), 0 0 1px rgba(47, 51, 73, .14);

  /* ---- Elevation (soft, template-like) --------------------------------------------------- */
  --md-sys-elevation-0: none;
  --md-sys-elevation-1: var(--mb-card-shadow);
  --md-sys-elevation-2: 0 4px 14px rgba(47, 51, 73, .12), 0 0 1px rgba(47, 51, 73, .16);
  --md-sys-elevation-3: 0 8px 24px rgba(47, 51, 73, .16), 0 0 1px rgba(47, 51, 73, .18);
  --md-sys-elevation-4: 0 12px 32px rgba(47, 51, 73, .18);
  --md-sys-elevation-5: 0 16px 40px rgba(47, 51, 73, .22);

  /* ---- State layers --------------------------------------------------------------------- */
  --md-sys-state-hover-opacity: .08;
  --md-sys-state-focus-opacity: .10;
  --md-sys-state-pressed-opacity: .10;
  --md-sys-state-dragged-opacity: .16;
  --md-sys-state-disabled-opacity: .38;
  --md-sys-state-disabled-container-opacity: .12;

  /* ---- Spacing (4px grid) and layout ---------------------------------------------------- */
  --mb-space-1: 4px; --mb-space-2: 8px; --mb-space-3: 12px; --mb-space-4: 16px; --mb-space-5: 20px;
  --mb-space-6: 24px; --mb-space-8: 32px; --mb-space-10: 40px; --mb-space-12: 48px;
  --mb-gutter: 16px;            /* phone side gutter (never less) */
  --mb-gutter-desktop: 24px;
  --mb-content-max: 1240px;
  --mb-sidebar-width: 256px;    /* vertical menu with labels (>= 1200px) */
  --mb-rail-width: 76px;        /* collapsed menu, icons only (600-1199px) */
  --mb-navbar-height: 72px;     /* navigation bar (phone) */
  --mb-topbar-height: 64px;

  /* ---- Motion --------------------------------------------------------------------------- */
  --md-sys-motion-duration-short: 120ms;
  --md-sys-motion-duration-medium: 250ms;
  --md-sys-motion-easing-standard: cubic-bezier(.2, 0, 0, 1);

  /* ---- Focus ring ----------------------------------------------------------------------- */
  --mb-focus-ring: 0 0 0 2px var(--md-sys-color-surface), 0 0 0 4px var(--md-sys-color-primary);
}

/* Type role utility classes (apply to any element) */
.md-display-large { font: var(--md-sys-typescale-display-large); letter-spacing: -0.25px; }
.md-display-medium { font: var(--md-sys-typescale-display-medium); }
.md-display-small { font: var(--md-sys-typescale-display-small); }
.md-headline-large { font: var(--md-sys-typescale-headline-large); }
.md-headline-medium { font: var(--md-sys-typescale-headline-medium); }
.md-headline-small { font: var(--md-sys-typescale-headline-small); }
.md-title-large { font: var(--md-sys-typescale-title-large); }
.md-title-medium { font: var(--md-sys-typescale-title-medium); letter-spacing: var(--md-sys-typescale-title-medium-tracking); }
.md-title-small { font: var(--md-sys-typescale-title-small); letter-spacing: 0.1px; }
.md-body-large { font: var(--md-sys-typescale-body-large); letter-spacing: 0.3px; }
.md-body-medium { font: var(--md-sys-typescale-body-medium); letter-spacing: var(--md-sys-typescale-body-medium-tracking); }
.md-body-small { font: var(--md-sys-typescale-body-small); letter-spacing: var(--md-sys-typescale-body-small-tracking); }
.md-label-large { font: var(--md-sys-typescale-label-large); letter-spacing: var(--md-sys-typescale-label-large-tracking); }
.md-label-medium { font: var(--md-sys-typescale-label-medium); letter-spacing: var(--md-sys-typescale-label-medium-tracking); }
.md-label-small { font: var(--md-sys-typescale-label-small); letter-spacing: var(--md-sys-typescale-label-small-tracking); }
.md-numeric { font-variant-numeric: tabular-nums; }
.md-micro { font: 500 11px/16px var(--md-ref-typeface-plain); letter-spacing: .06em; text-transform: uppercase; color: var(--md-sys-color-on-surface-variant); }

/* market-brief cockpit: DARK colour roles of the design tokens (generated by design/system/dark_tokens.py; edit
   the DARK table there and rerun). Same token names as tokens.css, colour roles only. Loaded after tokens.css: the
   web app imports its copy (web/tools/sync-design.mjs). Applies when the reader's system asks for dark (unless the page sets
   data-theme="light") or when the page sets data-theme="dark". Every text pair is WCAG AA (4.5:1), checked by
   `python design/system/dark_tokens.py --check`. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --md-sys-color-primary: #a8aafa;
  --md-sys-color-on-primary: #1d1f45;
  --md-sys-color-primary-container: #3a3d73;
  --md-sys-color-on-primary-container: #d4d5ff;
  --md-sys-color-secondary: #a3a9bd;
  --md-sys-color-on-secondary: #25293c;
  --md-sys-color-secondary-container: #3b4057;
  --md-sys-color-on-secondary-container: #d7d9e6;
  --md-sys-color-tertiary: #b9a3fb;
  --md-sys-color-on-tertiary: #2a1d52;
  --md-sys-color-tertiary-container: #3d3170;
  --md-sys-color-on-tertiary-container: #ddd2ff;
  --md-sys-color-error: #fb8585;
  --md-sys-color-on-error: #3b0d0d;
  --md-sys-color-error-container: #4c2429;
  --md-sys-color-on-error-container: #fecaca;
  --md-sys-color-surface: #2f3349;
  --md-sys-color-on-surface: #dfe0ec;
  --md-sys-color-surface-variant: #363b53;
  --md-sys-color-on-surface-variant: #bac0d2;
  --md-sys-color-surface-dim: #25293c;
  --md-sys-color-surface-bright: #3b4057;
  --md-sys-color-surface-container-lowest: #2f3349;
  --md-sys-color-surface-container-low: #25293c;
  --md-sys-color-surface-container: #363b53;
  --md-sys-color-surface-container-high: #3d4259;
  --md-sys-color-surface-container-highest: #464c66;
  --md-sys-color-outline: #7a809a;
  --md-sys-color-outline-variant: #464c66;
  --md-sys-color-inverse-surface: #e7e8f0;
  --md-sys-color-inverse-on-surface: #2f3349;
  --md-sys-color-inverse-primary: #5a5ee6;
  --md-sys-color-surface-tint: #a8aafa;
  --md-sys-color-background: #25293c;
  --md-sys-color-on-background: #dfe0ec;
  --md-sys-color-scrim: #000000;
  --md-sys-color-shadow: #000000;
  --mb-sidebar-bg: #1f2233;
  --mb-sidebar-ink: #d7d8e5;
  --mb-sidebar-muted: #a3a7bd;
  --mb-color-up: #4ade80;
  --mb-color-on-up: #0b2a17;
  --mb-color-up-container: #1e3d2c;
  --mb-color-on-up-container: #a7f3c0;
  --mb-color-down: #fb8585;
  --mb-color-on-down: #3b0d0d;
  --mb-color-down-container: #4c2429;
  --mb-color-on-down-container: #fecaca;
  --mb-color-neutral: #a3a9bd;
  --mb-color-on-neutral: #25293c;
  --mb-color-neutral-container: #3b4057;
  --mb-color-on-neutral-container: #d7d9e6;
  --mb-color-warn: #f5a524;
  --mb-color-on-warn: #2e1c00;
  --mb-color-warn-container: #4a3517;
  --mb-color-on-warn-container: #fcd88a;
  --mb-color-info: #38bdd3;
  --mb-color-info-container: #173f49;
  --mb-color-on-info-container: #a5ecf6;
  --mb-verdict-no-bg: #4c2429;
  --mb-verdict-no-box: #fb8585;
  --mb-verdict-no-ink: #fecaca;
  --mb-verdict-strong-bg: #1b5232;
  --mb-verdict-strong-box: #4ade80;
  --mb-verdict-strong-ink: #d1fadf;
  --mb-verdict-ok-bg: #1e3d2c;
  --mb-verdict-ok-box: #22c55e;
  --mb-verdict-ok-ink: #a7f3c0;
  --mb-color-backtest-container: repeating-linear-gradient(135deg, rgba(154,156,248,.18) 0 3px, transparent 3px 6px);
  --mb-chart-1: #9a9cf8;
  --mb-chart-2: #f5a524;
  --mb-chart-3: #38bdd3;
  --mb-chart-4: #f06aae;
  --mb-chart-1-fill: rgba(154,156,248,.32);
  --mb-chart-2-fill: rgba(245,165,36,.26);
  --mb-chart-3-fill: rgba(56,189,211,.26);
  --mb-chart-band-50: rgba(154,156,248,.40);
  --mb-chart-band-80: rgba(154,156,248,.18);
  --mb-chart-fan: rgba(154,156,248,.14);
  --mb-card-shadow: 0 2px 8px rgba(0, 0, 0, .35), 0 0 1px rgba(0, 0, 0, .5);
  --mb-card-shadow-hover: 0 6px 18px rgba(0, 0, 0, .45), 0 0 1px rgba(0, 0, 0, .5);
  --md-sys-elevation-2: 0 4px 14px rgba(0, 0, 0, .4), 0 0 1px rgba(0, 0, 0, .5);
  --md-sys-elevation-3: 0 8px 24px rgba(0, 0, 0, .45), 0 0 1px rgba(0, 0, 0, .55);
  --md-sys-elevation-4: 0 12px 32px rgba(0, 0, 0, .5);
  --md-sys-elevation-5: 0 16px 40px rgba(0, 0, 0, .55);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --md-sys-color-primary: #a8aafa;
    --md-sys-color-on-primary: #1d1f45;
    --md-sys-color-primary-container: #3a3d73;
    --md-sys-color-on-primary-container: #d4d5ff;
    --md-sys-color-secondary: #a3a9bd;
    --md-sys-color-on-secondary: #25293c;
    --md-sys-color-secondary-container: #3b4057;
    --md-sys-color-on-secondary-container: #d7d9e6;
    --md-sys-color-tertiary: #b9a3fb;
    --md-sys-color-on-tertiary: #2a1d52;
    --md-sys-color-tertiary-container: #3d3170;
    --md-sys-color-on-tertiary-container: #ddd2ff;
    --md-sys-color-error: #fb8585;
    --md-sys-color-on-error: #3b0d0d;
    --md-sys-color-error-container: #4c2429;
    --md-sys-color-on-error-container: #fecaca;
    --md-sys-color-surface: #2f3349;
    --md-sys-color-on-surface: #dfe0ec;
    --md-sys-color-surface-variant: #363b53;
    --md-sys-color-on-surface-variant: #bac0d2;
    --md-sys-color-surface-dim: #25293c;
    --md-sys-color-surface-bright: #3b4057;
    --md-sys-color-surface-container-lowest: #2f3349;

/* The reader's daily report (C2). Built on the cockpit design system's tokens (design/system/tokens.css and its
   dark set tokens-dark.css, B7, inlined before this file); only token names are used below. */
:root{--rd-gap:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--md-sys-color-surface-container-low);color:var(--md-sys-color-on-surface);
  font:var(--md-sys-typescale-body-medium);letter-spacing:var(--md-sys-typescale-body-medium-tracking);overflow-wrap:anywhere}
a{color:var(--md-sys-color-primary)}
:focus-visible{outline:2px solid var(--md-sys-color-primary);outline-offset:2px}
h1,h2,h3,p{margin:0} h1,h2,h3{text-wrap:balance}
h1{font:var(--md-sys-typescale-headline-small)} h2{font:var(--md-sys-typescale-title-medium)} h3{font:var(--md-sys-typescale-title-medium)}
.ms{width:1em;height:1em;display:inline-block;vertical-align:-.15em;fill:currentColor;flex:none}
.wrap{max-width:1040px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:var(--rd-gap)}
.micro{font:var(--md-sys-typescale-label-small);letter-spacing:.06em;text-transform:uppercase;color:var(--md-sys-color-on-surface-variant)}
.muted{color:var(--md-sys-color-on-surface-variant)} .small{font:var(--md-sys-typescale-body-small)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--md-sys-color-surface-container-lowest);border-radius:var(--mb-card-radius);box-shadow:var(--mb-card-shadow);
  padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.top{display:flex;flex-direction:column;gap:6px}
.top .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font:var(--md-sys-typescale-label-medium);white-space:nowrap}
.tag.paper{background:var(--md-sys-color-tertiary-container);color:var(--md-sys-color-on-tertiary-container)}
.tag.sim{background:var(--md-sys-color-tertiary-container);color:var(--md-sys-color-on-tertiary-container);letter-spacing:.06em}
.tag.up{background:var(--mb-color-up-container);color:var(--mb-color-on-up-container)}
.tag.down{background:var(--mb-color-down-container);color:var(--mb-color-on-down-container)}
.tag.none{background:var(--mb-color-neutral-container);color:var(--mb-color-on-neutral-container)}
.tag.warn{background:var(--mb-color-warn-container);color:var(--mb-color-on-warn-container)}
.tag.info{background:var(--mb-color-info-container);color:var(--mb-color-on-info-container)}
.up-t{color:var(--mb-color-up)} .down-t{color:var(--mb-color-down)}
/* glance */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--md-sys-color-surface-container);border-radius:var(--mb-panel-radius);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .big{font:var(--md-sys-typescale-title-large);font-variant-numeric:tabular-nums}
.leanbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--md-sys-color-surface-container)}
.leanbar span{display:block;height:100%}
.leanbar .u{background:var(--mb-color-up)} .leanbar .n{background:var(--md-sys-color-outline)} .leanbar .d{background:var(--mb-color-down)}
.leankey{display:flex;gap:12px;flex-wrap:wrap;font:var(--md-sys-typescale-label-large)}
.moves{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.moves li{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-top:1px solid var(--md-sys-color-surface-container-high);padding-top:6px}
.moves button{all:unset;cursor:pointer;font-weight:600;color:var(--md-sys-color-primary)}
.headline{font:var(--md-sys-typescale-body-large)}
.top3{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
/* controls */
.controls{position:sticky;top:0;z-index:5;background:var(--md-sys-color-surface-container-low);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--md-sys-color-outline-variant)}
.seg{display:inline-flex;background:var(--md-sys-color-surface-container);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--md-sys-color-on-surface-variant);font:var(--md-sys-typescale-label-large);padding:6px 12px;border-radius:999px;cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--md-sys-color-surface-container-lowest);color:var(--md-sys-color-on-primary-container);box-shadow:var(--mb-card-shadow)}
.controls select{font:var(--md-sys-typescale-label-large);padding:6px 8px;border-radius:8px;border:1px solid var(--md-sys-color-outline-variant);background:var(--md-sys-color-surface-container-lowest);color:var(--md-sys-color-on-surface);min-height:34px;max-width:100%}
.controls .count{margin-left:auto;font:var(--md-sys-typescale-body-small);color:var(--md-sys-color-on-surface-variant)}
.hzline{font:var(--md-sys-typescale-body-small);color:var(--md-sys-color-on-surface-variant);width:100%}
@media (max-width:560px){.controls{position:static;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .controls .seg{grid-column:1 / -1;justify-content:space-between} .controls .seg button{flex:1}
  .controls select{width:100%} .controls .count{grid-column:1 / -1;margin-left:0}}
.key{display:flex;flex-wrap:wrap;gap:10px 16px;font:var(--md-sys-typescale-body-small);color:var(--md-sys-color-on-surface-variant)}
.key span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:16px;height:10px;border-radius:3px}
/* company cards */
.cards{display:grid;grid-template-columns:1fr;gap:var(--rd-gap)}
@media (min-width:880px){.cards{grid-template-columns:1fr 1fr}}
.co-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.co-head .tk{font:var(--md-sys-typescale-body-small);color:var(--md-sys-color-on-surface-variant)}

.why{font:var(--md-sys-typescale-body-medium)}
.flags{display:flex;flex-wrap:wrap;gap:6px}

.chg,.paperline{font:var(--md-sys-typescale-body-small);color:var(--md-sys-color-on-surface-variant)}
details{border-top:1px solid var(--md-sys-color-surface-container-high);padding-top:8px}

.more{display:flex;flex-direction:column;gap:8px}

th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--md-sys-color-surface-container-high)}

.tbl{overflow-x:auto}
.empty{color:var(--md-sys-color-on-surface-variant)}
#tip{position:fixed;pointer-events:none;background:var(--md-sys-color-inverse-surface);color:var(--md-sys-color-inverse-on-surface);border-radius:8px;padding:6px 10px;font:var(--md-sys-typescale-body-small);z-index:20;max-width:240px}

.idx{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}

// ---------- the day in 20 seconds ----------
function trackLine(){
  const pts = (D.calibration || []).filter(p => p.kind === 'range' && p.stated === 0.8 && /N\+/.test(p.label) && p.actual != null);
  const n = pts.reduce((a, p) => a + p.n, 0), hits = Math.round(pts.reduce((a, p) => a + p.actual * p.n, 0));
  if (!n) return 'No forecast has been checked against the real price yet.';
  if (n < D.min_sample) return 'Only ' + n + ' forecast ranges checked so far: too few to judge.';
  return 'So far the 80% ranges held the real price ' + hits + ' of ' + n + ' times (' + pct0(hits / n) + '; the aim is 80%).';
}

// ---------- fan chart: the last closes, then the N+1/N+3/N+5 ranges (50% and 80%) and expected prices ----------
function fanChart(c, h){
  const W = 340, Ht = 168, L = 6, Rr = 62, T = 10, B = 22;
  const bars = c.bars || [], n = bars.length;
  const fs = (c.forecasts || []).filter(f => f.lo80 != null && f.hi80 != null).sort((a, b) => a.h - b.h);
  const off = f => f.h + 1;   // the exit session is k + 1 sessions after the as-of close (D, then k more)
  const maxOff = fs.length ? Math.max(...fs.map(off)) : 0;
  const base = fs.length ? fs[0].base_close : (n ? bars[n - 1].c : null);
  // history on the left 62% of the plot, the future (up to the farthest exit session) on the right 38%
  const split = L + (W - L - Rr) * (maxOff ? 0.62 : 1), last = n - 1;
  const xs = i => i <= last ? L + (split - L) * i / Math.max(1, last) : split + (W - Rr - split) * (i - last) / Math.max(1, maxOff);
  const vals = bars.map(b => b.c).concat(fs.flatMap(f => [f.lo80, f.hi80])).filter(v => v != null);
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.06 || hi * 0.01 || 1; lo -= pad; hi += pad;
  const ys = v => T + (Ht - T - B) * (hi - v) / (hi - lo);
  const sel = fs.find(f => f.h === h);
  const s = svg('svg', {class: 'fan', viewBox: `0 0 ${W} ${Ht}`, role: 'img',
    'aria-label': c.name + ': last ' + n + ' closing prices' + (sel ? '; N+' + h + ' expected price ' + fmtMoney(sel.target) + ', 80% range ' + fmtMoney(sel.lo80) + ' to ' + fmtMoney(sel.hi80) : '')});
  if (n) s.append(svg('rect', {x: xs(last), y: T, width: Math.max(0, W - Rr - xs(last)), height: Ht - T - B, fill: 'var(--md-sys-color-surface-container)', opacity: 0.6}));
  [lo + pad, hi - pad].forEach(v => { s.append(svg('line', {x1: L, x2: W - Rr, y1: ys(v), y2: ys(v), stroke: 'var(--mb-chart-grid)', 'stroke-width': 1}));
    s.append(sText(W - Rr + 6, ys(v) + 4, fmtNum(v))); });
  if (fs.length && n && base != null) {
    const pts = [[last, base, base, base, base]].concat(fs.map(f => [last + off(f), f.lo80, f.hi80, f.lo50, f.hi50]));
    const area = (a, b) => 'M' + pts.map(p => xs(p[0]) + ',' + ys(p[b])).join('L') + 'L' + pts.slice().reverse().map(p => xs(p[0]) + ',' + ys(p[a])).join('L') + 'Z';
    s.append(svg('path', {d: area(1, 2), fill: 'var(--mb-chart-band-80)'}));
    if (fs.every(f => f.lo50 != null)) s.append(svg('path', {d: area(3, 4), fill: 'var(--mb-chart-band-50)'}));
    if (sel) s.append(svg('line', {x1: xs(last + off(sel)), x2: xs(last + off(sel)), y1: T, y2: Ht - B, stroke: 'var(--md-sys-color-primary)', 'stroke-width': 1, 'stroke-dasharray': '3 3'}));
    // expected prices: dots joined by a dashed line from the last close (B15's company-page fan)
    const tg = fs.filter(f => f.target != null);
    if (tg.length) s.append(svg('path', {d: 'M' + xs(last) + ',' + ys(base) + tg.map(f => 'L' + xs(last + off(f)) + ',' + ys(f.target)).join(''),
      fill: 'none', stroke: 'var(--mb-chart-1)', 'stroke-width': 1.5, 'stroke-dasharray': '4 3'}));
    tg.forEach(f => { const on = f === sel;
      s.append(svg('circle', {cx: xs(last + off(f)), cy: ys(f.target), r: on ? 5 : 3.5, fill: 'var(--mb-chart-1)', stroke: 'var(--md-sys-color-surface-container-lowest)', 'stroke-width': 1.5})); });
    if (sel && sel.target != null) {   // the selected expected price as a filled tag on the price axis
      const ty = Math.min(Ht - B - 8, Math.max(T + 8, ys(sel.target))), label = fmtNum(sel.target);
      s.append(svg('rect', {x: W - Rr + 2, y: ty - 9, width: Math.min(Rr - 2, 8 + label.length * 6.4), height: 18, rx: 4, fill: 'var(--mb-chart-1)'}));
      s.append(sText(W - Rr + 6, ty + 4, label, {fill: 'var(--md-sys-color-on-primary)', 'font-weight': 700}));
    }
  }
  if (n) {
    s.append(svg('path', {d: bars.map((p, i) => (i ? 'L' : 'M') + xs(i) + ',' + ys(p.c)).join(''), fill: 'none', stroke: 'var(--mb-chart-ink)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'}));
    s.append(svg('circle', {cx: xs(last), cy: ys(bars[last].c), r: 3.5, fill: 'var(--mb-chart-ink)'}));
    s.append(sText(xs(0), Ht - 6, fmtDay(bars[0].d)));
    s.append(sText(xs(last), Ht - 6, fmtDay(bars[last].d), {'text-anchor': 'end'}));
  }
  if (sel) s.append(sText(Math.max(xs(last + off(sel)), xs(last) + 4), Ht - 6, fmtDay(sel.exit_date), {'text-anchor': 'start', fill: 'var(--md-sys-color-primary)'}));
  const hit = svg('rect', {x: 0, y: 0, width: W, height: Ht, fill: 'transparent'}); s.append(hit);
  hit.addEventListener('pointermove', ev => {
    const box = s.getBoundingClientRect(), px = (ev.clientX - box.left) * W / box.width;
    let best = null, bd = 1e9;
    bars.forEach((p, i) => { const d = Math.abs(xs(i) - px); if (d < bd) { bd = d; best = {p: p}; } });
    fs.forEach(f => { const d = Math.abs(xs(last + off(f)) - px); if (d < bd) { bd = d; best = {f: f}; } });
    if (!best) return;
    if (best.p) showTip(ev, [[fmtDay(best.p.d, true)], ['close', fmtMoney(best.p.c)]]);
    else { const f = best.f; showTip(ev, [['N+' + f.h + ' · measured at the close of ' + f.exit_label], ['expected', fmtMoney(f.target)],
      ['to ' + fmtMoney(f.hi50) + ' (50%)', fmtMoney(f.lo50)], ['to ' + fmtMoney(f.hi80) + ' (80%)', fmtMoney(f.lo80)]]); }
  });
  hit.addEventListener('pointerleave', hideTip);
  return s;
}

function oddsMeter(f){
  const box = el('div', {class: 'odds'});
  const row = el('div', {class: 'row'});
  row.append(el('span', {class: 'small muted'}, 'Chance of going up by ' + (f && f.exit_label ? f.exit_label : 'the sell day')));
  row.append(el('b', {class: f && f.lean === 'up' ? 'up-t' : f && f.lean === 'down' ? 'down-t' : ''}, f && f.prob_up != null ? pct0(f.prob_up) : 'no score'));
  box.append(row);
  if (f && f.prob_up != null) {
    const m = el('div', {class: 'meter', role: 'img', 'aria-label': 'Chance of going up ' + pct0(f.prob_up) + ' on a scale from 25% to 75%; the middle mark is 50%, a coin flip'});
    const d = el('span', {class: 'dot'}); d.style.left = (100 * Math.max(0, Math.min(1, (f.prob_up - 0.25) / 0.5))) + '%';
    d.style.background = f.lean === 'up' ? 'var(--mb-color-up)' : f.lean === 'down' ? 'var(--mb-color-down)' : 'var(--md-sys-color-outline)';
    m.append(el('span', {class: 'mid'}), d); box.append(m);
    const sc = el('div', {class: 'meter-scale'}); sc.append(el('span', null, '25% · down'), el('span', null, '50% coin flip'), el('span', null, 'up · 75%')); box.append(sc);
  }
  return box;
}

// ---------- the N+1 / N+3 / N+5 table ----------
const rangeText = (a, b) => a == null || b == null ? '–' : fmtNum(a) + '–​' + fmtNum(b);
function horizonTable(c, h){
  const g = el('div', {class: 'hz', role: 'table', 'aria-label': 'Forecast per horizon'});
  const cols = HS.map(x => fc(c, x));
  const cell = (cls, text, on) => el('div', {class: cls + (on ? ' sel' : ''), role: 'cell'}, text);
  g.append(cell('h l', ''), ...HS.map((x, i) => cell('h', 'N+' + x, x === h)));
  [['Close of', f => f && f.exit_label ? f.exit_label.replace(/^\w+ /, '') : '–'],
   ['Expected', f => f ? fmtNum(f.target) : '–'],
   ['50% range', f => f ? rangeText(f.lo50, f.hi50) : '–'],
   ['80% range', f => f ? rangeText(f.lo80, f.hi80) : '–'],
   ['Chance up', f => f && f.prob_up != null ? pct0(f.prob_up) : '–']].forEach(r => {
    g.append(cell('l', r[0])); cols.forEach((f, i) => g.append(cell('v', r[1](f), HS[i] === h)));
  });
  return g;
}

  const a = el('article', {class: 'card co', id: 'co-' + c.ticker.replace(/[^A-Za-z0-9]/g, '_')});
  const head = el('div', {class: 'co-head'});
  const nm = el('div'); nm.append(el('h3', null, c.name), el('div', {class: 'tk'}, c.ticker + (c.sector ? ' · ' + c.sector : '')));
  const lean = f ? f.lean : 'none';
  head.append(nm, tag(f && f.prob_up != null ? lean : 'none', (lean === 'up' ? '▲ ' : lean === 'down' ? '▼ ' : '● ') + leanText(f)));
  a.append(head);
  // an evening-run range (B17/B12: the company had no pre-open range for this as-of date yet) is a preview only
  if (f && f.run === 'evening') a.append(tag('warn', R.preview_label || 'Preview (evening run, never traded)', 'warning'));
  const p = el('div', {class: 'co-price'});
  p.append(document.createTextNode('Last close '), el('b', null, fmtMoney(f && f.base_close != null ? f.base_close : c.close)), document.createTextNode(' '));
  if (c.ret_1d != null) p.append(el('span', {class: c.ret_1d > 0 ? 'up-t' : c.ret_1d < 0 ? 'down-t' : ''}, arrow(c.ret_1d) + fmtFrac(c.ret_1d)));
  p.append(document.createTextNode(' on ' + D.as_of_label + (f && f.target != null ? ' · expected ' + fmtMoney(f.target) + ' (' + fmtPctU(f.move_pct) + ') by ' + f.exit_label : '')));
  a.append(p);
  if ((c.forecasts || []).some(x => x.lo80 != null)) a.append(fanChart(c, H));
  else a.append(el('p', {class: 'empty'}, 'No price range today' + (c.quality ? ' (data quality: ' + c.quality + ')' : '') + '.'));
  a.append(oddsMeter(f));
  if ((c.forecasts || []).length) a.append(horizonTable(c, H));
  a.append(el('p', {class: 'why'}, f ? f.why : 'No forecast for this horizon today.'));
  if ((c.flags || []).length) { const fl = el('div', {class: 'flags'}); c.flags.forEach(x => fl.append(tag(x.code === 'blocked' || x.code === 'contradicted' ? 'down' : 'warn', x.text, 'warning'))); a.append(fl); }
  const ch = f && f.change;
  if (ch) {
    const bits = [];
    if (ch.target_pct != null) bits.push('expected price ' + fmtPctU(ch.target_pct));
    if (ch.prob_pts != null && Math.abs(ch.prob_pts) >= 0.0005) bits.push('chance of going up ' + fmtPts(ch.prob_pts));
    if ((ch.news_added || []).length) bits.push(ch.news_added.length + ' new news item' + (ch.news_added.length === 1 ? '' : 's') + ' counted');
    if (bits.length) a.append(el('p', {class: 'chg'}, 'Since the previous day’s forecast (' + fmtTime(ch.since) + '): ' + bits.join(' · ') + '.'));
  }
  const P = R.paper || {};
  if (P.live) {
    const t = (P.by_ticker || {})[c.ticker], w = ((P.tiers || {})[c.ticker] || {})[String(H)];
    const pl = el('p', {class: 'paperline'}); pl.append(tag('sim', 'SIMULATED'), document.createTextNode(' ' + (t ? t.n + ' open paper trade' + (t.n === 1 ? '' : 's') + (t.avg_pct != null ? ', average ' + fmtPctU(t.avg_pct, 2) : '') : 'No open paper trades') + (w ? ' · signal tier at N+' + H + ': ' + w : '')));
    a.append(pl);
  }
  a.append(moreDetails(c));
  return a;
}

function moreDetails(c){
  const d = el('details'); d.append(el('summary', null, 'News, events and the analysts’ view'));
  const body = el('div', {class: 'more'});
  (c.calls || []).forEach(cl => {
    body.append(el('h4', null, 'AI forecaster, ' + cl.when + ': ' + cl.direction + ' at ' + pct0(cl.confidence) + ' confidence'));
    if (cl.rationale) body.append(el('p', null, cl.rationale));
  });
  if ((c.news || []).length) { body.append(el('h4', null, 'Latest news')); const ul = el('ul');
    c.news.forEach(n => { const li = el('li'); li.append(linkOrText(n.url, n.title));
      const meta = el('div', {class: 'small muted'}); meta.append(document.createTextNode((n.source || '') + (n.ts ? ' · ' + fmtDay(n.ts) : '') + ' '));
      if (n.verification) meta.append(statusTag(n.verification)); li.append(meta); ul.append(li); });
    body.append(ul); }
  const added = ((fc(c, H) || {}).change || {}).news_added || [];
  if ((c.events || []).length) { body.append(el('h4', null, 'Coming up')); const ul = el('ul');
    c.events.forEach(e => ul.append(el('li', null, e.day + ' · ' + e.label + (e.market ? ' (whole market)' : '')))); body.append(ul); }
  const sec = (N.sectors || {})[c.sector];
  if (sec) { body.append(el('h4', null, c.sector + ': analysts’ view')); body.append(htmlBlock('prose', sec)); }
  if (c.record) { const parts = Object.keys(c.record.ranges || {}).map(k => c.record.ranges[k].name + ' 80% ranges: ' + c.record.ranges[k].text);
    body.append(el('h4', null, 'Track record for ' + c.ticker)); body.append(el('p', {class: 'small'}, (parts.length ? parts.join(' ') : 'No ranges checked yet.') + ' Calls: ' + ((c.record.calls || {}).text || 'none checked yet.'))); }
  if (added.length) body.append(el('p', {class: 'small muted'}, added.length + ' news item(s) newly counted by the model since the previous day’s forecast.'));
  if (!body.childNodes.length) body.append(el('p', {class: 'empty'}, 'No news or events found for this company.'));
  d.append(body);
  return d;
}

// ---------- controls ----------
const fs = $('#f-sector'), fl = $('#f-lean'), fo = $('#f-sort'), fh = $('#f-horizon');
fs.append(el('option', {value: ''}, 'All sectors'));
Array.from(new Set(COS.map(c => c.sector).filter(Boolean))).forEach(x => fs.append(el('option', {value: x}, x)));
HS.forEach(h => { const b = el('button', {type: 'button', 'aria-pressed': String(h === H)}, 'N+' + h);
  b.addEventListener('click', () => { H = h; fh.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); renderAll(); }); fh.append(b); });
function visible(){
  const strength = c => { const f = fc(c, H); return f && f.prob_up != null ? Math.abs(f.prob_up - 0.5) : -1; };
  const move = c => { const f = fc(c, H); return f && f.move_pct != null ? Math.abs(f.move_pct) : -1; };
  const list = COS.filter(c => (!fs.value || c.sector === fs.value) && (!fl.value ||
    (fl.value === 'flag' ? (c.flags || []).length > 0 : (fc(c, H) || {lean: 'none'}).lean === fl.value)));
  const by = fo.value === 'move' ? (a, b) => move(b) - move(a) : fo.value === 'name' ? null : (a, b) => strength(b) - strength(a);
  return list.slice().sort((a, b) => (by ? by(a, b) : 0) || a.name.localeCompare(b.name));
}
function renderCards(){
  const list = visible(), cs = $('#cards');
  cs.replaceChildren(...list.map(card));
  if (!list.length) cs.append(el('p', {class: 'empty'}, 'No company matches. Choose another sector or “All companies”.'));
  $('#f-count').textContent = list.length + ' of ' + COS.length + ' companies';
  const ex = exitOf(H);
  $('#f-hzline').textContent = ex ? 'N+' + H + ': from the opening price of ' + fmtDay(ex.entry_date, true) + ' to the close of ' + ex.exit_label + '.' : '';
}
function focusCard(t){
  fs.value = ''; fl.value = ''; renderCards();
  const node = document.getElementById('co-' + t.replace(/[^A-Za-z0-9]/g, '_'));
  if (node) { node.scrollIntoView({behavior: 'smooth', block: 'start'}); $('details', node).open = true; }
}
[fs, fl, fo].forEach(x => x.addEventListener('change', renderCards));

// ---------- track record ----------
function renderTrack(){
  const s = $('#track'); s.replaceChildren();
  const head = el('div', {class: 'card-head'}); head.append(el('h2', null, 'Track record so far'), tag('paper', R.paper_label || 'Paper only — no proven edge yet')); s.append(head);
  const pts = (D.calibration || []).filter(p => p.kind === 'range' && p.actual != null && p.n > 0);
  if (!pts.length) { s.append(el('p', {class: 'empty'}, 'Nothing has been checked yet: forecasts are scored once their sell day has closed.')); return; }
  s.append(el('p', {class: 'small muted'}, 'How often the real closing price ended inside each kind of range (bar) against the aim (black mark). All companies of this market.' + (pts.every(p => p.n < D.min_sample) ? ' Fewer than ' + D.min_sample + ' checks each: too early to judge.' : '')));
  pts.forEach(p => { const r = el('div', {class: 'rec'});
    r.append(el('span', null, p.label), el('span', {class: 'num'}, pct0(p.actual) + ' of ' + p.n + ' · aim ' + pct0(p.stated)));
    const bar = el('div', {class: 'bar'}), fill = el('i'), aim = el('b'); fill.style.width = (100 * p.actual) + '%'; aim.style.left = (100 * p.stated) + '%';
    bar.append(fill, aim); r.append(bar); s.append(r); });
  const cs = D.call_scores || {n: 0};
  s.append(el('p', {class: 'small'}, cs.n ? 'AI up/down calls checked: ' + cs.n + '.' + (cs.basis_note ? ' ' + cs.basis_note : '') : 'No AI up/down call has been checked yet.'));
}

// ---------- notes, data quality, footer ----------
function renderNotes(){
  const s = $('#notes');
  s.append(el('h2', null, 'Analyst notes'));
  [['Yesterday', N.yesterday], ['Calls and abstentions', N.calls], ['This week: risks and events', N.outlook]].forEach(x => {
    if (!x[1] && !x[0].startsWith('This week')) return;
    const d = el('details'); d.append(el('summary', null, x[0]));
    if (x[1]) d.append(htmlBlock('prose', x[1]));
    if (x[0].startsWith('This week') && (D.upcoming || []).length) { const ul = el('ul', {class: 'list'}); D.upcoming.forEach(e => ul.append(el('li', null, e.day + ' · ' + e.label + (e.major ? ' (major)' : '')))); d.append(ul); }
    s.append(d);
  });
  const Q = D.quality || {partial: [], blocked: [], regime_notes: []}, dq = el('details');
  const nWarn = Q.partial.length + Q.blocked.length + Q.regime_notes.length;
  dq.append(el('summary', null, 'Data quality' + (nWarn ? ' (' + nWarn + ' warning' + (nWarn > 1 ? 's' : '') + ')' : '')));
  const b = el('div', {class: 'prose'});
  b.append(el('p', null, 'Indicators: ' + (Q.blocked.length ? 'blocked (no forecast trusted): ' + Q.blocked.join(', ') + '. ' : 'none blocked. ') + (Q.partial.length ? 'Partial data: ' + Q.partial.join(', ') + '.' : 'No partial data.')));
  if (Q.regime_notes.length) b.append(el('p', null, 'Market mood notes: ' + Q.regime_notes.join('; ')));
  if (N.data_quality) b.append(htmlBlock('prose', N.data_quality));
  dq.append(b); s.append(dq);
  const ft = $('#footer');
  ft.append(el('p', null, 'Research log, not investment advice. Numbers come from the stored data as of ' + fmtTime(R.cutoff || D.generated_at) + '; the text is written by research agents, checked by automated validation and sampled weekly by a separate judge agent.'));
  const fl2 = el('p'); fl2.append(document.createTextNode('Built ' + String(D.generated_at).replace('T', ' ').replace('+00:00', ' UTC') + ' · '));
  if (location.protocol === 'file:' || !safeUrl(D.links.app)) {   // the attached file: links to its neighbours
    fl2.append(el('a', {href: D.links.index}, 'All report days'), document.createTextNode(' · '), el('a', {href: D.links.md}, 'Text version'));
  } else fl2.append(el('a', {href: safeUrl(D.links.app), rel: 'noopener'}, 'Open full app'));   // the public brief: one plain link
  ft.append(fl2);
}

function renderAll(){ renderGlance(); renderChanges(); renderPaper(); renderCards(); }
renderTop(); renderLegend(); renderTrack(); renderNotes(); renderAll();
const hash = decodeURIComponent(location.hash.slice(1));
if (hash && BY[hash]) focusCard(hash);

})();</script>
