# The assistant chat (dashboard panel and Slack /ask, session B8; docs/SPEC.md F11): read tools and explain only. Writes stay
# buttons and forms, so text the model reads (news titles, filings, Slack messages) can never trigger a write.
agent: assistant
channels: [dashboard, slack]
enabled: true
tools: [get_overview, get_company, get_scoreboard, compare_rule_vs_ai, get_news, get_trades, explain]
daily_write_budget: 0
daily_read_budget: 500
fail_to: owner
