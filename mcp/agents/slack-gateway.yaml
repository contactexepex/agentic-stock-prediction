# The Slack commands /company, /trade and /ask (web/app/slack/, docs/SPEC.md F10; ARCHITECTURE.md section 10).
# Any member of #market-brief may give commands (decision 15); delete is never available in Slack.
# enabled: false stops every call of this agent (kill switch; MB_KILL_SWITCH and the inbox `controls` table stop it
# without a deploy). Budgets count the agent's calls per UTC day across all its users.
agent: slack-gateway
channels: [slack]
enabled: true
tools: [explain, add_company, deactivate_company, reactivate_company, set_paper_amount, add_paper_trade]
daily_write_budget: 20
daily_read_budget: 200
fail_to: owner   # refusals and anything ambiguous: a Slack DM to SLACK_OWNER_USER_ID
