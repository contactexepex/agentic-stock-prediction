[pytest]
testpaths = tests
# --dist loadgroup needs pytest-xdist, a required dev dependency (requirements.txt); without -n it is inert
addopts = --strict-markers --dist loadgroup
markers =
    slow: end-to-end or integration test (scripts run as subprocesses, replays, the full pipeline); the fast tier is -m "not slow"
    xdist_group(name): run these tests on one xdist worker (set by tests/conftest.py)
    network: may reach the network (the test network guard is off for it); only the opt-in live Neo4j test
