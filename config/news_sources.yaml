# News agencies: an item whose byline, JSON-LD provider, dateline ("(Reuters) -"), title ("By Reuters")
# or text attribution ("Reuters reported", "according to a Reuters report", "told PTI", "with inputs
# from PTI") names one is a copy of that agency's story: one origin, however many outlets carry it.
# names: matched as the whole byline/provider/source label; attribution: names used in the text
# patterns (ambiguous short names such as AP are left out there).
wires:
  Reuters: {names: [Reuters, Reuters Staff, Thomson Reuters], attribution: [Reuters], domains: [reuters.com]}
  Bloomberg: {names: [Bloomberg, Bloomberg News], attribution: [Bloomberg, Bloomberg News], domains: [bloomberg.com]}
  AP: {names: [AP, Associated Press, The Associated Press], attribution: [Associated Press, The Associated Press], domains: [apnews.com]}
  PTI: {names: [PTI, Press Trust of India], attribution: [PTI, Press Trust of India], domains: [ptinews.com]}
  IANS: {names: [IANS, IANS Live], attribution: [IANS], domains: [ianslive.in]}
  ANI: {names: [ANI, Asian News International], attribution: [ANI], domains: [aninews.in]}
  AFP: {names: [AFP, Agence France-Presse], attribution: [AFP, Agence France-Presse], domains: [afp.com]}
  Dow Jones: {names: [Dow Jones, Dow Jones Newswires], attribution: [Dow Jones Newswires], domains: [dowjones.com]}

# Vendor or promotional content, flagged `promotional` and never counted as an independent origin:
# matched on the JSON-LD provider, the byline or the source label (whole name, case-insensitive),
# on the domain, or on marker phrases in the text.
promotional:
  providers: [TIKR, TIKR.com, Simply Wall St, Simply Wall St., Simply Wall Street, Zacks, Zacks Investment Research,
              Zacks Equity Research, The Motley Fool, Motley Fool, InvestorPlace, 24/7 Wall St., 247wallst.com,
              Insider Monkey, insidermonkey.com, MarketBeat, StockStory, Kalkine Media, kalkine.ca, kalkinemedia.com,
              Intellectia, Intellectia AI, Pluang, TradingKey, ad-hoc-news.de, Stock Titan, Trefis, GuruFocus, TipRanks,
              ChartMill, FinanceBuzz]
  domains: [tikr.com, simplywall.st, zacks.com, fool.com, investorplace.com, 247wallst.com, insidermonkey.com,
            marketbeat.com, stockstory.org, kalkine.ca, kalkinemedia.com, intellectia.ai, pluang.com, tradingkey.com,
            ad-hoc-news.de, stocktitan.net, trefis.com, gurufocus.com, tipranks.com, chartmill.com]
  text: ['Potential Total Return', 'Target Price \(Mid\)', 'Zacks Rank #', 'Simply Wall St has no position',
         'The Motley Fool has positions in', 'sponsored (?:content|post)', 'paid (?:promotion|advertisement)',
         'advertorial']

clusters:
  window_hours: 72              # items of one ticker within this many hours can share a cluster
  lookback_hours: 144           # items considered per run (clusters are written only when one of their items is in the last window_hours)
  title_jaccard: 0.5            # informative title tokens (stopwords and the company's own name removed)
  title_min_shared: 2           # ... and at least this many shared tokens
  copy_containment: 0.5         # MinHash 6-shingle containment at or above this = same origin (and same event)
  min_shingles: 30              # both texts need this many shingles for the copy test
  sec_forms: [8-K, 8-K/A, 6-K, 10-Q, 10-K, 20-F, SC 13D, SCHEDULE 13D, SC 13D/A, 425, S-1, DEFA14A]
