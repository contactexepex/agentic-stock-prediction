# Range engine settings (docs/DESIGN.md section 4). Shared by both markets.
horizons: [1, 5]            # trading days ahead
# Published bands are fixed: a 50% range and an 80% range.

ewma_lambda: 0.94           # volatility decay; recent days count more
warmup_bars: 60             # bars needed before a volatility estimate is trusted

# Calibration pool: standardized returns from stored history plus live scored ranges.
history_sessions: 500       # ~2 years of trading days
half_life_sessions: 120     # recency weighting: an observation 120 sessions old counts half
live_weight: 2.0            # live scored ranges count this much more than history
min_pool: 200               # below this, fall back to normal-distribution quantiles

# Centre adjustments (log-return drift, capped).
cue_weight: 0.5             # share of the overnight cue (pre-market gap / ADR move) applied
ai_drift_scale: 0.5         # max AI drift = (confidence - 0.5) x this x horizon sigma
max_center_shift_sigma: 0.5 # hard cap on total centre shift, in horizon sigmas

# Width adjustments.
earnings_vol_multiple: 3.0  # an earnings day moves like this many normal days (variance add)
earnings_vol_multiple_by_market: {india: 2.0}  # per-market override; India x2: backtest, DESIGN section 11
major_event_factor: 1.15    # market-wide major event inside the horizon
regime_factor: {CALM: 1.0, TRENDING: 1.0, EVENT_HEAVY: 1.1, UNSTABLE: 1.25}
max_ai_widen: 0.5           # AI may widen a range by at most 50%, never narrow it

# Range inputs (docs/DESIGN.md sections 4 and 11). `enabled`: true, false, a list of markets, or
# market -> true/false or a list of horizons ({us: [1]} = US 1-day ranges only).
# Rule for the defaults (DESIGN section 7): on for a market and horizon only if scripts/backtest.py
# over the stated 250 sessions lowers the 80% interval score where the input applies by more
# than backtest_min_gain (relative; smaller changes are noise). Implied vol has no stored
# history, so it cannot pass the rule: off, and ranges.py records its horizon sigma as the shadow
# value `iv_sigma_h` for the weekly review.
backtest_min_gain: 0.005    # 0.5% of the interval score
earnings_history:           # size the earnings widening from the stock's past earnings-day moves
  enabled: {us: [1]}        # US 5d worse at 250 sessions; India 1d and 5d worse than its fixed x2
  min_events: 2             # fewer past reactions -> fixed earnings_vol_multiple
  prior_events: 4           # shrink towards earnings_vol_multiple as if it were this many events
  lookback_events: 12       # most recent reactions used
  max_multiple: 8.0         # cap on the earnings-day multiple (also caps the options-implied one)
ex_dividend:                # shift the centre down by dividends going ex inside the horizon
  enabled: true
beta_split:                 # centre = beta x index cue + own cue net of beta x index cue
  enabled: {india: [1]}     # India 5d: noise at 250, worse at 440; US: same as the direct cue
  index_weight: 0.5         # share of the expected index move applied
  own_weight: 0.5           # share of the stock's own cue (ADR / pre-market) beyond beta x index
  beta_clip: [0.0, 2.5]
  fit_sessions: 250         # index_cue beta "fit": regression window
implied_vol:                # US option chains (collect_options.py); no backtest -> shadow only
  enabled: false
  weight: 0.5               # share of implied variance in the daily volatility blend
  max_age_days: 1           # snapshot must be from the run day or the day before (UTC)
  max_expiry_days: 30       # use the first expiry on/after the target date, at most this far out
  use_for_earnings: true    # earnings before that expiry: IV sets the earnings multiple instead

# Relationship risk flags (scripts/relations.py; markets with a `relations:` block). Extra width
# per flag type, summed per ticker and capped. Off by default: switch on only if the weekly
# review shows flagged tickers' ranges miss more often than the rest.
relation_widen:
  enabled: false
  big_deal: 0.10
  pledge_increase: 0.10
  pledge_created: 0.05
  pledge_invoked: 0.15
  insider_sale: 0.05
  max: 0.20

# Smart-money risk flag (scripts/smart_money.py): an original Schedule 13D (activist stake)
# filed within activist_13d_days before as_of adds a note to the ticker's ranges. The factor
# widens sigma only when > 1.0 (e.g. 1.05 = +5%); keep 1.0 until the weekly review shows value.
activist_13d_days: 30
activist_13d_factor: 1.0
