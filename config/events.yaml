# Scheduled market events used for the regime (EVENT_HEAVY) and range widening.
# Company earnings and ex-dividend dates are collected automatically (collect_events.py).
# `major: true` events raise the regime to EVENT_HEAVY when within 2 calendar days.
# If a rule date is not a trading day, the event moves to the previous trading day; `skip`
# lists rule dates that do not happen at all. `session_offset: -N` then steps N sessions back.
# Rules: third_friday, first_friday, last_weekday (weekday 0 = Monday), weekly, month_end (last
# calendar day of the month, so after the shift the month's last trading session).
# `release` = publication time for data released before the open; on those days the report
# says the calls were made before the release (docs/DESIGN.md section 2).
# Unconfirmed dates (issue #15): `provisional: true` on any entry, or on a rule `provisional_dates`
# (emitted dates) / `provisional_from` (dates on or after it); the event row then has
# `provisional: true` and its name says "provisional date" (a name that already says
# "provisional" is kept as is and flagged too).

rules:
  - {markets: [us], type: opex, rule: third_friday, name: US monthly options expiry, major: false}
  - {markets: [us], type: triple_witching, rule: third_friday, months: [3, 6, 9, 12],
     name: US triple witching, major: true}
  # BLS Employment Situation, usually the first Friday. The October report on 2026-11-06 is
  # confirmed (Insurance Business America, 2026-10-02, read via Bigdata.com). 2027-01-01 is a
  # holiday and BLS does not publish then (without the skip the rule would put it on
  # 2026-12-31); see the provisional fixed date below.
  - {markets: [us], type: jobs_report, rule: first_friday, skip: [2027-01-01],
     name: "US jobs report (usually first Friday; check for shifts)", major: true, release: "08:30 ET"}
  - {markets: [india], type: jobs_report, rule: first_friday, skip: [2027-01-01],
     name: "US jobs report (usually first Friday, 08:30 ET; check for shifts)", major: true}
  - {markets: [india], type: fno_expiry, rule: last_weekday, weekday: 1,
     name: NSE monthly F&O expiry (last Tuesday), major: true}
  - {markets: [india], type: weekly_expiry, rule: weekly, weekday: 1,
     name: Nifty weekly options expiry (Tuesday), major: false}

  # Index rebalances. Each is listed on the session whose CLOSE index funds trade at; the new
  # index applies from the next session. Both stay `major: false` (listed in the report, no
  # EVENT_HEAVY, no range widening): the changes are announced weeks ahead, the extra volume sits
  # in the closing auction of the changed names, and EVENT_HEAVY would lower confidence and widen
  # every range in the market for it. The US day is already a major event (triple witching); in
  # India the day fell on the monthly F&O expiry in Mar 2025 (expiry was then on Thursdays) and
  # Sep 2026 but not in Mar 2026 (sources below). Revisit if the weekly review shows ranges
  # missing more often on these days.
  #
  # S&P 500 quarterly rebalance: after the close of the third Friday of Mar/Jun/Sep/Dec, the same
  # day as triple (quad) witching. Sources: S&P Dow Jones Indices release of 2026-09-04 (via
  # PRNewswire/PubT, read via Bigdata.com: app.bigdata.com/documents/93BD67A34F3A4997581D9EDB61A67986):
  # index changes "effective prior to the open of trading on Monday, September 21, 2026, to
  # coincide with the quarterly rebalance" (the third Friday was 2026-09-18). Jefferies 424B2 of
  # 2026-09-18 describing the S&P 500 (search excerpt, Bigdata.com, app.bigdata.com/documents/
  # C42085ACD072B2A46D8A3473F1D0335F): share changes under 5% "are accumulated and made quarterly
  # on the third Friday of March, June, September, and December". S&P's own methodology PDF on
  # www.spglobal.com is blocked by this environment's egress proxy (2026-10-05) and was not read.
  # When the third Friday is an exchange holiday (Juneteenth: 2026-06-19, 2027-06-18 observed) the
  # rule moves it to the previous session like triple witching (2026-06-18, 2027-06-17). Not
  # checked against an S&P notice: PROVISIONAL for those dates (`provisional_dates`: the event row
  # and the report name them "provisional date").
  - {markets: [us], type: index_rebalance, rule: third_friday, months: [3, 6, 9, 12],
     name: S&P 500 quarterly rebalance (at the close; with triple witching), major: false,
     provisional_dates: [2026-06-18, 2027-06-17]}
  # Nifty 50 semi-annual review: changes effective from the last working day of March and
  # September, so funds trade at the close of the session before it (`month_end` = last calendar
  # day, moved to the last session, then `session_offset: -1`). Official source: NSE Indices,
  # "Methodology Document for Equity Indices", June 2026, printed page 19 (opened 2026-10-05 at
  # https://nsearchives.nseindia.com/content/indices/Method_NIFTY_Equity_Indices.pdf): "The review
  # of Nifty 50 is undertaken semi-annually based on data for six months ending January and July.
  # The replacement of stocks in Nifty 50 (if any) is implemented from the last trading day of
  # March and September. In case of any replacement in the index, a four weeks' prior notice is
  # given to the market participants." That the funds trade at the previous session's close, and
  # the dates, come from these reports, all read via Bigdata.com:
  # - ET Now via MSN, 2026-09-30 (app.bigdata.com/documents/1D23BDE4BA07239AA092A9D622AB9252):
  #   "The reconstitution takes effect on the last working day of March and September.
  #   Accordingly, the latest changes become effective from September 30, 2026", and "September 29
  #   was the last trading session before the rejig took effect".
  # - The Economic Times, 2026-03-27 (app.bigdata.com/documents/CB9CA502E1166AFAC9F56BCD18AB0E81):
  #   rebalancing on March 27, "changes becoming effective from March 30, the last trading session
  #   of the month, as March 31 will remain a holiday for Mahavir Jayanti".
  # - The Economic Times, 2025-03-27 (app.bigdata.com/documents/F94ADFD880696B33FF8DDD852636D4AD):
  #   "effective from March 28, 2025 (close of March 27, 2025)" (JM Financial), and "The reshuffle,
  #   which coincides with Nifty's derivatives expiry".
  # F&O expiry: no rule ties the two; they coincide when the session before the month's last
  # session is the expiry day. Business Standard (Capital Market feed, read via Bigdata.com):
  # 2026-09-29 (app.bigdata.com/documents/F69B89ED227C2A2D34B9710A7BCD7BB3) "The September 2026
  # F&O contracts will expire on 29 September 2026", the rebalance day; 2026-03-02
  # (app.bigdata.com/documents/92BF87EBF96A694B2E3E17AA939DE342) "The March 2026 F&O contracts
  # will expire on 30 March 2026", a session after that rebalance (2026-03-27).
  # 2027 dates (2027-03-30, 2027-09-29 by the rule today) are PROVISIONAL: they depend on NSE's
  # 2027 holiday list (not published yet; see `holidays` in config/markets/india.yaml), so every
  # date from 2027 on is marked provisional (`provisional_from`) until that list is in.
  - {markets: [india], type: index_rebalance, rule: month_end, months: [3, 9], session_offset: -1,
     name: Nifty 50 semi-annual rebalance (at the close; effective next session), major: false,
     provisional_from: 2027-01-01}

# One-off dates. Verify each year. (Index rebalances are rules above; add a fixed date here only
# for an off-cycle rebalance.)
# FOMC decisions land at 14:00 ET, after India's close, so India feels them the next session.
# Dates marked "provisional" were not confirmed by a source read for this file: they stay at
# `major: false` (listed in the report, no EVENT_HEAVY) until confirmed. Re-check them monthly.
fixed:
  # FOMC 2026 (in this file before the 2026-10-05 readiness pass). The Oct 27-28 meeting is
  # confirmed by BTCManager, 2026-10-05 (read via Bigdata.com).
  - {date: 2026-10-28, markets: [us], type: fomc, name: FOMC rate decision, major: true}
  - {date: 2026-10-29, markets: [india], type: fomc, name: FOMC rate decision (previous US evening), major: true}
  - {date: 2026-12-09, markets: [us], type: fomc, name: FOMC rate decision, major: true}
  - {date: 2026-12-10, markets: [india], type: fomc, name: FOMC rate decision (previous US evening), major: true}

  # FOMC 2027: PROVISIONAL. The Fed has posted eight tentative 2027 dates (FXStreet, 2026-08-04),
  # but Chair Warsh has proposed six meetings a year; the July minutes say no decision was made
  # and any change would not affect the rest of 2026 (CNBC, 2026-08-19). Both read via
  # Bigdata.com. Only Jan 26-27 was seen in a source read here (Zero Hedge, 2026-07-30, quoting
  # the Fed calendar); the other seven dates come from search-result summaries.
  # RE-CHECK the Fed's FOMC calendar before January 2027: fix the list, set major: true.
  - {date: 2027-01-27, markets: [us], type: fomc, name: FOMC rate decision (provisional), major: false}
  - {date: 2027-01-28, markets: [india], type: fomc, name: FOMC rate decision (provisional; previous US evening), major: false}
  - {date: 2027-03-17, markets: [us], type: fomc, name: FOMC rate decision (provisional), major: false}
  - {date: 2027-03-18, markets: [india], type: fomc, name: FOMC rate decision (provisional; previous US evening), major: false}
  - {date: 2027-04-28, markets: [us], type: fomc, name: FOMC rate decision (provisional), major: false}
  - {date: 2027-04-29, markets: [india], type: fomc, name: FOMC rate decision (provisional; previous US evening), major: false}
  - {date: 2027-06-09, markets: [us], type: fomc, name: FOMC rate decision (provisional), major: false}
  - {date: 2027-06-10, markets: [india], type: fomc, name: FOMC rate decision (provisional; previous US evening), major: false}
  - {date: 2027-07-28, markets: [us], type: fomc, name: FOMC rate decision (provisional), major: false}
  - {date: 2027-07-29, markets: [india], type: fomc, name: FOMC rate decision (provisional; previous US evening), major: false}
  - {date: 2027-09-15, markets: [us], type: fomc, name: FOMC rate decision (provisional), major: false}
  - {date: 2027-09-16, markets: [india], type: fomc, name: FOMC rate decision (provisional; previous US evening), major: false}
  - {date: 2027-10-27, markets: [us], type: fomc, name: FOMC rate decision (provisional), major: false}
  - {date: 2027-10-28, markets: [india], type: fomc, name: FOMC rate decision (provisional; previous US evening), major: false}
  - {date: 2027-12-08, markets: [us], type: fomc, name: FOMC rate decision (provisional), major: false}
  - {date: 2027-12-09, markets: [india], type: fomc, name: FOMC rate decision (provisional; previous US evening), major: false}

  # US jobs report for December 2026: PROVISIONAL date (the first Friday, 2027-01-01, is a
  # holiday and BLS has not published its 2027 schedule). Fix it and set major: true then.
  - {date: 2027-01-08, markets: [us], type: jobs_report, name: US jobs report (provisional date), major: false,
     release: "08:30 ET"}
  - {date: 2027-01-08, markets: [india], type: jobs_report, name: "US jobs report (provisional date, 08:30 ET)",
     major: false}

  # US CPI, 08:30 ET. Oct 14 is confirmed ("The BLS schedule sets September consumer price
  # inflation for October 14": BTCManager, 2026-10-05, read via Bigdata.com). Nov 10 and Dec 10
  # are PROVISIONAL (search-result summaries only): re-check the BLS CPI schedule, then set
  # major: true. The 2027 schedule is not published yet (BLS posts it in the autumn).
  - {date: 2026-10-14, markets: [us], type: cpi, name: US CPI (September), major: true, release: "08:30 ET"}
  - {date: 2026-11-10, markets: [us], type: cpi, name: US CPI (October; provisional date), major: false, release: "08:30 ET"}
  - {date: 2026-12-10, markets: [us], type: cpi, name: US CPI (November; provisional date), major: false, release: "08:30 ET"}

  # RBI Monetary Policy Committee decisions (last meeting day, statement at 10:00 IST, during the
  # session). FY2026-27: "The fifth meeting is scheduled for December 2, 3, and 4, 2026, and the
  # final meeting of the cycle will be held on February 3, 4, and 5, 2027" (The Economic Times,
  # 2026-03-23, "RBI releases meeting schedule of the Monetary Policy Committee for 2026-2027",
  # read via Bigdata.com). Oct 7 at 10:00 IST: Livemint, 2026-10-05 (read via Bigdata.com).
  # The FY2027-28 schedule is usually released in late March: add it then.
  - {date: 2026-10-07, markets: [india], type: rbi_policy, name: RBI policy decision, major: true}
  - {date: 2026-12-04, markets: [india], type: rbi_policy, name: RBI policy decision, major: true}
  - {date: 2027-02-05, markets: [india], type: rbi_policy, name: RBI policy decision, major: true}

  # Union Budget 2027-28: "The Budget 2027-28 is likely to be presented on February 1"
  # (Business Standard, 2026-09-23, "Finance Ministry to kick off month-long pre-Budget meetings
  # from October 12", read via Bigdata.com). Confirm when the Finance Ministry announces it.
  - {date: 2027-02-01, markets: [india], type: budget, name: Union Budget 2027-28 (expected), major: true}
