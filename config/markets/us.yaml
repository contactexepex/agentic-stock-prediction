# US (NYSE / Nasdaq). Prices from Yahoo Finance. Edit freely; keys are the ids used in data
# files, reports and prediction ids.
market: us
name: US (NYSE/Nasdaq)
calendar: XNYS
# exchange_calendars builds XNYS only up to one year after the run date (on 2026-10-05: to
# 2027-10-05) and assumes Mon-Fri beyond. Its 2026 and Jan-Sep 2027 holidays match NYSE's
# 2027 list (Msn, 2026-06-19, read via Bigdata.com); the two 2027 holidays past its end:
holidays: [2027-11-25, 2027-12-24]   # Thanksgiving, Christmas (observed)
timezone: America/New_York
currency: USD
premarket_quotes: true  # snapshot each ticker's pre-market price (gap vs previous close)

# Roles: benchmark, vol_index (regime), cue (pre-market signal), factor (global driver),
# sector_etf (sector context).
symbols:
  SPY:     {yahoo: SPY, role: benchmark, name: S&P 500 ETF}
  VIX:     {yahoo: "^VIX", role: vol_index, name: VIX}
  ES:      {yahoo: "ES=F", role: cue, name: S&P 500 futures}
  NQ:      {yahoo: "NQ=F", role: cue, name: Nasdaq 100 futures}
  US10Y:   {yahoo: "^TNX", role: factor, name: US 10-year yield}
  DXY:     {yahoo: "DX-Y.NYB", role: factor, name: US dollar index}
  WTI:     {yahoo: "CL=F", role: factor, name: WTI crude}
  GOLD:    {yahoo: "GC=F", role: factor, name: Gold}
  # Sector ETFs: `sectors` = the watchlist sectors (under `sectors:` below) each one stands for;
  # every watchlist sector has one (tests/test_signals.py). Eight SPDR sector ETFs plus JETS
  # (airlines; no SPDR fund) and IAK (iShares U.S. Insurance; XLF is mostly banks and payments).
  # Checked 2026-10-05 with yfinance: each returns daily bars (2 years for JETS and IAK), and each
  # fund's top-10 holdings (yfinance funds_data) include both watchlist tickers of its sector.
  XLF:     {yahoo: XLF, role: sector_etf, name: Financials, sectors: [Banks]}
  XLK:     {yahoo: XLK, role: sector_etf, name: Technology, sectors: [Tech]}
  XLC:     {yahoo: XLC, role: sector_etf, name: Communication services, sectors: [Internet]}
  IAK:     {yahoo: IAK, role: sector_etf, name: US insurance (iShares), sectors: [Insurance]}
  JETS:    {yahoo: JETS, role: sector_etf, name: US airlines (U.S. Global Jets), sectors: [Airlines]}
  XLE:     {yahoo: XLE, role: sector_etf, name: Energy, sectors: [Energy]}
  XLV:     {yahoo: XLV, role: sector_etf, name: Health care, sectors: [Pharma]}
  XLY:     {yahoo: XLY, role: sector_etf, name: Consumer discretionary, sectors: [Autos]}
  XLP:     {yahoo: XLP, role: sector_etf, name: Consumer staples, sectors: [Retail]}
  XLI:     {yahoo: XLI, role: sector_etf, name: Industrials, sectors: [Industrials]}

# Regime thresholds (PASDS file 07).
regime:
  unstable_vol: 28
  event_vol: 20
  calm_vol: 16
  unstable_bench_vol: 0.25
  trend_return_5d: 0.015
  flat_return_5d: 0.005
  stress_vol_jump: 0.30

sectors:
  Banks: [JPM, BAC]
  Tech: [NVDA, AAPL]
  Internet: [GOOGL, META]
  Insurance: [PGR, ALL]
  Airlines: [DAL, UAL]
  Energy: [XOM, CVX]
  Pharma: [LLY, MRK]
  Autos: [TSLA, GM]
  Retail: [WMT, COST]
  Industrials: [CAT, DE]

tickers:
  JPM:   {name: JPMorgan, aliases: [JPMorgan Chase, Jamie Dimon]}
  BAC:   {name: Bank of America}
  NVDA:  {name: Nvidia, aliases: [Jensen Huang]}
  AAPL:  {name: Apple, aliases: [iPhone, Tim Cook]}
  GOOGL: {name: Alphabet, aliases: [Google]}
  META:  {name: Meta Platforms, aliases: [Meta, Facebook, Instagram]}
  PGR:   {name: Progressive, queries: ['"Progressive Corp" stock', '"Progressive insurance" stock']}
  ALL:   {name: Allstate}
  DAL:   {name: Delta Air Lines}
  UAL:   {name: United Airlines}
  XOM:   {name: ExxonMobil, aliases: [Exxon]}
  CVX:   {name: Chevron}
  LLY:   {name: Eli Lilly, aliases: [Lilly]}
  MRK:   {name: Merck}
  TSLA:  {name: Tesla, aliases: [Elon Musk]}
  GM:    {name: General Motors}
  WMT:   {name: Walmart}
  COST:  {name: Costco}
  CAT:   {name: Caterpillar}
  DE:    {name: Deere, aliases: [John Deere]}

news:
  google_news:
    base: https://news.google.com/rss/search
    window: 1d
    params: {hl: en-US, gl: US, ceid: "US:en"}
    query_template: '"{name}" stock'
  categories:
    macro: ["Federal Reserve interest rates", "US inflation CPI", "US jobs report"]
    rates: ["Treasury yields"]
    global: ["oil prices", "geopolitical tensions markets"]
    trade: ["US tariffs trade"]
    markets: ["stock market today site:cnbc.com"]   # CNBC headlines via Google News
  outlets:   # CNBC's own RSS returns 403 to cloud servers (rechecked 2026-10-05), see `markets` above
    - {name: BBC Business, url: "https://feeds.bbci.co.uk/news/business/rss.xml", category: general}
    # Press-release wires (checked 2026-10-05). They carry hundreds of small-company releases a
    # day, so `watchlist_only` keeps just the items that name a watchlist ticker or alias.
    # GlobeNewswire closes the connection without an answer (site-side, every URL tried) and
    # www.businesswire.com refuses cloud traffic; Business Wire's feed host works, but its home
    # feed (G1QFDERJXkJeEFpRWQ==) is deactivated, so the earnings feed is used.
    - {name: PR Newswire, url: "https://www.prnewswire.com/rss/news-releases-list.rss", category: company, watchlist_only: true}
    - {name: Business Wire Earnings, url: "https://feed.businesswire.com/rss/home/?rss=G1QFDERJXkJeEF9YXA==", category: company, watchlist_only: true}

filings: sec
filing_forms: ["8-K", "10-Q", "10-K", "6-K", "20-F", "4", "SC 13D", "SC 13G", "SCHEDULE 13D", "SCHEDULE 13G"]  # new-format 13D/13G since Dec 2024
filing_lookback_days: 7

# Range engine inputs (docs/DESIGN.md section 4). options: implied vol from yfinance option chains
# (collect_options.py). index_cue: the overnight cue for the benchmark's expected move, used by
# the beta split of the range centre; beta = benchmark move per 1% cue move.
options: yfinance
index_cue: {symbol: ES, beta: 1.0}

# Macro (collect_macro.py; issue #9): market-wide series -> data/us/macro/. Treasury par yields
# (home.treasury.gov CSV) also cover FRED's DGS2/DGS10/T10Y2Y (same H.15 data), so FRED adds
# only what Treasury and Yahoo (^VIX, DX-Y.NYB) do not: credit spreads and the breakeven.
macro:
  lookback_days: 30      # Treasury and FRED observations kept per run (de-duplicated)
  pause_seconds: 1.0
  treasury: true
  fred:                  # fredgraph.csv, no API key
    BAMLH0A0HYM2: {name: US high-yield OAS (ICE BofA), unit: pct}
    BAMLC0A0CM: {name: US investment-grade OAS (ICE BofA), unit: pct}
    T10YIE: {name: 10-year breakeven inflation, unit: pct}
  cboe:                  # cdn.cboe.com daily options statistics (one JSON per session)
    lookback_days: 10     # >= 6 sessions, for the 5-observation change
    ratios:              # name in Cboe's file -> series
      TOTAL PUT/CALL RATIO: CBOE_PC_TOTAL
      EQUITY PUT/CALL RATIO: CBOE_PC_EQUITY
      INDEX PUT/CALL RATIO: CBOE_PC_INDEX
      SPX + SPXW PUT/CALL RATIO: CBOE_PC_SPX
      CBOE VOLATILITY INDEX (VIX) PUT/CALL RATIO: CBOE_PC_VIX

# Short selling (collect_shorts.py; issue #9) from FINRA -> data/us/shorts/ and short_interest/.
shorts:
  pause_seconds: 0.5
  daily_volume: {lookback_days: 10}    # Reg SHO consolidated daily short-sale volume files
  short_interest: {lookback_days: 45}  # settlements twice a month, published ~a week later

# Fundamentals (collect_fundamentals.py): 10-Q/10-K financial data from SEC XBRL company facts.
fundamentals:
  history_years: 3     # first load: periods ending in the last N years
  recheck_days: 10     # a 10-Q/10-K filed in the last N days and not yet stored triggers a download
  predecessor_ciks:    # earlier registrants whose filings hold a ticker's history
    XOM: [34088]       # Exxon Mobil Corp; the holding company ExxonMobil Holdings Corp (2115436) files from Q2 2026

# Relationships (docs/DESIGN.md phase 5) from SEC EDGAR: collect_insiders.py (Form 4),
# collect_stakes.py (Schedule 13D/13G) and collect_holdings.py (13F).
relationships:
  insiders: {lookback_days: 7, forms: ["4", "4/A"]}
  stakes: {lookback_days: 7, forms: ["SCHEDULE 13D", "SCHEDULE 13D/A", "SCHEDULE 13G", "SCHEDULE 13G/A"]}
  holdings:
    quarters: 2          # quarters loaded the first time a filer is seen
    filers:              # 13F filers tracked, by SEC CIK (index giants, long-only, macro, activists)
      1067983: Berkshire Hathaway
      # The Vanguard Group (102909) files only a 13F-NT since Q1 2026, naming 10 Vanguard
