# India (NSE). Prices from Yahoo Finance (".NS" symbols). Edit freely; keys are the ids used
# in data files, reports and prediction ids.
market: india
name: India (NSE)
calendar: XBOM            # exchange_calendars code (BSE and NSE share trading holidays)
timezone: Asia/Kolkata
currency: INR
premarket_quotes: false # NSE has no pre-market trading before the 09:00 pre-open
# Extra closed days on top of exchange_calendars. XBOM 2026 has 16 weekday holidays incl. the
# 2026-01-15 Maharashtra civic-poll closure, matching the count and month split in Livemint,
# 2026-01-15 ("a trading holiday for a total of 16 days in 2026", read via Bigdata.com); the
# library has no 2027 holidays yet. NSE publishes the 2027 list around mid-December 2026: replace these
# provisional fixed-date holidays (Republic Day, Good Friday, Ambedkar Jayanti) with that list.
holidays: [2027-01-26, 2027-03-26, 2027-04-14]

# Market-level symbols. Roles: benchmark (index the stocks are measured against),
# vol_index (regime), cue (overnight / pre-open signal), factor (global driver),
# sector_etf (sector context).
symbols:
  NIFTY50:  {yahoo: "^NSEI", role: benchmark, name: Nifty 50}
  INDIAVIX: {yahoo: "^INDIAVIX", role: vol_index, name: India VIX}
  SPX:      {yahoo: "^GSPC", role: cue, name: S&P 500 (previous US close)}
  NASDAQ:   {yahoo: "^IXIC", role: cue, name: Nasdaq Composite (previous US close)}
  NIKKEI:   {yahoo: "^N225", role: cue, name: Nikkei 225}
  HANGSENG: {yahoo: "^HSI", role: cue, name: Hang Seng}
  USDINR:   {yahoo: "INR=X", role: factor, name: USD/INR}
  BRENT:    {yahoo: "BZ=F", role: factor, name: Brent crude}
  GOLD:     {yahoo: "GC=F", role: factor, name: Gold}
  US10Y:    {yahoo: "^TNX", role: factor, name: US 10-year yield}
  DXY:      {yahoo: "DX-Y.NYB", role: factor, name: US dollar index}
  # Nifty sector indices (sector context). Only these three have daily history on Yahoo; Auto,
  # FMCG, Metal, Energy, Infra and Financial Services return just the latest day (checked 2026-10-05).
  NIFTYBANK:   {yahoo: "^NSEBANK", role: sector_etf, name: Nifty Bank}
  NIFTYIT:     {yahoo: "^CNXIT", role: sector_etf, name: Nifty IT}
  NIFTYPHARMA: {yahoo: "^CNXPHARMA", role: sector_etf, name: Nifty Pharma}

# Regime thresholds (PASDS file 07, scaled for India VIX which usually sits lower than US VIX).
regime:
  unstable_vol: 22        # vol index above this -> UNSTABLE
  event_vol: 17           # above this (or a major event) -> EVENT_HEAVY
  calm_vol: 14            # below this and a flat benchmark -> CALM
  unstable_bench_vol: 0.25
  trend_return_5d: 0.015
  flat_return_5d: 0.005
  stress_vol_jump: 0.30   # one-day vol index jump that triggers stress mode

# Two companies per sector. adr = US-listed share that trades overnight (pre-open cue).
sectors:
  Banks: [HDFCBANK, ICICIBANK]
  IT: [INFY, TCS]
  Insurance: [SBILIFE, HDFCLIFE]
  Transport: [ADANIPORTS, INDIGO]
  Energy: [RELIANCE, ONGC]
  Pharma: [SUNPHARMA, DRREDDY]
  Autos: [M&M, MARUTI]
  Consumer goods: [HINDUNILVR, ITC]
  Construction: [LT, ULTRACEMCO]
  Metals: [TATASTEEL, HINDALCO]

tickers:
  HDFCBANK:   {yahoo: HDFCBANK.NS, name: HDFC Bank, adr: HDB}
  ICICIBANK:  {yahoo: ICICIBANK.NS, name: ICICI Bank, adr: IBN}
  INFY:       {yahoo: INFY.NS, name: Infosys, adr: INFY}
  TCS:        {yahoo: TCS.NS, name: Tata Consultancy Services, aliases: [TCS]}
  SBILIFE:    {yahoo: SBILIFE.NS, name: SBI Life Insurance, aliases: [SBI Life]}
  HDFCLIFE:   {yahoo: HDFCLIFE.NS, name: HDFC Life, aliases: [HDFC Life Insurance]}
  ADANIPORTS: {yahoo: ADANIPORTS.NS, name: Adani Ports, aliases: [APSEZ]}
  INDIGO:     {yahoo: INDIGO.NS, name: InterGlobe Aviation, aliases: [IndiGo]}
  RELIANCE:   {yahoo: RELIANCE.NS, name: Reliance Industries, aliases: [RIL]}
  ONGC:       {yahoo: ONGC.NS, name: ONGC, aliases: [Oil and Natural Gas Corporation]}
  SUNPHARMA:  {yahoo: SUNPHARMA.NS, name: Sun Pharma, aliases: [Sun Pharmaceutical]}
  DRREDDY:    {yahoo: DRREDDY.NS, name: Dr Reddy's, aliases: ["Dr. Reddy's"], adr: RDY}
  M&M:        {yahoo: M&M.NS, name: Mahindra & Mahindra, aliases: [Mahindra]}
  MARUTI:     {yahoo: MARUTI.NS, name: Maruti Suzuki}
  HINDUNILVR: {yahoo: HINDUNILVR.NS, name: Hindustan Unilever, aliases: [HUL]}
  ITC:        {yahoo: ITC.NS, name: ITC, queries: ['"ITC Ltd" share']}
  LT:         {yahoo: LT.NS, name: Larsen & Toubro, aliases: [L&T]}
  ULTRACEMCO: {yahoo: ULTRACEMCO.NS, name: UltraTech Cement, aliases: [UltraTech]}
  TATASTEEL:  {yahoo: TATASTEEL.NS, name: Tata Steel}
  HINDALCO:   {yahoo: HINDALCO.NS, name: Hindalco}

# News. Every domain here must be allowed in the cloud environment's network settings.
news:
  google_news:
    base: https://news.google.com/rss/search
    window: 1d
    params: {hl: en-IN, gl: IN, ceid: "IN:en"}
    query_template: '"{name}" share'
  categories:
    macro: ["RBI monetary policy", "India inflation CPI", "India GDP growth"]
    flows: ["FII DII net buying selling"]
    global: ["crude oil prices India", "rupee dollar exchange rate"]
    geopolitics: ["India trade tariffs", "India geopolitical tensions"]
    markets: ["Sensex Nifty site:moneycontrol.com"]   # Moneycontrol market reports via Google News
  outlets:   # verify each URL on the first run; drop any that fail repeatedly
    - {name: ET Markets, url: "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms", category: general}
    # Moneycontrol's own RSS feeds (marketreports, latestnews, business, ...) stopped updating in
    # April 2024 (checked 2026-10-05), so Moneycontrol comes in via Google News instead (categories).
    - {name: Livemint Markets, url: "https://www.livemint.com/rss/markets", category: general}

filings: none             # SEC filings only exist for US companies

# Range engine inputs (docs/DESIGN.md section 4). index_cue: the overnight cue for the
# benchmark's expected move (beta split of the range centre). beta: fit = regress Nifty's daily
# return on the cue's previous session return over the last year of stored bars.
index_cue: {symbol: SPX, beta: fit}

# Relationships (DESIGN.md phase 5), collected by scripts/collect_relations_india.py from NSE's
# public JSON endpoints (browser-like headers plus a cookie from the home page). The cloud
# environment must allow www.nseindia.com and nsearchives.nseindia.com. NSE symbol = the Yahoo
# symbol without ".NS" unless a ticker sets `nse:`.
relations:
  source: nse
  base: https://www.nseindia.com
  archives: https://nsearchives.nseindia.com
  insider_lookback_days: 14   # SEBI PIT disclosures by broadcast date
  deal_lookback_days: 5       # bulk and block deals
  flags:                      # risk flags in the context pack (scripts/relations.py)
    window_days: 5            # deals and insider trades this recent are flagged
    big_deal_crore: 250       # bulk/block deal value at or above this (1 crore = INR 1e7) ...
    big_deal_adv: 0.5         # ... or shares at or above this x 20-day average volume
    insider_sale_crore: 10    # promoter/director sale at or above this value
    pledge_increase_pp: 1.0   # promoter pledge (% of promoter holding) up this many points q/q
    pledge_filed_days: 60     # flag a pledge rise only while that filing is this recent
