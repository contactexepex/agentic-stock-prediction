# India (NSE). Prices from Yahoo Finance (".NS" symbols). Edit freely; keys are the ids used
# in data files, reports and prediction ids.
market: india
name: India (NSE)
calendar: XBOM            # exchange_calendars code (BSE and NSE share trading holidays)
timezone: Asia/Kolkata
currency: INR
premarket_quotes: false # NSE has no pre-market trading before the 09:00 pre-open
# Extra closed days on top of exchange_calendars. XBOM 2026 has 16 weekday holidays incl. the
# 2026-01-15 Maharashtra civic-poll closure, matching the count and month split in Livemint,
# 2026-01-15 ("a trading holiday for a total of 16 days in 2026", read via Bigdata.com); the
# library has no 2027 holidays yet. NSE publishes the 2027 list around mid-December 2026: replace these
# provisional fixed-date holidays (Republic Day, Good Friday, Ambedkar Jayanti) with that list.
holidays: [2027-01-26, 2027-03-26, 2027-04-14]
# Trading days on exchange holidays (calendar.is_session counts them as sessions, issue #41): NSE's
# Diwali Muhurat sessions. Both dates have real, non-flat bars for all 25 own-market symbols (20 stocks,
# Nifty 50, India VIX, three Nifty sector indices) in data/india/prices/ (checked 2026-10-07).
special_sessions: [2024-11-01, 2025-10-21]
# Their own hours (exchange-local "HH:MM-HH:MM", normal market open to close; issue #45): calendar.session_open_utc
# / session_close_utc use them instead of the regular hours. NSE circulars: 2024-11-01 18:00-19:00 IST, 2025-10-21
# (circular of 2025-09-22) 13:45-14:45 IST. A special session without hours here keeps the regular hours.
special_session_hours: {2024-11-01: "18:00-19:00", 2025-10-21: "13:45-14:45"}

# Market-level symbols. Roles: benchmark (index the stocks are measured against),
# vol_index (regime), cue (overnight / pre-open signal), factor (global driver),
# sector_etf (sector context), adr (US-listed ADR of the watchlist ticker `adr_of`; bars only, for the
# signal model's ADR premium; its quote is the ticker's `adr` snapshot).
# close_time: "<HH:MM> <IANA zone>" of the symbol's daily bar close (regular close incl. a closing
# auction, set at or after the real one; FX: the end of Yahoo's London-day bar). The signal model's
# cross-market features use a bar only once close_time + 120 min has passed before the open of D
# (marketbrief/model/cross_market.py). Every cue, factor and adr symbol below returned daily bars from
# Yahoo in a live check on 2026-10-07 (first bar: KOSPI 1996-12-11, Taiwan 1997-07-02, Shanghai
# 1997-07-02, Euro Stoxx 50 2007-03-30, VIX 1990-01-02, USD/JPY 1996-10-30, INFY 1999-03-11, HDB
# 2001-07-20, IBN 2000-03-28, RDY 2001-04-11). GIFT Nifty: no free source without access control
# (docs/DESIGN.md section 15).
symbols:
  NIFTY50:  {yahoo: "^NSEI", role: benchmark, name: Nifty 50}
  INDIAVIX: {yahoo: "^INDIAVIX", role: vol_index, name: India VIX}
  SPX:      {yahoo: "^GSPC", role: cue, name: S&P 500 (previous US close), close_time: "16:00 America/New_York"}
  NASDAQ:   {yahoo: "^IXIC", role: cue, name: Nasdaq Composite (previous US close), close_time: "16:00 America/New_York"}
  NIKKEI:   {yahoo: "^N225", role: cue, name: Nikkei 225, close_time: "15:30 Asia/Tokyo"}
  HANGSENG: {yahoo: "^HSI", role: cue, name: Hang Seng, close_time: "16:10 Asia/Hong_Kong"}
  KOSPI:    {yahoo: "^KS11", role: cue, name: KOSPI, close_time: "15:30 Asia/Seoul"}
  TAIWAN:   {yahoo: "^TWII", role: cue, name: Taiwan Weighted, close_time: "13:30 Asia/Taipei"}
  SHANGHAI: {yahoo: "000001.SS", role: cue, name: Shanghai Composite, close_time: "15:00 Asia/Shanghai"}
  STOXX50:  {yahoo: "^STOXX50E", role: cue, name: Euro Stoxx 50, close_time: "17:40 Europe/Berlin"}
  USVIX:    {yahoo: "^VIX", role: factor, name: US VIX, close_time: "16:15 America/New_York"}
  USDINR:   {yahoo: "INR=X", role: factor, name: USD/INR, close_time: "23:59 Europe/London"}
  USDJPY:   {yahoo: "JPY=X", role: factor, name: USD/JPY, close_time: "23:59 Europe/London"}
  BRENT:    {yahoo: "BZ=F", role: factor, name: Brent crude, close_time: "17:00 America/New_York"}
  GOLD:     {yahoo: "GC=F", role: factor, name: Gold, close_time: "17:00 America/New_York"}
  US10Y:    {yahoo: "^TNX", role: factor, name: US 10-year yield, close_time: "17:00 America/New_York"}
  DXY:      {yahoo: "DX-Y.NYB", role: factor, name: US dollar index, close_time: "17:00 America/New_York"}
  # ADRs of watchlist tickers (the tickers' `adr` below; TCS and the others have no US listing)
  ADR_HDB:  {yahoo: HDB, role: adr, adr_of: HDFCBANK, name: HDFC Bank ADR, close_time: "16:00 America/New_York"}
  ADR_IBN:  {yahoo: IBN, role: adr, adr_of: ICICIBANK, name: ICICI Bank ADR, close_time: "16:00 America/New_York"}
  ADR_INFY: {yahoo: INFY, role: adr, adr_of: INFY, name: Infosys ADR, close_time: "16:00 America/New_York"}
  ADR_RDY:  {yahoo: RDY, role: adr, adr_of: DRREDDY, name: Dr Reddy's ADR, close_time: "16:00 America/New_York"}
  # Nifty sector indices (sector context). Only these three have daily history on Yahoo; Auto,
  # FMCG, Metal, Energy, Infra and Financial Services return just the latest day (checked 2026-10-05).
  # `sectors` = the watchlist sectors each index stands for; the other seven watchlist sectors
  # have none (the context pack lists them).
  NIFTYBANK:   {yahoo: "^NSEBANK", role: sector_etf, name: Nifty Bank, sectors: [Banks]}
  NIFTYIT:     {yahoo: "^CNXIT", role: sector_etf, name: Nifty IT, sectors: [IT]}
  NIFTYPHARMA: {yahoo: "^CNXPHARMA", role: sector_etf, name: Nifty Pharma, sectors: [Pharma]}

# Regime thresholds (PASDS file 07, scaled for India VIX which usually sits lower than US VIX).
regime:
  unstable_vol: 22        # vol index above this -> UNSTABLE
  event_vol: 17           # above this (or a major event) -> EVENT_HEAVY
  calm_vol: 14            # below this and a flat benchmark -> CALM
  unstable_bench_vol: 0.25
  trend_return_5d: 0.015
  flat_return_5d: 0.005
  stress_vol_jump: 0.30   # one-day vol index jump that triggers stress mode

# Two companies per sector. adr = US-listed share that trades overnight (pre-open cue).
sectors:
  Banks: [HDFCBANK, ICICIBANK]
  IT: [INFY, TCS]
  Insurance: [SBILIFE, HDFCLIFE]
  Transport: [ADANIPORTS, INDIGO]
  Energy: [RELIANCE, ONGC]
  Pharma: [SUNPHARMA, DRREDDY]
  Autos: [M&M, MARUTI]
  Consumer goods: [HINDUNILVR, ITC]
  Construction: [LT, ULTRACEMCO]
  Metals: [TATASTEEL, HINDALCO]

# News tagging (marketbrief/analytics/news_tags.py): a ticker is tagged when one of its `news_names` (default:
# name + aliases) occurs as a whole word, case-insensitively, in the title (the plain-text summary
# only when the title names no watchlist company),
# after that ticker's `news_exclude` regexes were removed (other listed companies sharing a name).
# Names and aliases must be unambiguous; a Google News query hit alone does not tag.
# company_meta: per-company metadata (name, Yahoo symbol, news names, aliases, ADR ...) of the companies on the
# watchlist. The companies themselves come only from the watchlist events (data/<market>/watchlist_events/,
# `scripts/company.py`; marketbrief/lifecycle/loader.py): an entry here never adds a company, and a company added
# through onboarding without an entry gets its meta from its add event. (Until B18 this key was the company list
# `tickers:`.)
company_meta:
  HDFCBANK:   {yahoo: HDFCBANK.NS, name: HDFC Bank, adr: HDB}
  ICICIBANK:  {yahoo: ICICIBANK.NS, name: ICICI Bank, adr: IBN}
  INFY:       {yahoo: INFY.NS, name: Infosys, adr: INFY}
  TCS:        {yahoo: TCS.NS, name: Tata Consultancy Services, aliases: [TCS]}
  SBILIFE:    {yahoo: SBILIFE.NS, name: SBI Life Insurance, aliases: [SBI Life]}
  HDFCLIFE:   {yahoo: HDFCLIFE.NS, name: HDFC Life, aliases: [HDFC Life Insurance]}
  ADANIPORTS: {yahoo: ADANIPORTS.NS, name: Adani Ports, aliases: [APSEZ, Adani Ports and SEZ]}
  INDIGO:     {yahoo: INDIGO.NS, name: InterGlobe Aviation, aliases: [IndiGo]}
  RELIANCE:   {yahoo: RELIANCE.NS, name: Reliance Industries, aliases: [RIL, Reliance Jio, Jio Platforms, Reliance Retail]}
  ONGC:       {yahoo: ONGC.NS, name: ONGC, aliases: [Oil and Natural Gas Corporation]}
  SUNPHARMA:  {yahoo: SUNPHARMA.NS, name: Sun Pharma, aliases: [Sun Pharmaceutical],
               news_exclude: ['Sun Pharma Advanced Research']}
  DRREDDY:    {yahoo: DRREDDY.NS, name: Dr Reddy's, aliases: ["Dr. Reddy's"], adr: RDY}
  # "Mahindra" alone is the company ("Mahindra SUV sales rise") once other listed or unrelated
  # companies with Mahindra in the name are removed (news_exclude)
  M&M:        {yahoo: M&M.NS, name: Mahindra & Mahindra, aliases: [M&M, Mahindra and Mahindra, Mahindra],
               news_exclude: ['Kotak Mahindra\w*', 'Tech Mahindra', 'SML Mahindra', 'Club Mahindra',
                              'Mahindra (?:Lifespaces?|Holidays|Logistics|CIE|EPC|Finance|Manulife|Susten)\w*',
                              'M&M Financ\w*', 'Mahindra (?:&|and) Mahindra Financ\w*']}
  MARUTI:     {yahoo: MARUTI.NS, name: Maruti Suzuki, aliases: [Maruti]}
  HINDUNILVR: {yahoo: HINDUNILVR.NS, name: Hindustan Unilever, aliases: [HUL]}
  ITC:        {yahoo: ITC.NS, name: ITC, queries: ['"ITC Ltd" share'], news_exclude: ['ITC Hotels']}
  LT:         {yahoo: LT.NS, name: Larsen & Toubro, aliases: [L&T],
               news_exclude: ['L&T (?:Finance|Technology Services|Tech|Infotech)\w*', 'Larsen & Toubro Infotech']}
  ULTRACEMCO: {yahoo: ULTRACEMCO.NS, name: UltraTech Cement, aliases: [UltraTech]}
  TATASTEEL:  {yahoo: TATASTEEL.NS, name: Tata Steel}
  HINDALCO:   {yahoo: HINDALCO.NS, name: Hindalco}

# Official fallback for watchlist bars Yahoo lacks (scripts/collect_prices.py): a stock with no
# stored bar for one of the last `sessions` completed sessions gets that day's OHLC and volume
# from NSE's security-wise bhavcopy. The bhavcopy is as traded, while stored Yahoo bars are
# split/bonus-adjusted as of their collection time, so a bar is filled only when NSE's PREV_CLOSE
# is within 0.5% of our stored previous close and Yahoo shows no split/bonus since. Each filled
# bar is in the summary's `filled_from_nse` and in data/india/price_sources/ (view bar_sources).
price_fallback:
  source: nse_bhavcopy
  sessions: 5

# News. Every domain here must be allowed in the cloud environment's network settings.
news:
  google_news:
    base: https://news.google.com/rss/search
    window: 1d
    params: {hl: en-IN, gl: IN, ceid: "IN:en"}
    query_template: '"{name}" share'
  categories:
    macro: ["RBI monetary policy", "India inflation CPI", "India GDP growth"]
    flows: ["FII DII net buying selling"]
    global: ["crude oil prices India", "rupee dollar exchange rate"]
    geopolitics: ["India trade tariffs", "India geopolitical tensions"]
    markets: ["Sensex Nifty site:moneycontrol.com"]   # Moneycontrol market reports via Google News
    # Overseas and sector drivers (each query checked live 2026-10-07 with when:1d, en-IN: relevant results)
    us_fed: ["FOMC Federal Reserve", "US Fed interest rates"]
    us_markets: ["Wall Street stocks"]
    it_services: ["Accenture earnings", "Cognizant earnings"]   # US IT services results (TCS, Infosys peers)
    pharma_usfda: ["USFDA"]                                       # USFDA approvals, inspections, warning letters
    monsoon: ["monsoon IMD", "monsoon kharif sowing"]
    metals: ["steel prices India", "aluminium prices LME"]
    premarket: ["GIFT Nifty"]                                     # GIFT Nifty (formerly SGX Nifty) pre-market reports
  outlets:   # verify each URL on the first run; drop any that fail repeatedly
    - {name: ET Markets, url: "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms", category: general}
    # Moneycontrol's own RSS feeds (marketreports, latestnews, business, ...) stopped updating in
    # April 2024 (checked 2026-10-05), so Moneycontrol comes in via Google News instead (categories).
    - {name: Livemint Markets, url: "https://www.livemint.com/rss/markets", category: general}
    # Business Standard and BusinessLine (checked 2026-10-05: both answer, pubDate in IST)
    - {name: Business Standard Markets, url: "https://www.business-standard.com/rss/markets-106.rss", category: general}
    - {name: Business Standard Companies, url: "https://www.business-standard.com/rss/companies-101.rss", category: company}
    - {name: BusinessLine Markets, url: "https://www.thehindubusinessline.com/markets/feeder/default.rss", category: general}
    - {name: BusinessLine Companies, url: "https://www.thehindubusinessline.com/companies/feeder/default.rss", category: company}

filings: none             # SEC filings only exist for US companies

# Range engine inputs (docs/DESIGN.md section 4). index_cue: the overnight cue for the
# benchmark's expected move (beta split of the range centre). beta: fit = regress Nifty's daily
# return on the cue's previous session return over the last year of stored bars.
index_cue: {symbol: SPX, beta: fit}

# NSE data (session code in marketbrief/sources/nse_client.py): relationships from collect_relations_india.py
# (DESIGN.md phase 5) and primary sources from collect_nse_india.py. NSE's public JSON needs
# browser-like headers plus a cookie from the home page. The cloud environment must allow
# www.nseindia.com and nsearchives.nseindia.com. NSE symbol = the Yahoo symbol without ".NS"
# unless a ticker sets `nse:`.
relations:
  source: nse
  base: https://www.nseindia.com
  archives: https://nsearchives.nseindia.com
  pause_seconds: 0.7          # between NSE requests (one session per collector run)
  insider_lookback_days: 14   # SEBI PIT filings by broadcast date
  deal_lookback_days: 5       # bulk and block deals kept from the snapshot / backfill
  symbol_calls_per_run: 10    # per-ticker polls (shareholding, pledges, results) per kind per run;
                              # only tickers missing the latest quarter are polled (--full: all)
  financial_filings_per_ticker: 4   # newest unseen results filings parsed per ticker (--full: all)
  announcement_lookback_days: 2
  delivery_lookback_days: 5   # sessions of security-wise bhavcopy to catch up
  flags:                      # risk flags in the context pack (scripts/relations.py)
    window_days: 5            # deals and insider trades this recent are flagged
    big_deal_crore: 250       # bulk/block deal value at or above this (1 crore = INR 1e7) ...
    big_deal_adv: 0.5         # ... or shares at or above this x 20-day average volume
    insider_sale_crore: 10    # promoter/director sale at or above this value
    pledge_increase_pp: 1.0   # promoter pledge (% of promoter holding) up this many points q/q
    pledge_filed_days: 60     # flag a pledge rise only while that filing is this recent

# Flows and indices (collect_flows_india.py; issue #9). fpi: NSDL daily FPI investment
# (fpi.nsdl.co.in; www.fpi.nsdl.co.in is refused by the egress proxy). indices: NSE's daily
# index close file on nsearchives.nseindia.com (www.niftyindices.com's data endpoints now
# return its home page). names: index -> the watchlist sector it stands for (null = market-wide);
# these cover the seven sectors without a Yahoo index (context pack only, not the indicators).
india_flows:
  pause_seconds: 1.0
  fpi: true
  indices:
    lookback_days: 10
    names:
      Nifty 50: null
      Nifty Midcap 150: null
      Nifty Smallcap 250: null
      Nifty 10 yr Benchmark G-Sec: null
      Nifty Bank: Banks
      Nifty IT: IT
      Nifty Insurance: Insurance
      Nifty Transportation & Logistics: Transport
      Nifty Energy: Energy
      Nifty Pharma: Pharma
      Nifty Auto: Autos
      Nifty FMCG: Consumer goods
      Nifty Construction: Construction
      Nifty Metal: Metals
