# Warehouse (WS1, docs/ws/ws1.md): a derived copy of each market's data plus per-page read models, rebuilt
# from the repo at any time by scripts/warehouse_sync.py. The repo's data/ stays the source of truth.
# The MotherDuck token is only ever the environment variable MOTHERDUCK_TOKEN; it is never written here.
provider: motherduck          # motherduck | local
name: market_brief            # the MotherDuck database (md:market_brief)
# MotherDuck's Postgres endpoint (the app's route handlers read the read models through it)
pg_host: pg.eu-central-1-aws.motherduck.com
pg_port: 5432
pg_user: postgres
sslmode: verify-full
sslrootcert: system
# Without the token (dev, tests) or with --local, the sync writes this DuckDB file instead (work/ is gitignored).
local_path: work/warehouse/market_brief.duckdb
# The app whose cached pages a sync to MotherDuck revalidates after it commits (warehouse/revalidate.py; B4).
app_url: https://omenix.vercel.app
# Kill switch (docs/ARCHITECTURE.md section 5): enabled: false skips every sync before connecting; a sync also
# skips once this UTC month's recorded MotherDuck time (meta.sync_runs connected_s: from the connect until the
# run is recorded; the local staging is not counted) reaches monthly_hours_ceiling. It bounds MotherDuck compute
# only if billing is per active second; the plan's usage page has to confirm that (docs/ws/ws1.md).
# Skips are non-blocking; a ceiling skip is logged in rm.builds and meta.sync_runs, an enabled: false skip
# only in the summary (it never connects).
enabled: true
monthly_hours_ceiling: 7
# The MotherDuck extension (marketbrief/warehouse/extension.py): both signed files are downloaded over HTTPS
# only, from extensions.duckdb.org and ext.motherduck.com, and DuckDB checks their signatures on load.
# duckdb_version must equal the duckdb pin in requirements.txt. implementation_version is MotherDuck's build
# for that DuckDB; https://api.motherduck.com/extension_version names the current one (checked 2026-10-07).
extension:
  duckdb_version: v1.5.6
  implementation_version: v1.5.6-2026-10-3
