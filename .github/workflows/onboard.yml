name: onboard

# The inbox import (docs/SPEC.md F8 and F10, write path from the web tier): company commands written by the web tier
# to the MotherDuck database market_brief_inbox are validated by scripts/company.py import-inbox (the same lifecycle
# validator as the CLI), adds run the deterministic onboarding (identifiers, sector, backfill, collect gate), and the
# web tier's paper trades (inbox.requests) are imported by scripts/portfolio.py import-inbox (B2); the
# new records are committed to data/ with pull, rebase and retry so the run never races a routine's push.
# Research only: a watchlist event is a record, never an order. Dispatched by the web tier (workflow_dispatch);
# a command whose sources do not answer from GitHub's runners is logged `failed` and retried by the next import
# (this workflow again, or the routine's import step).
# A command whose inbox row names its Slack message (slack_channel, slack_ts) gets a threaded reply with its result
# (B6's onboarding confirmation; data/<market>/slack_posts/ is committed with the import).
# Secrets come only from the repository's Actions secrets; nothing here prints them.
on:
  workflow_dispatch:
    inputs:
      market:
        description: "Market whose inbox to import"
        required: true
        default: both
        type: choice
        options: [both, india, us]

permissions:
  contents: write

concurrency:
  group: onboard
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOTHERDUCK_INBOX_TOKEN: ${{ secrets.MOTHERDUCK_INBOX_TOKEN }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}   # the reply to a Slack command (B6's onboarding confirmation)
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Import the inbox and onboard
        run: |
          markets="${{ inputs.market }}"
          if [ "$markets" = "both" ]; then markets="india us"; fi
          mkdir -p work
          status=0
          for market in $markets; do
            python scripts/company.py --market "$market" import-inbox --slack-reply > "work/onboard-$market.json" || status=$?
            cat "work/onboard-$market.json"
            # the web tier's add_paper_trade requests (inbox.requests; B2's importer, issue #112)
            python scripts/portfolio.py --market "$market" import-inbox > "work/paper-trades-$market.json" || status=$?
            cat "work/paper-trades-$market.json"
          done
          exit $status
      - name: Commit and push the new records
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "onboard: inbox import (${{ inputs.market }}, run ${{ github.run_id }})"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "push failed after 5 attempts" >&2
          exit 1
