<!--@@SHARED_JS@@-->
<script>
let view = 'accuracy', basis = 'forward', cost = 'market', horizon = 'all', selected = null, metric = 'net', week = 'all';
const hashParts = () => location.hash.slice(1).split('/');
if (hashParts()[1]) selected = hashParts()[1];
shell(PAGES.lab, 'Strategy lab');
onMarketChange = () => { selected = null; render(); };
window.addEventListener('hashchange', () => { const s = hashParts()[1]; if (s && s !== selected && P(market).strategies[s]) { selected = s; render(); } });
const REGIME_WORDS = {CALM: 'calm', TRENDING: 'trending', EVENT_HEAVY: 'event-heavy', UNSTABLE: 'unstable'};
const REASON = {market_up: 'market lift', market_down: 'market drag', sector_lift: 'sector lift', sector_drag: 'sector drag', news_positive: 'news +', news_negative: 'news −', company_specific: 'company', target_reached: 'target reached', range_missed: 'range missed'};
const KEYNAME = {signal: 'signal', news_weight: 'news weight', news_statuses: 'news statuses', news_materiality: 'news materiality', cross_market: 'global cues', regime_filter: 'regime filter', model: 'model', inputs: 'inputs', sees_model_score: 'sees the model score'};
const fmtParam = v => Array.isArray(v) ? v.map(x => String(x).replace(/_/g, ' ')).join(', ') : v === true ? 'yes' : v === false ? 'no' : String(v).replace(/_/g, ' ');
const rowsOf = (p, scope, h = horizon, v = view, b = basis) => p.rows.filter(r => r.scope === scope && r.view === v && r.basis === b && String(r.horizon_days) === String(h));
/* a row's figure on the selected cost view; null when the your-cost view does not store it (a back-test row stores net_pnl and mean_return_pct only): never the market figure in its place */
const val = (r, k) => cost === 'your' ? (r.your_cost && k in r.your_cost ? r.your_cost[k] : null) : r[k];
const notStored = () => el('span', {class:'muted', 'data-tip':'Not stored for the your-cost view (a back-test row stores profit and mean return only).'}, 'not stored');
const luckOf = r => cost === 'your' && r.your_cost ? r.your_cost.luck_test : r.luck_test;
const famOrder = {rule: 0, baseline: 1, ai: 2};
const costWords = () => cost === 'your' ? 'your cost (market charges plus your broker’s extras; the go-live bar’s view)' : 'market cost (brokerage, taxes and fees; the ranking view, decision 50)';

/* ---------- controls ---------- */
function seg(label, opts, cur, onPick, tipText) {
  const s = el('div', {class:'md-segmented dense light', role:'group', 'aria-label': label});
  for (const [k, text] of opts) s.append(el('button', {type:'button', 'aria-pressed': String(k === cur), onclick: () => onPick(k)}, text));
  return el('span', {class:'c'}, label, tipText ? help(tipText) : null, s);
}
function controls(p) {
  const bar = el('div', {class:'ctrls', role:'group', 'aria-label':'Scoreboard settings'});
  bar.append(seg('View', [['accuracy', 'Accuracy'], ['head_to_head', 'Head-to-head']], view, k => { view = k; render(); }, 'Accuracy: every qualifying prediction is its own paper trade, so each strategy is judged on everything it said. Head-to-head: only the up to four daily picks per company (the strongest rule strategy vs the strongest AI trader under two pick rules), on identical company-days (F1, decisions 41-42).'));
  bar.append(seg('Basis', [['forward', 'Forward'], ['backtest', 'Back-test']], basis, k => { basis = k; render(); }, `Forward: real paper trades made before each session’s open. Back-test: the strategies that need no news replayed on the ${BACKTEST_YEARS}-year history (F2.3). Never pooled: a back-test says what would have happened, forward says what did.`));
  bar.append(seg('Costs', [['market', 'Market cost'], ['your', 'Your cost']], cost, k => { cost = k; render(); }, 'Market cost: brokerage, taxes and fees of config/costs.yaml; strategies are ranked on it. Your cost adds your own broker’s charges (India: NRI reporting and DP charges; US: FX markup and the portfolio fee); the go-live bar is measured on it (decision 50). The ranking does not change with this switch; the numbers do.'));
  const hz = el('div', {class:'md-segmented dense light', role:'group', 'aria-label':'Horizon'});
  for (const k of ['all', ...p.horizons]) hz.append(el('button', {type:'button', 'aria-pressed': String(String(k) === String(horizon)), onclick: () => { horizon = k; render(); }}, k === 'all' ? 'All' : `N+${k}`));
  bar.append(el('span', {class:'c'}, 'Horizon', help('All horizons pooled, or one horizon N+k (sell at the close of the k-th session after the entry session). A strategy with no settled trade at a horizon shows "no trades yet".'), hz));
  return bar;
}

/* ---------- ranking ---------- */
function ranking(p) {
  const rows = rowsOf(p, 'strategy'), byId = {}; for (const r of rows) byId[r.strategy_id] = r;
  const ids = Object.keys(p.strategies).sort((x, y) => { const a = byId[x], b = byId[y]; if (a && b) return b.net_pnl - a.net_pnl || b.trades - a.trades || x.localeCompare(y); if (a) return -1; if (b) return 1; return famOrder[p.strategies[x].family] - famOrder[p.strategies[y].family] || x.localeCompare(y); });
  return {ids, byId, rows};
}
/* the luck test's one-word verdict: 'edge' only when the corrected interval lies above zero, 'loss' when it lies wholly below zero, else 'luck?' */
const verdictOf = t => t.corrected_low_pct != null && t.corrected_low_pct > 0 ? 'edge' : t.corrected_high_pct != null && t.corrected_high_pct < 0 ? 'loss' : 'luck?';
function luckBar(r) {
  const t = luckOf(r); if (!t || t.low_pct == null) return r.trades >= 2 ? el('span', {class:'muted', 'data-tip':'No luck test stored for this cost view (the back-test stores it for market cost only).'}, 'not stored') : el('span', {class:'muted', 'data-tip':'Fewer than 2 trades: no luck interval yet.'}, 'no interval');
  const lo = Math.min(t.corrected_low_pct ?? t.low_pct, t.low_pct, 0), hi = Math.max(t.corrected_high_pct ?? t.high_pct, t.high_pct, 0), X = v => 4 + (v - lo) / ((hi - lo) || 1) * 88;
  const s = svgEl('svg', {viewBox:'0 0 96 16', role:'img', 'aria-label': `luck interval ${sgn(t.low_pct)} to ${sgn(t.high_pct)}, corrected ${sgn(t.corrected_low_pct)} to ${sgn(t.corrected_high_pct)}`});
  s.append(svgEl('line', {class:'z', x1: X(0), x2: X(0), y1: 1, y2: 15}));
  s.append(svgEl('line', {class:'raw', x1: X(t.low_pct), x2: X(t.high_pct), y1: 8, y2: 8}));
  if (t.corrected_low_pct != null) s.append(svgEl('line', {class:'cor' + (verdictOf(t) === 'edge' ? ' edge' : ''), x1: X(t.corrected_low_pct), x2: X(t.corrected_high_pct), y1: 8, y2: 8}));
  s.append(svgEl('circle', {class:'mean', cx: X(val(r, 'mean_return_pct')), cy: 8, r: 2.5}));
  return el('span', {class:'luck', 'data-tip': `Luck test (${t.n} trades): the mean return per trade is ${sgn(val(r, 'mean_return_pct'))}; a bootstrap puts it between ${sgn(t.low_pct)} and ${sgn(t.high_pct)} (thin bar, ${LUCK_INTERVAL_PCT}%). Corrected for the ${t.m} rows compared at once: ${sgn(t.corrected_low_pct)} to ${sgn(t.corrected_high_pct)} (thick bar). ${verdictOf(t) === 'edge' ? 'The corrected interval lies above zero: an edge may be real.' : verdictOf(t) === 'loss' ? 'The corrected interval lies wholly below zero: the strategy loses money after costs, and that is not luck.' : 'The corrected interval includes zero: the result could be luck; no edge claimed.'} The tick is zero.`}, s, el('span', {class:'mb-label ' + (verdictOf(t) === 'edge' ? 'success' : verdictOf(t) === 'loss' ? 'danger' : 'neutral')}, verdictOf(t)));
}
function goLiveChips(r) {
  const g = r.go_live; if (!g) return el('span', {class:'muted'}, '—');
  const c = (ok, text, tipText) => el('span', {class:'mb-label ' + (ok === true ? 'success' : ok === false ? 'neutral' : 'neutral'), 'data-tip': tipText}, icon(ok === true ? 'ms-check' : ok === false ? 'ms-close' : 'ms-remove'), text);
  return el('span', {class:'gl'}, c(g.trades_needed === 0, g.trades_needed ? `${g.trades_needed} trades to go` : 'trades ok', `About ${GO_LIVE_TRADES_ABOUT} settled trades are needed (F7.2); ${g.trades_needed} still to go.`), c(g.months_forward >= GO_LIVE_MONTHS, `${g.months_forward} of ${GO_LIVE_MONTHS} months`, `At least ${GO_LIVE_MONTHS} months of forward paper trading.`), c(g.beats_best_baseline, g.beats_best_baseline ? 'beats yardstick' : 'behind yardstick', `Must beat the best baseline after your cost (${money(P(market).currency, g.best_baseline_net_pnl, dec(P(market).currency), true)}) with the corrected luck test excluding zero.`));
}
function leaderboard(p) {
  const cur = p.currency, {ids, byId} = ranking(p);
  const card = el('section', {class:'card', 'aria-label':'Scoreboard'});
  const hzWords = horizon === 'all' ? 'all horizons pooled' : `N+${horizon} only`;
  card.append(el('div', {class:'head'}, el('h2', {}, `Every strategy, ranked by profit after costs`), help(`All ${ids.length} strategies of the registry (rule strategies, the three baselines as yardsticks, the AI traders) on the ${view === 'accuracy' ? 'accuracy' : 'head-to-head'} view, ${basis} basis, ${hzWords}. Ranked on market cost (decision 50); the ${cost === 'your' ? 'market-cost' : 'your-cost'} figure sits under each profit. Fewer than ${MIN_TRADES_TO_RANK} settled trades is "too few to rank" and greyed: a handful of trades is mostly luck. The luck bar shows the ${LUCK_INTERVAL_PCT}% interval of the mean return per trade, thin uncorrected and thick corrected for the rows compared at once; only a thick bar clear of the zero tick counts as an edge. Click a name to read the strategy in plain words.`), el('div', {class:'end'}, `${view === 'accuracy' ? 'accuracy view' : 'head-to-head view'} · ${basis} · ${hzWords} · as of the ${fmtD(p.as_of, false)} close · Paper`)));
  if (basis === 'backtest' && !p.rows.some(r => r.basis === 'backtest')) { card.append(el('div', {class:'quiet'}, `No back-test rows stored yet. Back-tests cover only the strategies that need no news (always buy, follow yesterday, model without news and the rule strategies with the news weight at zero), on the ${BACKTEST_YEARS}-year history, and are never pooled with forward results (F2.3).`)); return card; }
  if (basis === 'backtest') { const run = p.backtest_run; card.append(el('div', {class:'quiet', style:'margin-bottom:10px'}, el('b', {}, 'Back-test run. '), `Bars stored from ${fmtDY(run.first_date)} to ${fmtDY(run.last_date)}, ${run.history ? `with the ${BACKTEST_YEARS}-year history cache` : `without the ${BACKTEST_YEARS}-year history cache (not in the repository)`}; ${run.note}${run.eurusd ? `; EUR/USD: ${run.eurusd}` : ''}. Never pooled with forward results (F2.3); no targets or ranges, so those columns are empty.`)); }
  const tb = el('table', {class:'md-table tbl lb'});
  tb.append(el('thead', {}, el('tr', {}, el('th', {class:'cm'}, '#'), el('th', {}, 'Strategy'), el('th', {class:'num'}, `Profit after ${cost === 'your' ? 'your' : 'market'} cost`), el('th', {class:'num cm'}, 'Trades'), el('th', {class:'num'}, 'Win rate'), el('th', {class:'num c2'}, 'Per trade'), el('th', {class:'num c2'}, 'Drawdown'), el('th', {}, 'Luck test'), el('th', {class:'c3'}, 'Go-live bar'))));
  const body = el('tbody'); let n = 0;
  for (const id of ids) {

  const show = i => { if (i == null) { hv.style.display = 'none'; tipBox.classList.remove('on'); cur_i = null; return; } cur_i = i; hv.style.display = ''; hl.setAttribute('x1', X(i)); hl.setAttribute('x2', X(i)); tipBox.innerHTML = ''; tipBox.append(el('b', {}, `Through ${fmtDY(dates[i])}`)); for (const l of lines.slice().sort((a, b) => b.pts[i] - a.pts[i]).slice(0, 8)) tipBox.append(el('br'), el('i', {class: klass(l.id)}), `${nameOf(l.id)}: ${money(cur, l.pts[i], dec(cur), true)}`); if (lines.length > 8) tipBox.append(el('br'), `… ${lines.length - 8} more`); tipBox.classList.add('on'); tipBox.style.left = Math.max(0, Math.min(W - 270, X(i) > W * 0.55 ? X(i) - 270 : X(i) + 12)) + 'px'; tipBox.style.top = '8px'; };
  hit.addEventListener('pointermove', e => { const r = svg.getBoundingClientRect(); const x = (e.clientX - r.left) * (W / r.width); let best = 0; dates.forEach((d, i) => { if (Math.abs(X(i) - x) < Math.abs(X(best) - x)) best = i; }); show(best); });
  hit.addEventListener('pointerleave', () => show(null));
  svg.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); show(cur_i == null ? dates.length - 1 : Math.max(0, Math.min(dates.length - 1, cur_i + (e.key === 'ArrowRight' ? 1 : -1)))); } else if (e.key === 'Escape') show(null); });
  svg.addEventListener('blur', () => show(null));
  const leg = el('div', {class:'cleg'}); for (const id of coloured) leg.append(el('span', {}, el('i', {class: klass(id)}), nameOf(id))); if (lines.length > coloured.length) leg.append(el('span', {}, el('i', {class:'grey'}), `${lines.length - coloured.length} other ${view === 'accuracy' ? 'strateg' + (lines.length - coloured.length === 1 ? 'y' : 'ies') : 'line' + (lines.length - coloured.length === 1 ? '' : 's')} (hover to read)`)); leg.append(el('span', {class:'muted'}, 'dotted line = zero')); host.append(leg);
}
function niceTicks(lo, hi, n) { const span = hi - lo, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag, stepv = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag; const out = []; for (let v = Math.ceil(lo / stepv) * stepv; v <= hi; v += stepv) out.push(+v.toFixed(6)); return out; }

/* ---------- heatmaps ---------- */
/* a heatmap cell's compact profit: rounded to three significant digits first, then a unit (k; lakh L / crore Cr for rupees, M for dollars), the sign always, no currency symbol (the metric switch names it), so a cell never clips and never shows four digits */
const kfmt = (cur, v) => { const units = cur === 'INR' ? [[1e7, 'Cr'], [1e5, 'L'], [1e3, 'k']] : [[1e6, 'M'], [1e3, 'k']];
  const a0 = Math.abs(v), a = a0 >= 1 ? Number(a0.toPrecision(3)) : Math.round(a0); if (a === 0) return '0'; const sign = v > 0 ? '+' : '−';
  const u = units.find(([n]) => a >= n); if (!u) return sign + a.toFixed(0); const d = a / u[0]; return sign + (d >= 100 ? d.toFixed(0) : d >= 10 ? d.toFixed(1) : d.toFixed(2)) + u[1]; };
function heat(title, tipText, rowIds, cols, cellOf, p) {

  const mx = Math.max(1e-9, ...cells.flat().map(x => x ? Math.abs(metric === 'net' ? x.net : x.win - 0.5) : 0));
  const t = el('table', {role:'grid', 'aria-label': title});
  t.append(el('thead', {}, el('tr', {}, el('th', {class:'r'}, ''), ...cols.map(c => el('th', {scope:'col', title: c.full}, c.label)))));
  const b = el('tbody');
  rowIds.forEach((id, i) => { const tr = el('tr', {}, el('th', {class:'r', scope:'row', title: p.strategies[id].name}, p.strategies[id].name)); cols.forEach((c, j) => { const x = cells[i][j]; if (!x) { tr.append(el('td', {class:'e'}, el('span', {}, '·'))); return; } const v = metric === 'net' ? x.net : x.win; const a = metric === 'net' ? Math.min(60, Math.abs(x.net) / mx * 60) : Math.min(60, Math.abs(x.win - 0.5) / mx * 60); const pos = metric === 'net' ? x.net >= 0 : x.win >= 0.5; tr.append(el('td', {tabindex:'0', style:`background:color-mix(in srgb, var(${pos ? '--mb-color-up' : '--mb-color-down'}) ${a.toFixed(0)}%, var(--md-sys-color-surface-container-lowest))`, 'data-tip': `${p.strategies[id].name} × ${c.full}: ${x.n} trade${x.n === 1 ? '' : 's'}, ${pct(x.win)} won, ${money(cur, x.net, dec(cur), true)} after market cost.`}, el('span', {}, metric === 'net' ? kfmt(cur, v) : pct(v)))); }); b.append(tr); });
  t.append(b); box.append(t);
  return box;
}
function heatmaps(p) {
  const card = el('section', {class:'card', 'aria-label':'Heatmaps'});
  const cellsAll = basis === 'forward' ? p.cells.filter(c => c.view === view) : [], weeks = [...new Set(cellsAll.filter(c => c.week !== 'all').map(c => c.week))].sort(); if (!weeks.includes(week)) week = 'all';
  card.append(el('div', {class:'head'}, el('h2', {}, 'Where each strategy wins and loses'), help('Heatmaps of profit after market cost or win rate (F2.8, decision 42) by strategy × horizon, × company, × market regime and × reason code, for the selected view and basis. Green = profit (or win rate above half), red = loss, darker = larger; the number is in every cell, so colour never stands alone; a dot means no trade. The reason-code map is derived from the settled trades’ automatic reason (market, sector, news, company; F1.10). One stored week in the example data; the real page adds a week picker.'), el('div', {class:'end'}, seg('Show', [['net', `Profit (${SYMBOL[p.currency]})`], ['win', 'Win rate']], metric, k => { metric = k; render(); }), basis === 'backtest' ? el('span', {class:'muted'}, `back-test ${fmtDY(p.backtest_run.first_date)} – ${fmtDY(p.backtest_run.last_date)}`) : seg('Week', [['all', 'All weeks'], ...weeks.map(w => [w, w])], week, k => { week = k; render(); }, 'The ISO week of the trades’ exit, or all weeks pooled (F2.8: the cells are stored per week).'))));
  const cells = cellsAll.filter(c => c.week === week), cellOf = (id, dim, col) => { const c = cells.find(x => x.strategy_id === id && x.dimension === dim && x.column === col); return c ? {n: c.trades, net: c.net_pnl, win: c.win_rate} : null; };
  const strategyRows = p.rows.filter(r => r.scope === 'strategy' && r.view === view && r.basis === basis), ids = Object.keys(p.strategies).filter(id => (basis === 'backtest' && strategyRows.some(r => r.strategy_id === id)) || cells.some(c => c.strategy_id === id));
  if (!ids.length) { card.append(el('div', {class:'quiet'}, 'No settled trade in this view and basis yet.')); return card; }
  const g = el('div', {class:'hms'});
  g.append(heat('By horizon', 'Which holding period works for each strategy.', ids, p.horizons.map(k => ({label: `N+${k}`, full: `N+${k}`})), (id, c) => { if (basis === 'forward') return cellOf(id, 'horizon', c.label.slice(2)); const r = strategyRows.find(x => x.strategy_id === id && String(x.horizon_days) === c.label.slice(2)); return r ? {n: r.trades, net: r.net_pnl, win: r.win_rate} : null; }, p));
  const tickers = [...new Set(cells.filter(c => c.dimension === 'company').map(c => c.column))].sort();
  if (!tickers.length) g.append(el('div', {class:'quiet'}, basis === 'backtest' ? 'By company: the back-test stores no split by company.' : 'By company: no per-company row in this view yet.')); else g.append(heat('By company', 'Which companies each strategy reads well (all horizons pooled). A per-company lead on a handful of trades is mostly luck; the Stock strategies page shows the luck test.', ids, tickers.map(t => ({label: t, full: companyOf(market, t).name})), (id, c) => cellOf(id, 'company', c.label), p));
  const rgRows = p.rows.filter(r => r.scope === 'strategy_regime' && r.view === view && r.basis === basis), regimes = [...new Set(rgRows.map(r => r.regime))].sort();
  if (!regimes.length) g.append(el('div', {class:'quiet'}, basis === 'backtest' ? 'By market regime: the back-test stores no split by regime.' : 'By market regime: no per-regime row in this view yet.')); else g.append(heat(week === 'all' ? 'By market regime' : 'By market regime (all weeks)', 'The regime at prediction time (F2.6); the scoreboard stores the regime split for all weeks only, so this map does not follow the week picker. rule strategies either filter EVENT_HEAVY and UNSTABLE days or not; the effect is measured here, not assumed.', ids, regimes.map(r => ({label: REGIME_WORDS[r] || r, full: r})), (id, c) => { const r = rgRows.find(x => x.strategy_id === id && x.regime === c.full); return r ? {n: r.trades, net: r.net_pnl, win: r.win_rate} : null; }, p));
  const codes = [...new Set(cells.filter(c => c.dimension === 'reason_code').map(c => c.column))].sort();
  if (codes.length) g.append(heat('By reason the price moved', 'The main cause of each settled trade’s move, from the automatic reason split (F1.10, decision 43): did the strategy make its money when the market lifted, when the sector did, on verified news, or on something company-specific?', ids, codes.map(c => ({label: REASON[c] || c, full: (REASON[c] || c) + ' (' + c + ')'})), (id, c) => cellOf(id, 'reason_code', c.full.slice(c.full.lastIndexOf('(') + 1, -1)), p));
  card.append(g);
  card.append(el('div', {class:'hmleg'}, el('span', {}, metric === 'net' ? 'Profit after market cost:' : 'Win rate:'), el('span', {class:'sc', 'aria-hidden':'true'}, el('i', {style:'background:color-mix(in srgb, var(--mb-color-down) 60%, var(--md-sys-color-surface-container-lowest))'}), el('i', {style:'background:color-mix(in srgb, var(--mb-color-down) 25%, var(--md-sys-color-surface-container-lowest))'}), el('i', {style:'background:var(--md-sys-color-surface-container-low)'}), el('i', {style:'background:color-mix(in srgb, var(--mb-color-up) 25%, var(--md-sys-color-surface-container-lowest))'}), el('i', {style:'background:color-mix(in srgb, var(--mb-color-up) 60%, var(--md-sys-color-surface-container-lowest))'})), el('span', {}, metric === 'net' ? 'loss … profit, darker = larger; the number is in every cell (k = thousand; the exact figure in the tooltip)' : 'below half … above half; the number is in every cell'), el('span', {}, '· = no trade · every cell’s tooltip has the trade count')));
  return card;
}

function legend() {
  return el('div', {class:'legend2', 'aria-label':'Legend'}, el('span', {}, 'Legend (sample values): ', el('span', {class:'mb-delta up'}, '+1.2%'), ' up, ', el('span', {class:'mb-delta down'}, '−1.2%'), ' down, always with the sign'),
    el('span', {}, el('i', {class:'sw r'}), 'rule ', el('i', {class:'sw b'}), 'baselines ', el('i', {class:'sw a'}), 'AI'),
    el('span', {}, el('span', {class:'mb-label success'}, 'edge'), ' the corrected luck interval lies above zero; ', el('span', {class:'mb-label neutral'}, 'luck?'), ' it includes zero; ', el('span', {class:'mb-label danger'}, 'loss'), ' it lies wholly below zero'),
    el('span', {}, el('span', {class:'mb-label neutral'}, 'too few to rank'), ` under ${MIN_TRADES_TO_RANK} settled trades`),
    el('span', {}, el('span', {class:'mb-tag paper'}, 'paper'), ' every signal and trade until proven; nothing here is advice'));
}

let cumRo;
function render() {
  const p = P(market); if (!selected || !p.strategies[selected]) { const {ids, byId} = ranking(p); selected = ids.find(id => byId[id]) || p.reference_strategy; }
  document.title = `Market brief · Strategy lab · ${LABEL[market]}`; $('#title').textContent = `Strategy lab · ${p.name}`;

  page.append(el('div', {style:'margin-top:16px'}, leaderboard(p)));
  const grid = el('div', {class:'grid even'}); grid.append(detail(p), cumCard(p)); page.append(grid);
  page.append(el('div', {style:'margin-top:16px'}, heatmaps(p)), legend(), footer(market, D.endpoint));
  makeFocusable(page);
