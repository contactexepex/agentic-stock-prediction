<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market brief · Assistant</title>
<meta name="description" content="Assistant page of the personal stock cockpit: ask the stored data in plain words; every answer cites the record ids and as-of times it used, says 'not in the data' when it is not, and never advises a real trade. Research only.">
<!--@@SYSTEM_CSS@@-->
<!--@@SHARED_CSS@@-->
<style>
/* Assistant mockup (design track, SPEC section 6 page 11, F11). Page-local layout only; every colour is a token. */
.chat{display:flex;flex-direction:column;gap:14px;padding:4px 0 8px}
.msg{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;max-width:92%}
.msg.q{grid-template-columns:1fr auto;justify-self:end;text-align:left}
.msg .bub{border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.55;min-width:0;overflow-wrap:anywhere}
.msg.q .bub{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);border-top-right-radius:4px}
.msg.a .bub{background:var(--md-sys-color-surface-container-low);border-top-left-radius:4px}
.msg.a .bub.nid{background:var(--mb-color-warn-container)} .msg.a .bub.dec{background:var(--mb-color-paper-container)}
.msg .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--md-sys-color-on-surface-variant);margin-top:6px}
.msg .meta .md-chip{font-size:11px;height:22px;padding:0 8px}
.cites{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cite{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border:1px solid var(--md-sys-color-outline-variant);border-radius:8px;padding:3px 8px;background:var(--md-sys-color-surface);color:var(--md-sys-color-on-surface);max-width:100%}
.cite code{font-size:11px;overflow-wrap:anywhere;white-space:normal;min-width:0}
.cite{flex-wrap:wrap}
.cite .k{color:var(--md-sys-color-on-surface-variant)}
.composer{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px;align-items:start}
.composer textarea{width:100%;min-height:44px;resize:vertical;border:1px solid var(--md-sys-color-outline);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;background:var(--md-sys-color-surface);color:var(--md-sys-color-on-surface);box-sizing:border-box}
.composer .cnt{font-size:11px;color:var(--md-sys-color-on-surface-variant);text-align:right;margin-top:4px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pend .bub{border:1px dashed var(--md-sys-color-outline)}
.rules li{margin:0 0 6px;font-size:13.5px;line-height:1.5}
.rules{padding-left:18px;margin:0}
.src{display:grid;gap:8px}
.src .row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;min-width:0}
.src .row code{font-size:11.5px;overflow-wrap:anywhere;white-space:normal;display:block}
.sugg .md-chip{white-space:normal;height:auto;min-height:32px;line-height:1.3;padding:5px 12px;text-align:left}
.src .row .when{color:var(--md-sys-color-on-surface-variant);font-size:12px}
.budget{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.budget div{background:var(--md-sys-color-surface-container-low);border-radius:8px;padding:8px 10px}
.budget .l{font-size:11px;color:var(--md-sys-color-on-surface-variant);text-transform:uppercase;letter-spacing:.3px} .budget .v{font-weight:700}
.grid.asst{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:1000px){ .grid.asst{grid-template-columns:minmax(0,1fr)} }
@media (max-width:599px){ .msg{max-width:100%} .composer{grid-template-columns:1fr} .composer .md-btn{justify-self:end} .cite code{max-width:150px} }
</style>
</head>
<body>
<!--@@ICONS@@-->
<div id="tip" class="md-tooltip" role="tooltip"></div>

<div class="mb-app">
  <nav class="mb-sidebar" aria-label="Pages" id="sidebar"></nav>
  <div class="mb-scrim" id="scrim"></div>
  <header class="mb-topbar" id="topbar">
    <button class="md-icon-btn mb-menu-btn" type="button" id="menu-btn" aria-label="Open the menu" aria-controls="sidebar" aria-expanded="false"><svg class="ms"><use href="#ms-menu"/></svg></button>
    <div class="mb-topbar-title" id="title">Assistant</div>
    <div class="mb-topbar-actions">
      <div class="md-segmented dense light" role="group" aria-label="Market" id="market-seg"></div>
      <a class="md-btn filled" href="../11-assistant/page.html" data-tip="Ask the assistant (page 11): answers cite ids and as-of times, read-only." aria-label="Ask the assistant"><svg class="ms"><use href="#ms-bolt"/></svg><span class="ask-l">Ask</span></a>
    </div>
  </header>
  <main class="mb-content"><div class="mb-content-inner" id="page"></div></main>
  <nav class="mb-navbar" aria-label="Pages" id="navbar"></nav>
</div>

<script>const D = /*__DATA__*/null;</script>
<!--@@SHARED_JS@@-->
<script>
shell(PAGES.assistant, 'Assistant', {bar: [NAV[0], NAV[1], NAV[2], NAV[8]]});
onMarketChange = () => render();
const pending = {india: [], us: []};   /* mockup state: questions typed on this page, never sent */
const KIND = {paper_trades_settled: ['settled paper trade', 'account_balance_wallet', () => PAGES.portfolios], news: ['news item', 'newspaper', () => PAGES.home], eod_analyses: ['end-of-day analysis', 'layers', () => PAGES.compare], strategy_predictions: ['prediction', 'science', () => PAGES.lab], head_to_head_picks: ['head-to-head pick', 'layers', () => PAGES.compare], scoreboard: ['scoreboard row', 'science', () => PAGES.lab]};
const kindOf = k => KIND[k] || [k.replace(/_/g, ' '), 'description', () => PAGES.help];
const CHANNEL = {dashboard: 'dashboard', slack: 'Slack /ask'};

function citeChip(m, c) {
  const [label, ico, href] = kindOf(c.kind);
  return el('a', {class:'cite', href: href(), 'data-tip': `${label} ${c.id}, stored ${fmtLocal(c.as_of, m, true)}; the answer used nothing stored after its as-of time.`}, icon(ico), el('span', {class:'k'}, label), el('code', {}, c.id));
}

function message(m, a) {
  const q = el('div', {class:'msg q'}, el('div', {}, el('div', {class:'bub'}, a.question), el('div', {class:'meta', style:'justify-content:flex-end'}, el('span', {class:'md-chip assist'}, icon(a.channel === 'slack' ? 'ms-public' : 'ms-home'), CHANNEL[a.channel] || a.channel), `asked ${fmtLocal(a.asked_at, m, true)}`)), avatar('verified_user', 'neutral', 'sm'));
  const state = a.declined ? ['dec', 'mb-label paper', 'ms-close', a.declined === 'advice' ? 'declined: no advice on real trades' : `declined: ${a.declined}`, 'The assistant never advises a real trade or a real buy or sell; it offers the paper record instead.']
    : a.not_in_data ? ['nid', 'mb-label warn', 'ms-info', 'not in the data', 'The stored data cannot answer this; the answer says what the data ends with and never guesses.']
    : ['', 'mb-label success', 'ms-check', 'answered from the data', 'Every number in the answer comes from the cited records; nothing stored after the as-of time was used.'];
  const bub = el('div', {class:'bub ' + state[0]}, a.text);
  const meta = el('div', {class:'meta'}, el('span', {class: state[1], 'data-tip': state[4]}, icon(state[2]), state[3]), `data as of ${fmtLocal(a.as_of, m, true)}`);
  const body = el('div', {}, bub, meta);
  if (a.cited.length) body.append(el('div', {class:'cites'}, ...a.cited.map(c => citeChip(m, c))));
  else if (!a.declined && !a.not_in_data) body.append(el('div', {class:'meta'}, 'no record cited'));
  const ans = el('div', {class:'msg a'}, avatar('bolt', 'info', 'sm'), body);
  return [q, ans];
}

function chatCard(m) {
  const p = P(m), card = el('section', {class:'card', 'aria-label':'Conversation'});
  card.append(el('div', {class:'head'}, el('h2', {}, 'Ask the data', help('The assistant reads the cockpit’s stored data through its read tools only (F10) and answers in plain words. It cites the ids and as-of times it used, says "not in the data" when the data cannot answer, and never advises a real trade. Nothing it says is a signal.')), el('span', {class:'mb-tag paper end'}, 'paper')));
  const chat = el('div', {class:'chat', role:'log', 'aria-live':'polite', 'aria-label':'Questions and answers'});
  if (!p.answers.length) chat.append(el('div', {class:'quiet'}, 'No question asked yet in this market.'));
  for (const a of p.answers) chat.append(...message(m, a));
  for (const q of pending[m]) chat.append(el('div', {class:'msg q pend'}, el('div', {}, el('div', {class:'bub'}, q), el('div', {class:'meta', style:'justify-content:flex-end'}, el('span', {class:'mb-label neutral'}, 'mockup: not sent'), 'the real panel sends it to the explain tool and shows the answer here')), avatar('verified_user', 'neutral', 'sm')));
  card.append(chat);
  const ta = el('textarea', {'aria-label':'Your question', placeholder:'Ask about a company, a trade, a strategy or the news, in plain words…', maxlength: String(ASSISTANT_QUESTION_MAX_CHARS)});
  const cnt = el('div', {class:'cnt'}, `0 / ${ASSISTANT_QUESTION_MAX_CHARS}`);
  ta.addEventListener('input', () => { cnt.textContent = `${ta.value.length} / ${ASSISTANT_QUESTION_MAX_CHARS}`; });
  const send = el('button', {class:'md-btn filled', type:'button'}, icon('ms-arrow_upward'), 'Ask');
  const submit = () => { const t = ta.value.trim(); if (!t) { ta.focus(); return; } pending[m].push(t); render(); };
  send.addEventListener('click', submit); ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { submit(); e.preventDefault(); } });
  card.append(el('div', {class:'composer'}, el('div', {}, ta, cnt), send));
  const sugg = el('div', {class:'sugg', 'aria-label':'Example questions'});
  for (const a of p.answers) { const b = el('button', {class:'md-chip assist', type:'button'}, a.question); b.addEventListener('click', () => { ta.value = a.question; ta.dispatchEvent(new Event('input')); ta.focus(); }); sugg.append(b); }
  card.append(el('div', {class:'note', style:'margin-top:10px'}, 'Example questions (click to fill):'), sugg);
  return card;
}

function rulesCard(m) {
  const card = el('section', {class:'card', 'aria-label':'How it answers'});
  card.append(el('div', {class:'head'}, el('h2', {}, 'How it answers')));
  card.append(el('ul', {class:'rules'},
    el('li', {}, el('b', {}, 'Stored data only.'), ' It reads what the pages read, through the read tools; it cannot write, trade or fetch the web.'),
    el('li', {}, el('b', {}, 'Every answer cites its records'), ' (the chips under it) and the as-of time it read up to; nothing stored later is used.'),
    el('li', {}, el('b', {}, '"Not in the data"'), ' when the question is outside what is stored, for example a close after the last stored session.'),
    el('li', {}, el('b', {}, 'Never advice.'), ' A question about real money is declined; the assistant points to the paper record instead.'),
    el('li', {}, el('b', {}, 'Same answers everywhere.'), ' The panel on every page and Slack /ask call the same tool; the dashboard shows who asked from the channel’s sign-in.'),
    el('li', {}, el('b', {}, `Kept ${ASSISTANT_LOG_DAYS} days.`), ' Conversations are an operational log, not a fact store.')));
  return card;
}

function sourcesCard(m) {
  const p = P(m), card = el('section', {class:'card', 'aria-label':'Records cited'});
  const seen = new Map(); for (const a of p.answers) for (const c of a.cited) if (!seen.has(c.id)) seen.set(c.id, c);
  card.append(el('div', {class:'head'}, el('h2', {}, 'Records cited', help('Every record the conversation rests on, with the time it was stored. Open one on its page.')), el('span', {class:'end muted'}, `${seen.size} record${seen.size === 1 ? '' : 's'}`)));
  if (!seen.size) { card.append(el('div', {class:'quiet'}, 'No record cited yet.')); return card; }
  const list = el('div', {class:'src'});
  for (const c of [...seen.values()].sort((x, y) => x.as_of.localeCompare(y.as_of) || x.id.localeCompare(y.id))) { const [label, ico, href] = kindOf(c.kind); list.append(el('div', {class:'row'}, avatar(ico, 'neutral', 'sm'), el('div', {}, el('div', {}, label), el('code', {'data-tip': c.id}, c.id), el('div', {class:'when'}, `stored ${fmtLocal(c.as_of, m, true)}`)), el('a', {class:'md-btn text small', href: href()}, 'Open', icon('ms-chevron_right')))); }
  card.append(list);
  return card;
}

function budgetCard(m) {
  const card = el('section', {class:'card', 'aria-label':'Budget'});
  card.append(el('div', {class:'head'}, el('h2', {}, 'Budget', help('F11: a hard monthly cap set in the provider console plus a daily budget in code; over budget the panel says so instead of answering. The budget is shared with the explain tool in every channel.'))));
  card.append(el('div', {class:'budget'}, el('div', {}, el('div', {class:'l'}, 'Per day'), el('div', {class:'v'}, `$${ASSISTANT_DAILY_USD.toFixed(2)}`)), el('div', {}, el('div', {class:'l'}, 'Per month, hard cap'), el('div', {class:'v'}, `$${ASSISTANT_MONTHLY_USD_CAP}`))));
  card.append(el('div', {class:'quiet'}, 'Today’s and this month’s spend are not in the example data (requested); the real panel shows both here and says "over budget" when either is reached.'));
  return card;
}

function render() {
  const p = P(market), page = $('#page'); page.innerHTML = '';
  document.title = `Market brief · Assistant · ${LABEL[market]}`; $('#title').textContent = 'Assistant';
  sideFoot(market); marketSeg(() => render());
  page.append(pageHead(market, 'Assistant', `${p.name} · ask the stored data in plain words · answers cite ids and as-of times · never advice · research only`));
  const g = el('div', {class:'grid asst'});
  g.append(chatCard(market), el('div', {class:'col'}, rulesCard(market), sourcesCard(market), budgetCard(market)));
  page.append(g, footer(market, D.endpoint));
  makeFocusable(page);
}
render();
</script>
</body>
</html>
