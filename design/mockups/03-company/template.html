<script>const D = /*__DATA__*/null;</script>
<!--@@SHARED_JS@@-->
<script>
let ticker = null, horizon = null, pending = {};
const hashParts = () => location.hash.slice(1).split('/');
if (hashParts()[1]) ticker = hashParts()[1];
shell(PAGES.company, 'Company');
onMarketChange = () => { ticker = null; horizon = null; render(); };
window.addEventListener('hashchange', () => { const t = hashParts()[1]; if (t && t !== ticker && P(market).pages[t]) { ticker = t; horizon = null; render(); } });
const CP = m => { const p = P(m); if (!ticker || !p.pages[ticker]) ticker = p.default_ticker; return p.pages[ticker]; };
const REASON = {market_up: ['market lift', 'The market explains most of the move (beta × benchmark move).'], market_down: ['market drag', 'The market explains most of the move (beta × benchmark move).'], sector_lift: ['sector lift', 'The sector moved beyond the market.'], sector_drag: ['sector drag', 'The sector moved beyond the market.'], news_positive: ['news', 'Verified news inside the window with the same sign as the rest of the move.'], news_negative: ['news', 'Verified news inside the window with the same sign as the rest of the move.'], company_specific: ['company specific', 'What is left after market, sector and news.'], target_reached: ['target reached', 'A high in the window reached the target.'], range_missed: ['range missed', 'The exit close fell outside the 80% range.']};
const EVT = {rbi_policy: 'RBI policy', fomc: 'Fed decision', cpi: 'US inflation (CPI)', jobs_report: 'US jobs report', fno_expiry: 'F&O expiry', weekly_expiry: 'weekly expiry', opex: 'options expiry', triple_witching: 'triple witching', index_rebalance: 'index rebalance', budget: 'budget', earnings: 'results', ex_dividend: 'ex-dividend', holiday: 'market closed'};
const KIND = {head_to_head: ['Head-to-head', 'info'], biggest_win: ['Biggest win', 'success'], biggest_miss: ['Biggest miss', 'warn']};
const horizonOf = id => { const m = /-(\d)d(@|$)/.exec(id); return m ? +m[1] : null; };
const refPred = (c, k) => c.predictions.find(r => r.strategy_id === P(market).reference_strategy && r.horizon_days === k) || null;
const sessionsAhead = (c, date) => { const s = P(market).status.session.session_date; return date === s ? 'the session being predicted' : date > s ? 'after today’s session' : 'past'; };

/* ---------- head ---------- */
function coHead(m, c) {
  const p = P(m), co = c.company, cur = p.currency;
  const h = el('div', {class:'cohead'});
  h.append(el('div', {class:'px'}, price(cur, co.last_close), el('small', {}, `last close, ${fmtD(co.last_close_date)}`)), delta(co.change_pct));
  h.append(el('span', {class:'md-chip', 'data-tip':'Sector set at onboarding; exchange where it is listed.'}, `${co.sector} · ${co.exchange}`));
  h.append(el('span', {class:'md-chip', 'data-tip': co.amount_overridden ? 'Money per paper trade, set by the owner for this company (differs from the default).' : 'Money per paper trade (the market’s default amount).'}, icon('ms-account_balance_wallet'), `${money(cur, co.amount)} per paper trade`, co.amount_overridden ? el('b', {}, ' · custom') : null));
  h.append(co.state === 'active' ? el('span', {class:'mb-label success', 'data-tip':'Active: predicted every session and traded on paper.'}, icon('ms-check'), 'active') : el('span', {class:'mb-label neutral', 'data-tip': `Inactive since ${fmtDY(co.state_since)}: still collected, never predicted or traded (decision 13).`}, icon('ms-pending'), `inactive since ${fmtD(co.state_since, false)}`));
  const acts = el('div', {class:'acts'});
  acts.append(el('a', {class:'md-btn tonal small', href: strategiesPage(co.ticker), 'data-tip':'Every strategy on this company, ranked by profit after costs (page 4).'}, icon('ms-science'), 'Strategies'));
  acts.append(el('button', {class:'md-btn outlined small', type:'button', onclick: () => openDialog(m, c, 'amount')}, icon('ms-account_balance_wallet'), 'Change amount'));
  acts.append(co.state === 'active' ? el('button', {class:'md-btn outlined small', type:'button', onclick: () => openDialog(m, c, 'deactivate')}, icon('ms-pending'), 'Deactivate') : el('button', {class:'md-btn outlined small', type:'button', onclick: () => openDialog(m, c, 'reactivate')}, icon('ms-check'), 'Reactivate'));
  const sel = el('select', {'aria-label':'Example company', onchange: e => { ticker = e.target.value; horizon = null; history.replaceState(null, '', `#${m}/${ticker}`); render(); }});
  for (const t of Object.keys(p.pages)) sel.append(el('option', {value: t, selected: t === c.ticker}, `${t} · ${companyOf(m, t).name}`));
  acts.append(el('span', {class:'pickco', 'data-tip':'Mockup only: the real page is one company per address; this picker shows every company the example data holds.'}, 'example', sel));
  h.append(acts);
  return h;
}

/* ---------- decision card ---------- */
function decision(m, c) {
  const p = P(m), co = c.company, cur = p.currency, a = (c.agreement[String(horizon)] || [])[0] || null, pr = refPred(c, horizon);
  const card = el('section', {class:'card', 'aria-label':'At a glance'});
  card.append(el('div', {class:'head'}, el('h2', {}, `${co.name} at a glance`), help('What the strategies say about this company for the selected horizon, today’s head-to-head picks, the reference strategy’s published range, and what is coming. It helps you judge the company; it never tells you to buy or sell. Every signal is Paper until a strategy meets the go-live bar.'), el('div', {class:'end'}, el('span', {class:'muted'}, 'Horizon', help('N+k: buy at the open of the session being predicted, sell at the close of the k-th market session after it. Opens on N+1 (decision 39).')), horizonTabs(p.horizons, horizon, k => { horizon = k; render(); }))));
  const g = el('div', {class:'dec'});
  /* 1 agreement */
  const c1 = el('div', {class:'cell'}); c1.append(el('div', {class:'l'}, icon('ms-trending_up'), `Who would buy at N+${horizon}`));
  if (a) { c1.append(el('div', {class:'v'}, `${a.buy} of ${a.of}`, el('small', {}, ' strategies')), el('div', {class:'s'}, a.avg_prob_up != null ? el('span', {}, 'buyers’ average chance ', odds(a.avg_prob_up, `Average probability of a rise given by the buyers that give one: ${pct(a.avg_prob_up, 1)}. 50% is a coin flip.`)) : 'buyers give a direction, not a probability'));
    const fb = el('div', {class:'fb'}); for (const f of ['rule','baseline','ai']) { const x = a.by_family[f]; fb.append(el('div', {class:'r'}, el('span', {class:'l'}, FAMILY_SHORT[f]), el('div', {class:'bar', role:'img', 'aria-label': `${FAMILY[f][0]}: ${x.buy} of ${x.of} buy`}, el('i', {class:'ser-' + FAMILY[f][2], style:`width:${x.of ? (100 * x.buy / x.of).toFixed(1) : 0}%`})), el('b', {}, `${x.buy}/${x.of}`))); } c1.append(fb); }
  else c1.append(el('div', {class:'v muted'}, '—'), el('div', {class:'s'}, 'No agreement row at this horizon.'));
  /* 2 reference range */
