<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market brief · Home</title>
<meta name="description" content="Home of the personal stock cockpit, per market: companies ranked by how many strategies would buy them at the chosen horizon, today's head-to-head paper trades, rule vs AI, open paper trades, alerts, the news that can carry a call and the last runs. Research only, every signal Paper.">
<!--@@SYSTEM_CSS@@-->
<style>
/* Home mockup (design track, SPEC section 6 page 1), scheme v2 "modern admin light" of design/system/:
   semi-dark sidebar, soft-shadow cards, icon tiles, pill tabs, gradient area chart. Every colour is a token;
   the only numbers in the template are CSS sizes, two spec constants (named below) and the legend's sample values. */
body{font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
.card{background:var(--md-sys-color-surface-container-lowest);border-radius:var(--mb-card-radius);box-shadow:var(--mb-card-shadow);padding:20px 22px;min-width:0}
.muted{color:var(--md-sys-color-on-surface-variant)}
.note{font-size:12.5px;color:var(--md-sys-color-on-surface-variant);margin:12px 0 0;overflow-wrap:anywhere}
.tk{font-weight:700;color:var(--md-sys-color-primary);text-decoration:none} .tk:hover{text-decoration:underline}
.quiet{font-size:13px;color:var(--md-sys-color-on-surface-variant);padding:12px 14px;border:1px dashed var(--md-sys-color-outline-variant);border-radius:var(--mb-panel-radius);background:var(--md-sys-color-surface-container-low)}
.h-lab{font-weight:700;color:var(--md-sys-color-on-primary-container);background:var(--md-sys-color-primary-container);border-radius:6px;padding:1px 7px;font-size:12px;white-space:nowrap}
.mb-odds svg{width:60px} .mb-odds b{min-width:0}
.sw{width:9px;height:9px;border-radius:3px;display:inline-block;vertical-align:0;margin-right:4px}
.sw.r,.ser-r{background:var(--mb-chart-1)} .sw.b,.ser-b{background:var(--mb-chart-2)} .sw.a,.ser-a{background:var(--mb-chart-3)}

/* page head */
.phead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-top:22px}
.phead h1{font:700 24px/1.2 var(--md-ref-typeface-plain);letter-spacing:-.4px;margin:0}
.phead .sub{font-size:13px;color:var(--md-sys-color-on-surface-variant);margin-top:4px}
.phead .chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.phead .chips .md-chip b{color:var(--md-sys-color-on-surface);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mb-color-down);display:inline-block;flex:none} .dot.open{background:var(--mb-color-up)}
.band{margin-top:16px}
.band .ms{color:var(--mb-color-on-warn-container)}

/* KPI row */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px}
.mb-kpi .v .tk{font-size:inherit}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:16px;margin-top:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.head h2{font:600 16px/1.3 var(--md-ref-typeface-plain);margin:0}
.head .end{margin-left:auto;display:inline-flex;align-items:center;gap:10px;font-size:12.5px;color:var(--md-sys-color-on-surface-variant)}
.head .go{font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:2px;text-decoration:none}
.head .go .ms{width:16px;height:16px}
.sub2{font-size:12.5px;color:var(--md-sys-color-on-surface-variant);margin:-8px 0 12px}

/* agreement */
.agl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.agl li{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:4px 16px;align-items:center;padding:14px 16px;border-radius:var(--mb-panel-radius);background:var(--md-sys-color-surface-container-low);min-width:0}
.agl li.top{background:var(--md-sys-color-primary-container)}
.agl .rk{font:700 20px/1 var(--md-ref-typeface-plain);color:var(--md-sys-color-primary);width:22px;text-align:center}
.agl .who{min-width:0}
.agl .who .nm{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.agl .who .nm small{font-weight:500;color:var(--md-sys-color-on-surface-variant);font-size:12.5px}
.agl .who .sent{font-size:13px;margin-top:2px} .agl .who .sent b{font-weight:700;font-size:15px}
.agl .bar{height:8px;border-radius:4px;background:var(--md-sys-color-surface-container-highest);margin-top:8px;overflow:hidden;display:flex}
.agl .bar i{display:block;height:100%}
.agl .fam{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.agl .hz{text-align:center} .agl .hz svg{width:96px;height:40px;display:block} .agl .hz small{display:block;font-size:10.5px;color:var(--md-sys-color-on-surface-variant);margin-top:2px}
.agl .hz rect.on{fill:var(--md-sys-color-primary)} .agl .hz rect.off{fill:var(--md-sys-color-surface-container-highest)} .agl .hz text{font-size:9px;fill:var(--md-sys-color-on-surface-variant)} .agl .hz text.on{fill:var(--md-sys-color-primary);font-weight:700}
.agl li.top .hz rect.off{fill:var(--mb-chart-band-50)}
.agl .right{text-align:right;min-width:0}
.agl .right .l{font-size:11px;color:var(--md-sys-color-on-surface-variant);margin-top:3px;white-space:nowrap}

/* chart */
.chart{position:relative}
.chart svg{width:100%;height:220px;display:block}
.chart .grid line{stroke:var(--mb-chart-grid)} .chart .axis text{font-size:11px;fill:var(--mb-chart-label)}
.chart .ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.r{stroke:var(--mb-chart-1)} .chart .ln.b{stroke:var(--mb-chart-2)} .chart .ln.a{stroke:var(--mb-chart-3)}
.chart .pt{stroke:var(--md-sys-color-surface);stroke-width:2} .chart .pt.r{fill:var(--mb-chart-1)} .chart .pt.b{fill:var(--mb-chart-2)} .chart .pt.a{fill:var(--mb-chart-3)}
.chart .cursor{stroke:var(--md-sys-color-outline);stroke-dasharray:3 3;opacity:0}
.chart .hit{fill:transparent}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-top:4px}
.legend b{font-weight:600}
.lastclose{display:grid;gap:6px;margin-top:14px}
.lastclose .t{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;align-items:center;border-radius:var(--mb-panel-radius);padding:8px 12px;background:var(--md-sys-color-surface-container-low);min-width:0}
.lastclose .t.lead{background:var(--md-sys-color-primary-container)}
.lastclose .l{font-size:11px;color:var(--md-sys-color-on-surface-variant);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.lastclose .v{font:700 16px/1.2 var(--md-ref-typeface-plain);letter-spacing:-.3px;white-space:nowrap;grid-column:2;grid-row:1 / span 2;text-align:right}
.lastclose .s{font-size:11.5px;color:var(--md-sys-color-on-surface-variant)}
.grid22{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;font-size:12.5px;align-items:stretch;margin-top:10px}
.grid22 .hd{font-size:10.5px;color:var(--md-sys-color-on-surface-variant);letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding:4px 8px;align-self:end}
.grid22 .rh{font-weight:600;padding:8px 6px;display:flex;align-items:center;gap:6px} .grid22 .rh .ms{width:15px;height:15px;color:var(--md-sys-color-primary)}
.grid22 .cell{border-radius:8px;padding:8px 10px;background:var(--md-sys-color-surface-container-low);min-width:0}
.grid22 .cell .v{font-weight:700;font-size:14.5px} .grid22 .cell .s{font-size:11px;color:var(--md-sys-color-on-surface-variant);display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center} .grid22 .cell .mb-label{white-space:normal;line-height:14px}
.grid22 .cell.none{border:1px dashed var(--md-sys-color-outline-variant);background:transparent;color:var(--md-sys-color-on-surface-variant);font-size:12px}

/* head-to-head */
.h2h{display:grid;gap:12px}
.cmp{border-radius:var(--mb-panel-radius);background:var(--md-sys-color-surface-container-low);padding:14px 16px;min-width:0}
.cmp .ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.cmp .ch .nm{font-weight:600;font-size:15px}
.cmp .ch .amt{margin-left:auto;color:var(--md-sys-color-on-surface-variant);font-size:12.5px}
.fams{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.fam-box{border-radius:10px;padding:12px 14px;background:var(--md-sys-color-surface-container-lowest);box-shadow:var(--mb-card-shadow);min-width:0}
.fam-box .fh{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
.fam-box .fh b{font-weight:700;font-size:13px}
.fam-box .fh{flex-wrap:wrap} .fam-box .fh small{color:var(--md-sys-color-on-surface-variant);min-width:0;overflow-wrap:anywhere}
.pk{display:grid;grid-template-columns:1fr;gap:3px;padding:8px 0;border-top:1px solid var(--md-sys-color-surface-container-high);font-size:12.5px;min-width:0}
.pk .rule{font-size:11.5px;color:var(--md-sys-color-on-surface-variant)}
.pk .line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.pk .det{font-size:11.5px;color:var(--md-sys-color-on-surface-variant);overflow-wrap:anywhere}
.pk .gain{font-weight:700;font-size:14px;margin-left:auto;display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.pk .gain .mb-label{font-size:11px;padding:1px 6px}
.cand{margin-top:8px;font-size:12px} .cand summary{cursor:pointer;color:var(--md-sys-color-primary);font-weight:600;font-size:12.5px}
.cand table{margin-top:6px} .cand td,.cand th{padding:5px 6px;font-size:12px}
.sumline{display:flex;align-items:center;gap:10px;font-size:13px;padding:10px 14px;border-radius:var(--mb-panel-radius);background:var(--md-sys-color-surface-container-low);margin-bottom:12px}

/* news */
.nl{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.nl li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--md-sys-color-surface-container-high);font-size:13px;min-width:0}
.nl li:first-child{border-top:0}
.nl .hd{min-width:0;overflow-wrap:anywhere} .nl .hd a.t{color:inherit;text-decoration:none;font-weight:600} .nl .hd a.t:hover{text-decoration:underline}
.nl .hd small{display:block;color:var(--md-sys-color-on-surface-variant);font-size:11.5px;margin-top:3px}
.nl .hd .md-badge{margin-left:4px;vertical-align:1px}
.aside{font-size:12.5px;margin:8px 0 0} .aside summary{cursor:pointer;color:var(--md-sys-color-primary);font-weight:600;font-size:12.5px}

/* open trades: every column from 1360 px; Entry, Last, To target and the dates only there (.cw); the range bar from 761 px (.cm) */
.ot{font-size:13px} .ot th{padding:9px 10px} .ot td{padding:8px 10px}
.ot td.num,.ot th.num{text-align:right;white-space:nowrap}
.ot tr.grp td{background:var(--md-sys-color-surface-container-low);font-weight:600;padding:8px 12px;font-size:13px}
.ot tr.grp td small{font-weight:500;color:var(--md-sys-color-on-surface-variant);margin-left:8px}
.ot td:first-child{white-space:normal}
@media (min-width:761px){ .ot td:first-child{min-width:120px} }
.ot .st{display:inline-flex;align-items:center;gap:4px;white-space:nowrap} .ot .st .ms{width:14px;height:14px}
.ot .st.flag{color:var(--mb-color-on-warn-container);font-weight:600} .ot .st.ok{color:var(--mb-color-up)}
.rng{display:inline-flex;align-items:center;gap:8px} .rng svg{width:100px;height:18px;display:block} .rng small{color:var(--md-sys-color-on-surface-variant);font-size:11px;white-space:nowrap}
@media (max-width:1359px){ .ot th.cw,.ot td.cw,.ot .cw{display:none} .ot th{padding:8px 6px} .ot td{padding:8px 6px} .ot .st{white-space:normal;align-items:start} .ot tr.grp td small{display:block;margin-left:0} }
@media (max-width:760px){ .ot th.cm,.ot td.cm{display:none} .ot td.num{white-space:normal} }

/* alerts */
.al{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.al li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:var(--mb-panel-radius);background:var(--mb-color-warn-container);color:var(--mb-color-on-warn-container);font-size:13px;min-width:0}
.al li b{color:var(--md-sys-color-on-surface)} .al li .d{color:var(--md-sys-color-on-surface);margin-top:2px} .al li small{display:block;margin-top:3px;font-size:11.5px}

/* runs timeline */
.runs{list-style:none;margin:0;padding:0;position:relative}
.runs li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:7px 0;font-size:13px;position:relative}
.runs li::before{content:"";position:absolute;left:13px;top:28px;bottom:-8px;width:2px;background:var(--md-sys-color-surface-container-high)}
.runs li:last-child::before{display:none}
.runs li .mb-mark{width:26px;height:26px;margin-top:0} .runs li .mb-mark .ms{width:15px;height:15px}
.runs li small{display:block;font-size:11.5px;color:var(--md-sys-color-on-surface-variant)}
.runs li .t{text-align:right;font-weight:600;white-space:nowrap} .runs li .t small{font-weight:500}

.legend2{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--md-sys-color-on-surface-variant);margin-top:18px;align-items:center}
footer{color:var(--md-sys-color-on-surface-variant);font-size:12px;text-align:center;padding:28px 0 8px} footer code{font-family:var(--md-ref-typeface-mono)}

@media (max-width: 1199px){ .kpis{grid-template-columns:repeat(2,1fr)} }
@media (max-width: 1000px){ .grid{grid-template-columns:1fr} }
@media (max-width: 760px){ .fams{grid-template-columns:1fr} .agl li{grid-template-columns:auto auto minmax(0,1fr) auto;padding:12px} .agl .hz{grid-column:2 / span 3;text-align:left} }
@media (max-width: 599px){
  .card{padding:16px}
  .phead{margin-top:16px} .phead h1{font-size:21px} .phead .chips{margin-left:0}
  .kpis{gap:12px} .mb-kpi{padding:14px;grid-template-columns:1fr} .mb-kpi .mb-avatar{grid-row:auto} .mb-kpi .s{grid-column:1} .mb-kpi .v{font-size:22px}
  .mb-alert{grid-template-columns:auto 1fr} .mb-alert .act{grid-column:1 / span 2}
  .fams{grid-template-columns:1fr}
  .ot tr.grp td small{display:block;margin-left:0} .ot td.num{white-space:normal}
  .agl li{grid-template-columns:auto auto minmax(0,1fr);padding:12px} .agl .hz{grid-column:1 / span 3;display:flex;align-items:center;gap:12px;text-align:left} .agl .hz small{margin:0} .agl .right{grid-column:1 / span 3;text-align:left;display:flex;align-items:center;gap:8px} .agl .right .l{margin:0}
}
</style>

<script>
const D = /*__DATA__*/null;
const $ = (s, el=document) => el.querySelector(s);
const el = (tag, attrs={}, ...kids) => { const n = document.createElement(tag); for (const [k,v] of Object.entries(attrs)) { if (v == null || v === false) continue; if (k==='class') n.className=v; else if (k==='html') n.innerHTML=v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? '' : v);} for (const k of kids) { if (k==null) continue; n.append(k.nodeType? k : document.createTextNode(String(k))); } return n; };
const svgEl = (tag, attrs={}) => { const n = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const [k,v] of Object.entries(attrs)) n.setAttribute(k, v); return n; };
const icon = (id, cls='ms') => { const s = svgEl('svg', {class: cls, 'aria-hidden': 'true'}); const u = svgEl('use'); u.setAttribute('href', '#'+id); s.append(u); return s; };
const help = tip => el('button', {class:'md-help', 'data-tip': tip, 'aria-label':'Explain', type:'button'}, '?');
const LABEL = {india: 'India', us: 'US'};
const ZONE = {india: 'IST', us: 'ET'};                      /* presentation only: the market's local clock label */
const LOCALE = {INR: 'en-IN', USD: 'en-US'}, SYMBOL = {INR: '₹', USD: '$'};
const FAMILY = {rule: ['Rule strategies', 'ms-settings', 'r'], baseline: ['Baselines', 'ms-trending_flat', 'b'], ai: ['AI traders', 'ms-bolt', 'a']};
const PICK = {best_expected_gain: 'Best expected gain', highest_probability: 'Highest probability'};
const BAND = {below80: ['below the 80% range', 'flag'], below50: ['below the 50% range', ''], inside50: ['inside the 50% range', 'ok'], above50: ['above the 50% range', ''], above80: ['above the 80% range', 'flag']};
const FLAG = {outside_range: 'outside its range', far_from_target: 'far from its target', against_prediction: 'against the prediction'};
const BAND_SHORT = {below80: 'below 80%', below50: 'below 50%', inside50: 'inside 50%', above50: 'above 50%', above80: 'above 80%'}, FLAG_SHORT = {outside_range: 'outside range', far_from_target: 'far from target', against_prediction: 'against prediction'};
const STATUS = {confirmed_primary: ['confirmed', 'A primary document (exchange filing, company release) confirms it. Can be the main evidence of a call.', 'ms-verified_user'],
  corroborated: ['corroborated', 'Two or more independent outlets reported it on their own. Can be the main evidence of a call.', 'ms-check'],
  single_source: ['single source', 'One independent origin so far. Lowers a call’s confidence; cannot be the main evidence.', 'ms-warning'],
  unverified: ['unverified', 'No vetted outlet read yet. Lowers confidence; cannot be the main evidence.', null],
  rumour: ['rumour', 'Reported as a rumour or from unnamed sources. Never supports a call.', 'ms-close'],
  promotional: ['promotional', 'A paid, promotional or opinion item. Never supports a call.', 'ms-close'],
  contradicted: ['contradicted', 'A checked claim conflicts with a primary document. Can only widen a range.', 'ms-close']};
const CAN_CARRY = ['confirmed_primary', 'corroborated'];
/* Spec constants (not data): docs/SPEC.md F7.2 go-live bar = 2 months of forward paper trading; section 7 = two intraday checks per session. */
const GO_LIVE_MONTHS = 2, INTRADAY_CHECKS_PER_SESSION = 2;
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], DOWL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dt = iso => new Date(iso.slice(0,10)+'T00:00:00Z');
const fmtD = (iso, dow=true) => { const d = dt(iso); return (dow? DOW[d.getUTCDay()]+' ' : '') + d.getUTCDate() + ' ' + MON[d.getUTCMonth()]; };
const offsetMin = local => { const m = /([+-])(\d\d):(\d\d)$/.exec(local); return m ? (m[1]==='-'?-1:1) * (60*+m[2] + +m[3]) : 0; };
const fmtLocal = (iso, m, withDate=false) => { if (!iso) return '—'; const t = new Date(new Date(iso).getTime() + offsetMin(P(m).status.session.local_time)*60000); const hm = `${String(t.getUTCHours()).padStart(2,'0')}:${String(t.getUTCMinutes()).padStart(2,'0')}`; return (withDate ? `${t.getUTCDate()} ${MON[t.getUTCMonth()]} ` : '') + `${hm} ${ZONE[m]}`; };
const sgn = (x, dec=2, unit='%') => (x>0?'+':x<0?'−':'') + Math.abs(x).toFixed(dec) + unit;
const pct = (x, dec=0) => x == null ? '—' : (x*100).toFixed(dec) + '%';
const money = (cur, x, dec=0, sign=false) => { if (x == null) return '—'; const s = Math.abs(x).toLocaleString(LOCALE[cur], {minimumFractionDigits: dec, maximumFractionDigits: dec}); return (sign ? (x>0?'+':x<0?'−':'') : (x<0?'−':'')) + SYMBOL[cur] + s; };
const price = (cur, x) => x == null ? '—' : x.toLocaleString(LOCALE[cur], {minimumFractionDigits: 2, maximumFractionDigits: 2});
const delta = (x, dec=2, unit='%') => x == null ? el('span', {class:'muted'}, '—') : el('span', {class:'mb-delta '+(x>0?'up':x<0?'down':'flat')}, sgn(x, dec, unit));
const moneyDelta = (cur, x, dec=0) => x == null ? el('span', {class:'muted'}, '—') : el('span', {class:'mb-delta '+(x>0?'up':x<0?'down':'flat')}, money(cur, x, dec, true));

/* cumulative profit after costs per family, by settlement day (settled trades of the last sessions) */
function pnlChart(m) {
  const p = P(m), cur = p.currency, rows = p.settled_trades.filter(r => r.view === 'accuracy');
  const days = [...new Set(rows.map(r => r.exit_date_actual))].sort();
  const fams = ['rule', 'ai', 'baseline'];
  const series = fams.map(f => { let acc = 0; return {f, pts: days.map(d => { acc += rows.filter(r => r.family === f && r.exit_date_actual === d).reduce((a, r) => a + r.net_pnl, 0); return acc; })}; });
  const W = 420, H = 220, L = 54, R = 12, T = 14, B = 30;
  const all = series.flatMap(s => s.pts).concat([0]); let lo0 = Math.min(...all), hi0 = Math.max(...all); if (hi0 === lo0) hi0 = lo0 + 1;
  const niceStep = span => { const raw = span / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / mag; return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 5 ? 5 : 10) * mag; };
  const step = niceStep(hi0 - lo0), lo = Math.floor(lo0 / step) * step, hi = Math.ceil(hi0 / step) * step;
  const X = i => L + (days.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (days.length - 1)), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const s = svgEl('svg', {viewBox:`0 0 ${W} ${H}`, role:'img', 'aria-label': 'Cumulative profit after costs per family'});
  const defs = svgEl('defs');
  for (const [k, c] of [['r','--mb-chart-1-fill'],['b','--mb-chart-2-fill'],['a','--mb-chart-3-fill']]) { const g = svgEl('linearGradient', {id:'g-'+k, x1:0, y1:0, x2:0, y2:1}); g.append(svgEl('stop', {offset:'0', 'stop-color':`var(${c})`}), svgEl('stop', {offset:'1', 'stop-color':`var(${c})`, 'stop-opacity':'0'})); defs.append(g); }
  s.append(defs);
  const grid = svgEl('g', {class:'grid'}), axis = svgEl('g', {class:'axis'});
  for (let v = lo; v <= hi + step / 2; v += step) { const y = Y(v); grid.append(svgEl('line', {x1: L, x2: W - R, y1: y, y2: y})); const t = svgEl('text', {x: L - 6, y: y + 4, 'text-anchor':'end'}); t.textContent = money(cur, Math.round(v), 0, true).replace('+', ''); axis.append(t); }
  if (lo < 0 && hi > 0) grid.append(svgEl('line', {x1: L, x2: W - R, y1: Y(0), y2: Y(0), style:'stroke:var(--md-sys-color-outline)'}));
  days.forEach((d, i) => { const t = svgEl('text', {x: X(i), y: H - 8, 'text-anchor':'middle'}); t.textContent = fmtD(d, false); axis.append(t); });
  s.append(grid, axis);
  const smooth = pts => pts.map((pt, i) => i === 0 ? `M${pt[0]},${pt[1]}` : (() => { const p0 = pts[i-1], c1x = p0[0] + (pt[0] - p0[0]) / 2; return `C${c1x},${p0[1]} ${c1x},${pt[1]} ${pt[0]},${pt[1]}`; })()).join(' ');
  for (const ser of series) {
    const pts = ser.pts.map((v, i) => [X(i), Y(v)]), k = FAMILY[ser.f][2];
    if (pts.length > 1) s.append(svgEl('path', {d: smooth(pts) + ` L${pts[pts.length-1][0]},${Y(lo)} L${pts[0][0]},${Y(lo)} Z`, fill: `url(#g-${k})`}));
    s.append(svgEl('path', {class:'ln ' + k, d: pts.length > 1 ? smooth(pts) : `M${pts[0][0]-6},${pts[0][1]} L${pts[0][0]+6},${pts[0][1]}`}));
    pts.forEach(pt => s.append(svgEl('circle', {class:'pt ' + k, cx: pt[0], cy: pt[1], r: 4})));
  }
  const cursor = svgEl('line', {class:'cursor', y1: T, y2: H - B}); s.append(cursor);
  days.forEach((d, i) => { const half = (W - L - R) / Math.max(1, days.length - 1) / 2, x0 = Math.max(L, X(i) - half), x1 = Math.min(W - R, X(i) + half); const hit = svgEl('rect', {class:'hit', x: x0, y: T, width: x1 - x0, height: H - T - B, tabindex: 0, 'data-tip': `${fmtD(d)}: ` + series.map(ser => `${FAMILY[ser.f][0]} ${money(cur, ser.pts[i], dec(cur), true)}`).join(' · ') + ` (cumulative, after costs)`}); hit.addEventListener('pointerenter', () => { cursor.setAttribute('x1', X(i)); cursor.setAttribute('x2', X(i)); cursor.style.opacity = 1; }); hit.addEventListener('pointerleave', () => cursor.style.opacity = 0); s.append(hit); });
  const wrap = el('div', {class:'chart'}, s);
  const legend = el('div', {class:'legend'});
  for (const ser of series) legend.append(el('span', {}, el('i', {class:'sw ' + FAMILY[ser.f][2]}), `${FAMILY[ser.f][0]} `, el('b', {}, money(cur, ser.pts[ser.pts.length - 1], dec(cur), true))));
  return [wrap, legend, days, rows.length];
}

  }
  card.append(el('div', {class:'head', style:'margin:16px 0 4px'}, el('h2', {style:'font-size:13.5px'}, 'Head-to-head to date'), help('Head-to-head view: one trade per company, family and pick rule each day. Profit after costs, settled trades and win rate. Fewer than 20 trades: too few to rank (SPEC section 6).')));

function headToHead(m) {
  const p = P(m), cur = p.currency, picks = p.head_to_head;
  const card = el('section', {class:'card', 'aria-label':'Today’s head-to-head paper trades'});
  card.append(el('div', {class:'head'}, el('h2', {}, 'Today’s head-to-head trades'), el('span', {class:'mb-tag paper'}, 'paper'), help('Decisions 41-42: for each company, the strongest rule strategy and the strongest AI trader each choose one horizon under two pick rules: best expected gain (the horizon with the highest p × move − (1 − p) × loss − costs) and highest probability. Up to four paper trades of the company’s amount per company per day. A pick clears costs when its expected gain after costs is above zero.'), el('div', {class:'end'}, el('a', {class:'go', href:'../06-rule-vs-ai/page.html'}, 'Rule vs AI', icon('ms-chevron_right')))));

  card.append(el('div', {class:'sumline'}, avatar(viable.length ? 'check' : 'info', viable.length ? 'success' : 'neutral', 'sm'), el('span', {}, `${picked.length} paper trades today across ${Object.keys(byTicker).length} compan${Object.keys(byTicker).length === 1 ? 'y' : 'ies'} · `, el('b', {}, viable.length ? `${viable.length} clear costs` : 'No pick clears costs today'), ' (expected gain after costs above zero)')));
  const list = el('div', {class:'h2h'});
  for (const [t, ks] of Object.entries(byTicker)) {
    const c = companyOf(m, t), box = el('div', {class:'cmp'});
    box.append(el('div', {class:'ch'}, avatar('apartment', 'neutral', 'sm'), el('a', {class:'tk', href: strategiesPage(t)}, t), el('span', {class:'nm'}, c.name), el('span', {class:'muted', style:'font-size:12.5px'}, `close ${price(cur, ks[0].base_close)}`), el('span', {class:'amt', 'data-tip': c.amount_overridden ? 'This company’s amount is overridden (decision 44).' : 'The market’s default amount per paper trade (decision 26).'}, `${money(cur, ks[0].amount)} per trade${c.amount_overridden ? ' (override)' : ''}`)));
    if (ks.every(k => k.status !== 'picked')) { box.append(el('div', {class:'quiet', style:'margin-top:10px;background:var(--md-sys-color-surface-container-lowest)'}, `No candidate: no rule strategy and no AI trader buys ${c.name} at any horizon today, so no head-to-head trade.`)); list.append(box); continue; }
    const fams = el('div', {class:'fams'});

      const fk = ks.filter(k => k.family === f), fb = el('div', {class:'fam-box'});
      const any = fk.find(k => k.status === 'picked'), st = any ? stratOf(m, any.strategy_id) : null;
      fb.append(el('div', {class:'fh'}, avatar(FAMILY[f][1], f === 'ai' ? 'info' : '', 'sm'), el('b', {}, FAMILY[f][0].replace(' strategies','').replace(' traders','')), st ? el('small', {'data-tip': `${st.name} (${any.strategy_id}): the family’s strongest strategy with a buyable horizon today, ranked on ${any.strongest_basis === 'per_company' ? 'this company (20+ settled trades on it)' : 'all companies (fewer than 20 settled trades on this one)'}.`}, `· ${st.name}`) : el('small', {}, '· no candidate')));
      for (const k of fk) {
        const row = el('div', {class:'pk'});
        row.append(el('span', {class:'rule'}, PICK[k.pick_rule]));
        if (k.status !== 'picked') { row.append(el('span', {class:'line muted'}, 'no candidate')); fb.append(row); continue; }
        row.append(el('span', {class:'line'}, el('span', {class:'h-lab'}, `N+${k.horizon_days}`), odds(k.prob_up, `${pct(k.prob_up, 1)} chance of a rise from the open to the N+${k.horizon_days} close (the prediction ${k.prediction_id}).`),
          el('span', {class:'gain'}, moneyDelta(cur, k.expected_gain_pct * k.amount / 100, dec(cur)), el('span', {class:'mb-label ' + (k.expected_gain_pct > 0 ? 'success' : 'danger'), 'data-tip': `Expected gain after costs ${sgn(k.expected_gain_pct)} of ${money(cur, k.amount)}: ${pct(k.prob_up,1)} × ${sgn(k.move_pct)} − ${pct(1-k.prob_up,1)} × ${k.loss_pct}% − ${k.costs_pct}%.`}, icon(k.expected_gain_pct > 0 ? 'ms-check' : 'ms-close'), `${sgn(k.expected_gain_pct)} · ${k.expected_gain_pct > 0 ? 'clears costs' : 'below costs'}`))));
        row.append(el('span', {class:'det'}, `to target ${sgn(k.move_pct)} · downside ${sgn(-k.loss_pct)} · costs ${k.costs_pct}%`));
        fb.append(row);

        const det = el('details', {class:'cand'}, el('summary', {}, `Why these horizons: ${any.candidates.length} buyable horizons`));
        const tb = el('table', {class:'md-table'}, el('thead', {}, el('tr', {}, el('th', {}, 'Horizon'), el('th', {class:'num'}, 'Chance'), el('th', {class:'num'}, 'To target'), el('th', {class:'num'}, 'Downside'), el('th', {class:'num'}, 'Costs'), el('th', {class:'num'}, 'Expected'))));
        const tbody = el('tbody');

        tb.append(tbody); det.append(el('div', {class:'md-table-wrap'}, tb)); fb.append(det);

  card.append(list);

}

function newsCard(m) {

  const item = n => el('li', {}, sent(n.enrichment.sentiment), el('div', {class:'hd'}, ...n.primary_tickers.map(t => el('a', {class:'tk', href: companyPage(t), style:'margin-right:4px'}, t)), el('a', {class:'t', href: n.url, rel:'noopener', target:'_blank'}, n.title), badge(n.status), el('small', {}, `${n.source} · ${n.enrichment.materiality} materiality · ${n.enrichment.event_type} · ${n.independent_origins} independent origin${n.independent_origins === 1 ? '' : 's'}${n.primary_ids.length ? `, ${n.primary_ids.length} filing` : ''} · ${fmtLocal(n.published_at, m, true)}`)));

function rangeBar(cur, r, ck) {
  const last = ck ? ck.last_price : r.last_price;
  const lo = Math.min(r.lo80, r.entry_price, last) * 0.997, hi = Math.max(r.hi80, r.entry_price, last, r.target_price) * 1.003, X = v => (v - lo) / (hi - lo) * 96 + 2;
  const s = svgEl('svg', {viewBox:'0 0 100 18', role:'img', 'aria-label':`80% range ${price(cur, r.lo80)} to ${price(cur, r.hi80)}, last ${price(cur, last)}`});
  s.append(svgEl('rect', {x: X(r.lo80), y: 5, width: X(r.hi80) - X(r.lo80), height: 8, rx: 4, fill: 'var(--mb-chart-band-80)'}));
  s.append(svgEl('rect', {x: X(r.lo50), y: 5, width: X(r.hi50) - X(r.lo50), height: 8, rx: 4, fill: 'var(--mb-chart-band-50)'}));
  s.append(svgEl('line', {x1: X(r.entry_price), x2: X(r.entry_price), y1: 3, y2: 15, stroke: 'var(--md-sys-color-outline)', 'stroke-width': 1.5, 'stroke-dasharray': '2 1.5'}));
  s.append(svgEl('path', {d: `M${X(r.target_price)-3},1 L${X(r.target_price)+3},1 L${X(r.target_price)},5 Z`, fill: 'var(--mb-chart-1)'}));
  s.append(svgEl('line', {x1: X(last), x2: X(last), y1: 2, y2: 16, stroke: 'var(--md-sys-color-on-surface)', 'stroke-width': 2}));
  return el('span', {class:'rng', 'data-tip': `Predicted 50% range ${price(cur, r.lo50)}–${price(cur, r.hi50)}, 80% range ${price(cur, r.lo80)}–${price(cur, r.hi80)}; target ${price(cur, r.target_price)} (the triangle); entry ${price(cur, r.entry_price)} (dotted); ${ck ? 'price at the check' : 'last close'} ${price(cur, last)} (the dark line).`}, s);
}

function openTrades(m) {
  const p = P(m), cur = p.currency, rows = p.open_trades;
  const card = el('section', {class:'card', 'aria-label':'Open paper trades'});
  const h2h = rows.filter(r => r.view === 'head_to_head').length;
  card.append(el('div', {class:'head'}, el('h2', {}, 'Open paper trades'), el('span', {class:'mb-tag paper'}, 'paper'), help('Every paper trade that has entered (bought at the open of its entry session) and not yet exited, all strategies and horizons: the accuracy view (one trade per qualifying prediction) and the head-to-head view (H2H). Unrealised = the latest stored close against the entry, before costs. Range = where the price sits in the trade’s own predicted range. Check = the latest intraday check of the day, where one exists.'), el('div', {class:'end'}, `${rows.length} open · ${rows.length - h2h} accuracy, ${h2h} head-to-head`, el('a', {class:'go', href:'../07-paper-portfolios/page.html'}, 'All trades', icon('ms-chevron_right')))));
  if (!rows.length) { card.append(el('div', {class:'quiet'}, 'No open paper trade.')); return card; }

  const tb = el('table', {class:'md-table ot'});
  tb.append(el('thead', {}, el('tr', {}, el('th', {}, 'Strategy'), el('th', {}, 'Horizon'), el('th', {class:'num cw'}, 'Entry'), el('th', {class:'num cw'}, 'Last'), el('th', {class:'num'}, 'Unrealised'), el('th', {class:'cm'}, 'Predicted range'), el('th', {class:'num cw'}, 'To target'), el('th', {}, 'Check'))));
  const tbody = el('tbody');
  const byT = {}; for (const r of rows) (byT[r.ticker] = byT[r.ticker] || []).push(r);
  for (const [t, trs] of Object.entries(byT)) {
    const c = companyOf(m, t), sum = trs.reduce((a, r) => a + r.unrealised_pnl, 0);
    tbody.append(el('tr', {class:'grp'}, el('td', {colspan: 8}, el('a', {class:'tk', href: companyPage(t), 'data-tip': `${c.name}: open its company page (chart with targets and ranges, today’s path, settled results).`}, t), ` ${c.name}`, el('small', {}, `${trs.length} open · last ${price(cur, trs[0].last_price)} (${fmtD(trs[0].last_price_date, false)}) · unrealised `), moneyDelta(cur, sum, dec(cur)))));
    for (const r of trs.slice().sort((a, b) => a.horizon_days - b.horizon_days || a.strategy_id.localeCompare(b.strategy_id))) {
      const st = stratOf(m, r.strategy_id), ck = checks[r.trade_id];
      let status;
      if (!ck) status = el('span', {class:'st muted', 'data-tip':'No intraday check stored for this trade by the cut-off.'}, '—');
      else { const b = BAND[ck.band] || [ck.band, '']; const fl = ck.flags.map(f => FLAG[f] || f); status = el('span', {class:'st ' + (ck.flagged ? 'flag' : b[1]), 'data-tip': `${fmtLocal(ck.check_at, m)}: ${price(cur, ck.last_price)}, ${sgn(ck.ret_since_entry_pct)} since entry, ${b[0]}${fl.length ? '; ' + fl.join(', ') : ''}. Session ${ck.session_number} of the holding window.`}, icon(ck.flagged ? 'ms-warning' : 'ms-check'), ck.flagged ? ck.flags.map(f => FLAG_SHORT[f] || f).join(', ') : (BAND_SHORT[ck.band] || ck.band)); }
      tbody.append(el('tr', {}, el('td', {}, st.name, r.view === 'head_to_head' ? el('span', {class:'mb-label neutral', style:'margin-left:6px;font-size:10.5px;padding:0 5px', 'data-tip':'Head-to-head view: one of the up to four daily picks for this company.'}, 'H2H') : null), el('td', {}, el('span', {class:'h-lab'}, `N+${r.horizon_days}`), el('small', {class:'muted cw', style:'white-space:nowrap'}, ` ${fmtD(r.entry_date, false)} → ${fmtD(r.exit_date, false)}`)), el('td', {class:'num cw'}, price(cur, r.entry_price)), el('td', {class:'num cw'}, price(cur, r.last_price)), el('td', {class:'num'}, moneyDelta(cur, r.unrealised_pnl, dec(cur)), el('span', {class:'cw'}, ' ', delta(r.unrealised_pct))), el('td', {class:'cm'}, rangeBar(cur, r, ck)), el('td', {class:'num cw'}, el('span', {'data-tip': r.to_target_pct < 0 ? `Already past the target ${price(cur, r.target_price)}.` : `${sgn(r.to_target_pct)} to the target ${price(cur, r.target_price)}.`}, r.to_target_pct < 0 ? 'past target' : sgn(r.to_target_pct))), el('td', {}, status)));
    }
  }
  tb.append(tbody);
  card.append(el('div', {class:'md-table-wrap'}, tb));
  return card;

function alerts(m) {
  const p = P(m), cur = p.currency, flagged = p.trade_checks.filter(c => c.flagged);
  const card = el('section', {class:'card', 'aria-label':'Alerts'});
  card.append(el('div', {class:'head'}, el('h2', {}, 'Alerts'), help('Flagged intraday trade checks of the latest check today: an open paper trade outside its range, far from its target, or moving against the prediction. Monitoring only; nothing is traded on an alert.'), el('div', {class:'end'}, p.trade_checks.length ? `check at ${fmtLocal(p.trade_checks[0].check_at, m)}` : 'no check yet')));
  if (!p.trade_checks.length) { card.append(el('div', {class:'quiet'}, 'No intraday check stored yet today. Checks run twice per session; the first one fills this card.')); return card; }
  if (!flagged.length) { card.append(el('div', {class:'quiet'}, `No open trade is flagged at the ${fmtLocal(p.trade_checks[0].check_at, m)} check.`)); return card; }
  const ul = el('ul', {class:'al'});
  const byT = {}; for (const c of flagged) (byT[c.ticker] = byT[c.ticker] || []).push(c);
  for (const [t, cks] of Object.entries(byT)) {
    const c = companyOf(m, t), flags = [...new Set(cks.flatMap(x => x.flags))].map(f => FLAG[f] || f);
    ul.append(el('li', {}, avatar('warning', 'warn', 'sm'), el('div', {}, el('b', {}, el('a', {class:'tk', href: companyPage(t)}, t), ` ${c.name}: ${cks.length} open trade${cks.length === 1 ? '' : 's'} ${flags.join(' and ')}`),
      el('div', {class:'d'}, `${price(cur, cks[0].last_price)} at ${fmtLocal(cks[0].check_at, m)} · ${sgn(cks[0].ret_since_entry_pct)} since entry ${price(cur, cks[0].entry_price)}`),
      el('small', {}, cks.map(x => `${stratOf(m, x.strategy_id).name} N+${x.horizon_days} (${(BAND[x.band] || [x.band])[0]}, session ${x.session_number})`).join(' · ')))));
  }
  card.append(ul);

}

function runs(m) {
  const p = P(m), r = p.status.runs, news = r.news;
  const done = [r.pre_open, ...r.intraday, r.post_close, r.news].filter(x => x.ok).length, total = 1 + INTRADAY_CHECKS_PER_SESSION + 1 + 1;
  const card = el('section', {class:'card', 'aria-label':'Last runs'});
  card.append(el('div', {class:'head'}, el('h2', {}, 'Runs today'), help('The routines of this market: pre-open (collect, model, strategies, AI traders, picks), two intraday checks, post-close (settlement, end-of-day analysis) and the news run every four hours (the latest one counts here). A tick means the run finished and its gates passed.'), el('div', {class:'end'}, el('span', {class:'mb-label ' + (done === total ? 'success' : 'neutral')}, `${done} of ${total} ok`))));
  const ul = el('ul', {class:'runs'});
  const mark = ok => el('span', {class:'mb-mark ' + (ok == null ? 'na' : ok ? 'ok' : 'no'), 'aria-label': ok == null ? 'not run yet' : ok ? 'ok' : 'failed'}, icon(ok == null ? 'ms-schedule' : ok ? 'ms-check' : 'ms-close'));
  const item = (ok, what, sub, when) => el('li', {}, mark(ok), el('span', {}, what, el('small', {}, sub)), el('span', {class:'t'}, when));
  ul.append(item(r.pre_open.ok, 'Pre-open', 'collect · model · strategies · AI traders · picks', fmtLocal(r.pre_open.at, m)));
  for (let i = 0; i < INTRADAY_CHECKS_PER_SESSION; i++) { const x = r.intraday[i]; ul.append(x ? item(x.ok, `Intraday check ${i + 1}`, 'open trades vs range and target', fmtLocal(x.at, m)) : item(null, `Intraday check ${i + 1}`, 'open trades vs range and target · not yet', '—')); }
  ul.append(item(r.post_close.ok, 'Post-close', r.post_close.at ? 'settlement · end-of-day analysis' : 'settlement · end-of-day analysis · not yet', r.post_close.at ? fmtLocal(r.post_close.at, m) : el('span', {}, el('small', {}, 'next '), fmtLocal(r.post_close.next_at, m))));
  ul.append(item(news.ok, 'News (latest run)', `every 4 hours · ${news.new_items} new items`, fmtLocal(news.at, m)));
  card.append(ul);
  card.append(el('p', {class:'note'}, `Cut-off ${fmtLocal(p.cutoff, m, true)}: every number on this page was stored by then.`));
  return card;
}

/* ---------- page ---------- */
function render() {
  const p = P(market);
  if (horizon == null) horizon = p.default_horizon;
  document.title = `Market brief · Home · ${LABEL[market]}`;
  $('#title').textContent = `Home · ${p.name}`;
  $('#side-foot').innerHTML = ''; $('#side-foot').append(el('b', {}, p.status.paper_label), el('br'), `${LABEL[market]} · data as of ${fmtD(p.as_of, false)}`);
  marketSeg();
  const page = $('#page'); page.innerHTML = '';
  page.append(pageHead(market), band(market), kpis(market));
  const grid = el('div', {class:'grid'});
  grid.append(el('div', {class:'col'}, agreement(market), headToHead(market)), el('div', {class:'col'}, ruleVsAi(market), alerts(market), newsCard(market), runs(market)));
  page.append(grid, el('div', {style:'margin-top:16px'}, openTrades(market)), legend());
  for (const n of page.querySelectorAll('[data-tip]')) if (!n.matches('a[href], button, input, [tabindex]')) n.setAttribute('tabindex', '0');
  page.append(el('footer', {}, `Personal research project. Example data from the data catalogue; nothing here is investment advice and nothing trades. as_of ${p.as_of} · cutoff ${p.cutoff} · built_at ${p.built_at} · `, el('code', {}, D.endpoint.replace('{market}', market))));
}
render();
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h in D.markets && h !== market) { market = h; horizon = null; render(); } });
