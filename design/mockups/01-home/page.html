<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market brief · Home</title>
<meta name="description" content="Home of the personal stock cockpit, per market: companies ranked by how many strategies would buy them at the chosen horizon, today's head-to-head paper trades, rule vs AI, open paper trades, alerts, the news that can carry a call and the last runs. Research only, every signal Paper.">
<style>
/* market-brief cockpit: design tokens. ONE light scheme, "terminal light", modelled on the trading
   terminals the owner pointed at (Meridian Terminal, TradingView symbol pages): a cool light-grey page,
   white cards with hairline borders, one indigo accent, vivid green/red for signed numbers and signals,
   uppercase micro-labels over large bold numerals. Token names keep the Material role vocabulary
   (--md-sys-color-*) so components.css and the pages need no renaming.
   Verdict rule (owner): NO is red; YES is green, darker green for a strong signal, lighter green for an
   okay one. Up/down/hit/miss always carry a glyph and a word (dataviz checker: up #15803d vs down #dc2626
   pass all gates, worst CVD dE 8.6). Contrast figures are WCAG on the colour named.
   Self-contained: no @import, no font files, system font stack. */
:root {
  color-scheme: light;

  /* ---- Colour roles (terminal light) ---------------------------------------------------- */
  --md-sys-color-primary: #4f46e5;                 /* indigo accent (6.3:1 on white) */
  --md-sys-color-on-primary: #ffffff;
  --md-sys-color-primary-container: #eef2ff;       /* accent tint: selected nav, selected segment */
  --md-sys-color-on-primary-container: #3730a3;    /* 8.9:1 on the tint */
  --md-sys-color-secondary: #475569;
  --md-sys-color-on-secondary: #ffffff;
  --md-sys-color-secondary-container: #f1f5f9;
  --md-sys-color-on-secondary-container: #1e293b;
  --md-sys-color-tertiary: #7c3aed;
  --md-sys-color-on-tertiary: #ffffff;
  --md-sys-color-tertiary-container: #f3e8ff;      /* Paper tag */
  --md-sys-color-on-tertiary-container: #5b21b6;
  --md-sys-color-error: #dc2626;
  --md-sys-color-on-error: #ffffff;
  --md-sys-color-error-container: #fee2e2;
  --md-sys-color-on-error-container: #991b1b;
  --md-sys-color-surface: #ffffff;
  --md-sys-color-on-surface: #111827;              /* ink, 16.4:1 on the page */
  --md-sys-color-surface-variant: #f1f5f9;
  --md-sys-color-on-surface-variant: #6b7280;      /* muted labels, 4.8:1 on white */
  --md-sys-color-surface-dim: #e5e7eb;
  --md-sys-color-surface-bright: #ffffff;
  --md-sys-color-surface-container-lowest: #ffffff; /* cards */
  --md-sys-color-surface-container-low: #f5f6fa;    /* the page */
  --md-sys-color-surface-container: #f3f4f6;        /* tiles and columns inside a card */
  --md-sys-color-surface-container-high: #eceef2;   /* hairlines inside cards, table rules */
  --md-sys-color-surface-container-highest: #e5e7eb;
  --md-sys-color-outline: #9ca3af;
  --md-sys-color-outline-variant: #e5e7eb;          /* card and control borders */
  --md-sys-color-inverse-surface: #111827;          /* tooltips */
  --md-sys-color-inverse-on-surface: #f9fafb;
  --md-sys-color-inverse-primary: #a5b4fc;
  --md-sys-color-surface-tint: #4f46e5;
  --md-sys-color-background: #f5f6fa;
  --md-sys-color-on-background: #111827;
  --md-sys-color-scrim: #000000;
  --md-sys-color-shadow: #000000;

  /* ---- Semantic tokens (finance) --------------------------------------------------------
     up/hit = green, down/miss = red; text tones 5.0:1 / 4.8:1 on white, white on the fills 5.0:1 / 4.8:1.
     Verdict surfaces: NO red; YES strong = darker green, YES ok = lighter green (owner's rule). */
  --mb-color-up: #15803d;
  --mb-color-on-up: #ffffff;
  --mb-color-up-container: #dcfce7;
  --mb-color-on-up-container: #166534;    /* 6.5:1 */
  --mb-color-down: #dc2626;
  --mb-color-on-down: #ffffff;
  --mb-color-down-container: #fee2e2;
  --mb-color-on-down-container: #991b1b;  /* 6.8:1 */
  --mb-color-neutral: #6b7280;
  --mb-color-on-neutral: #ffffff;
  --mb-color-neutral-container: #f3f4f6;
  --mb-color-on-neutral-container: #374151;
  --mb-color-warn: #d97706;               /* "direction unclear" (icons) */
  --mb-color-on-warn: #ffffff;
  --mb-color-warn-container: #fef3c7;
  --mb-color-on-warn-container: #b45309;  /* 4.5:1 */
  --mb-color-hit: var(--mb-color-up);
  --mb-color-hit-container: var(--mb-color-up-container);
  --mb-color-on-hit-container: var(--mb-color-on-up-container);
  --mb-color-miss: var(--mb-color-down);
  --mb-color-miss-container: var(--mb-color-down-container);
  --mb-color-on-miss-container: var(--mb-color-on-down-container);
  /* Verdict (decision header) */
  --mb-verdict-no-bg: #fee2e2;        --mb-verdict-no-box: #dc2626;    --mb-verdict-no-ink: #991b1b;   /* 6.8:1 */
  --mb-verdict-strong-bg: #bbf7d0;    --mb-verdict-strong-box: #166534; --mb-verdict-strong-ink: #14532d; /* 7.5:1 */
  --mb-verdict-ok-bg: #dcfce7;        --mb-verdict-ok-box: #15803d;    --mb-verdict-ok-ink: #166534;  /* 6.5:1 */
  /* Provenance labels: Live (green tint, like a terminal's LIVE badge), Back-test (hatched accent tint),
     Mock (dashed), Paper (violet tint). Each has a texture or border style besides its colour. */
  --mb-color-live: var(--mb-color-up);
  --mb-color-live-container: var(--mb-color-up-container);
  --mb-color-on-live-container: var(--mb-color-on-up-container);
  --mb-color-backtest: var(--md-sys-color-primary);
  --mb-color-backtest-container: repeating-linear-gradient(135deg, rgba(79,70,229,.14) 0 3px, transparent 3px 6px);
  --mb-color-on-backtest-container: var(--md-sys-color-on-primary-container);
  --mb-color-mock: var(--md-sys-color-outline);
  --mb-color-on-mock-container: var(--md-sys-color-on-surface-variant);
  --mb-color-paper: var(--md-sys-color-tertiary);
  --mb-color-paper-container: var(--md-sys-color-tertiary-container);
  --mb-color-on-paper-container: var(--md-sys-color-on-tertiary-container);

  /* ---- Chart tokens (dataviz skill: validated with scripts/validate_palette.js, see README) ---- */
  --mb-chart-surface: var(--md-sys-color-surface-container-lowest);
  --mb-chart-1: #4f46e5;   /* series 1 = the accent: ranges, model, everything "ours" */
  --mb-chart-2: #d97706;   /* series 2 (amber; 3.0:1 on white: direct labels or the table view) */
  --mb-chart-3: #0891b2;   /* series 3 (cyan) */
  --mb-chart-4: #db2777;   /* series 4 (pink) */
  --mb-chart-band-50: rgba(79,70,229,.32);   /* inner band, series 1 */
  --mb-chart-band-80: rgba(79,70,229,.13);   /* outer band */
  --mb-chart-fan: rgba(79,70,229,.10);
  --mb-chart-ink: var(--md-sys-color-on-surface);           /* the actual line */
  --mb-chart-grid: var(--md-sys-color-surface-container);
  --mb-chart-axis: var(--md-sys-color-outline-variant);
  --mb-chart-label: var(--md-sys-color-on-surface-variant);
  --mb-chart-future: var(--md-sys-color-surface-container-low);

  /* ---- Typography: M3 type scale on the system sans ------------------------------------ */
  --md-ref-typeface-plain: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --md-ref-typeface-brand: var(--md-ref-typeface-plain);
  --md-ref-typeface-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --md-sys-typescale-display-large: 400 57px/64px var(--md-ref-typeface-brand);
  --md-sys-typescale-display-medium: 400 45px/52px var(--md-ref-typeface-brand);
  --md-sys-typescale-display-small: 400 36px/44px var(--md-ref-typeface-brand);
  --md-sys-typescale-headline-large: 400 32px/40px var(--md-ref-typeface-brand);
  --md-sys-typescale-headline-medium: 400 28px/36px var(--md-ref-typeface-brand);
  --md-sys-typescale-headline-small: 400 24px/32px var(--md-ref-typeface-brand);
  --md-sys-typescale-title-large: 400 22px/28px var(--md-ref-typeface-brand);
  --md-sys-typescale-title-medium: 500 16px/24px var(--md-ref-typeface-plain);
  --md-sys-typescale-title-small: 500 14px/20px var(--md-ref-typeface-plain);
  --md-sys-typescale-body-large: 400 16px/24px var(--md-ref-typeface-plain);
  --md-sys-typescale-body-medium: 400 14px/20px var(--md-ref-typeface-plain);
  --md-sys-typescale-body-small: 400 12px/16px var(--md-ref-typeface-plain);
  --md-sys-typescale-label-large: 500 14px/20px var(--md-ref-typeface-plain);
  --md-sys-typescale-label-medium: 500 12px/16px var(--md-ref-typeface-plain);
  --md-sys-typescale-label-small: 500 11px/16px var(--md-ref-typeface-plain);
  --md-sys-typescale-label-large-tracking: 0.1px;
  --md-sys-typescale-label-medium-tracking: 0.5px;
  --md-sys-typescale-label-small-tracking: 0.5px;
  --md-sys-typescale-title-medium-tracking: 0.15px;
  --md-sys-typescale-body-medium-tracking: 0.25px;
  --md-sys-typescale-body-small-tracking: 0.4px;

  /* ---- Shape ---------------------------------------------------------------------------- */
  --md-sys-shape-corner-none: 0;
  --md-sys-shape-corner-extra-small: 4px;
  --md-sys-shape-corner-small: 8px;
  --md-sys-shape-corner-medium: 12px;
  --md-sys-shape-corner-large: 16px;
  --md-sys-shape-corner-extra-large: 28px;
  --md-sys-shape-corner-full: 9999px;
  --mb-card-radius: 12px;        /* cards */
  --mb-panel-radius: 8px;        /* tiles and columns inside a card */
  --mb-card-border: 1px solid var(--md-sys-color-outline-variant);

  /* ---- Elevation (M3 light shadows, levels 0-5) ----------------------------------------- */
  --md-sys-elevation-0: none;
  --md-sys-elevation-1: 0 1px 2px rgba(0,0,0,.30), 0 1px 3px 1px rgba(0,0,0,.15);
  --md-sys-elevation-2: 0 1px 2px rgba(0,0,0,.30), 0 2px 6px 2px rgba(0,0,0,.15);
  --md-sys-elevation-3: 0 1px 3px rgba(0,0,0,.30), 0 4px 8px 3px rgba(0,0,0,.15);
  --md-sys-elevation-4: 0 2px 3px rgba(0,0,0,.30), 0 6px 10px 4px rgba(0,0,0,.15);
  --md-sys-elevation-5: 0 4px 4px rgba(0,0,0,.30), 0 8px 12px 6px rgba(0,0,0,.15);

  /* ---- State layers --------------------------------------------------------------------- */
  --md-sys-state-hover-opacity: .08;
  --md-sys-state-focus-opacity: .10;
  --md-sys-state-pressed-opacity: .10;
  --md-sys-state-dragged-opacity: .16;
  --md-sys-state-disabled-opacity: .38;
  --md-sys-state-disabled-container-opacity: .12;

  /* ---- Spacing (4px grid) and layout ---------------------------------------------------- */
  --mb-space-1: 4px; --mb-space-2: 8px; --mb-space-3: 12px; --mb-space-4: 16px; --mb-space-5: 20px;
  --mb-space-6: 24px; --mb-space-8: 32px; --mb-space-10: 40px; --mb-space-12: 48px;
  --mb-gutter: 16px;            /* phone side gutter (never less) */
  --mb-gutter-desktop: 24px;
  --mb-content-max: 1120px;
  --mb-rail-width: 72px;        /* navigation rail (>= 600px) */
  --mb-navbar-height: 80px;     /* navigation bar (phone) */
  --mb-topbar-height: 56px;

  /* ---- Motion --------------------------------------------------------------------------- */
  --md-sys-motion-duration-short: 100ms;
  --md-sys-motion-duration-medium: 250ms;
  --md-sys-motion-easing-standard: cubic-bezier(.2, 0, 0, 1);

  /* ---- Focus ring ----------------------------------------------------------------------- */
  --mb-focus-ring: 0 0 0 2px var(--md-sys-color-surface), 0 0 0 4px var(--md-sys-color-primary);
}

/* Type role utility classes (apply to any element) */
.md-display-large { font: var(--md-sys-typescale-display-large); letter-spacing: -0.25px; }
.md-display-medium { font: var(--md-sys-typescale-display-medium); }
.md-display-small { font: var(--md-sys-typescale-display-small); }
.md-headline-large { font: var(--md-sys-typescale-headline-large); }
.md-headline-medium { font: var(--md-sys-typescale-headline-medium); }
.md-headline-small { font: var(--md-sys-typescale-headline-small); }
.md-title-large { font: var(--md-sys-typescale-title-large); }
.md-title-medium { font: var(--md-sys-typescale-title-medium); letter-spacing: var(--md-sys-typescale-title-medium-tracking); }
.md-title-small { font: var(--md-sys-typescale-title-small); letter-spacing: 0.1px; }
.md-body-large { font: var(--md-sys-typescale-body-large); letter-spacing: 0.5px; }
.md-body-medium { font: var(--md-sys-typescale-body-medium); letter-spacing: var(--md-sys-typescale-body-medium-tracking); }
.md-body-small { font: var(--md-sys-typescale-body-small); letter-spacing: var(--md-sys-typescale-body-small-tracking); }
.md-label-large { font: var(--md-sys-typescale-label-large); letter-spacing: var(--md-sys-typescale-label-large-tracking); }
.md-label-medium { font: var(--md-sys-typescale-label-medium); letter-spacing: var(--md-sys-typescale-label-medium-tracking); }
.md-label-small { font: var(--md-sys-typescale-label-small); letter-spacing: var(--md-sys-typescale-label-small-tracking); }
.md-numeric { font-variant-numeric: tabular-nums; }
.md-micro { font: 500 11px/16px var(--md-ref-typeface-plain); letter-spacing: .06em; text-transform: uppercase; color: var(--md-sys-color-on-surface-variant); }

/* market-brief cockpit: Material 3 components on tokens.css. Plain CSS, no JS required (the
   tooltip needs the page's own small script, see README). Prefix: md- for M3 components,
   mb- for the cockpit's own (app shell, provenance tags, odds meter). Load after tokens.css. */

/* ---- Base ----------------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--md-sys-color-surface-container-low); color: var(--md-sys-color-on-surface); -webkit-text-size-adjust: 100%; }
body { font: var(--md-sys-typescale-body-medium); letter-spacing: var(--md-sys-typescale-body-medium-tracking); font-family: var(--md-ref-typeface-plain); }
a { color: var(--md-sys-color-primary); }
button { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: none; box-shadow: var(--mb-focus-ring); border-radius: var(--md-sys-shape-corner-extra-small); }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- Icons (Material Symbols Outlined, inlined from icons.svg) ------------------------- */
.ms { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; fill: currentColor; flex: none; }
.ms-20 { width: 20px; height: 20px; } .ms-24 { width: 24px; height: 24px; } .ms-40 { width: 40px; height: 40px; }

/* ---- App shell: rail (>= 600px) / navigation bar (phone), top app bar ----------------- */
.mb-app { min-height: 100vh; display: grid; grid-template-columns: var(--mb-rail-width) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
.mb-rail { grid-row: 1 / span 2; background: var(--md-sys-color-surface); border-right: var(--mb-card-border); display: flex; flex-direction: column; align-items: center; gap: var(--mb-space-3); padding: var(--mb-space-3) 0; position: sticky; top: 0; height: 100vh; }
.mb-rail .mb-rail-brand { width: 40px; height: 40px; border-radius: var(--md-sys-shape-corner-small); background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); display: grid; place-items: center; font: var(--md-sys-typescale-label-large); margin-bottom: var(--mb-space-2); }
.mb-nav-item { display: flex; flex-direction: column; align-items: center; gap: var(--mb-space-1); width: 72px; padding: 0; border: 0; background: none; color: var(--md-sys-color-on-surface-variant); text-decoration: none; cursor: pointer; font: var(--md-sys-typescale-label-medium); letter-spacing: var(--md-sys-typescale-label-medium-tracking); }
.mb-nav-item .mb-nav-ind { width: 40px; height: 40px; border-radius: var(--md-sys-shape-corner-small); display: grid; place-items: center; position: relative; transition: background var(--md-sys-motion-duration-short); }
.mb-nav-item .ms { width: 22px; height: 22px; }
.mb-nav-item:hover .mb-nav-ind { background: color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent); }
.mb-nav-item[aria-current="page"] { color: var(--md-sys-color-on-surface); }
.mb-nav-item[aria-current="page"] .mb-nav-ind { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-primary); }
.mb-nav-item.coming { color: color-mix(in srgb, var(--md-sys-color-on-surface-variant) 55%, transparent); cursor: help; }
.mb-nav-item.coming .mb-nav-ind::after { content: "soon"; position: absolute; top: -4px; right: -2px; font: var(--md-sys-typescale-label-small); letter-spacing: 0; padding: 0 5px; border-radius: var(--md-sys-shape-corner-full); background: var(--md-sys-color-surface-container-highest); color: var(--md-sys-color-on-surface-variant); }
.mb-navbar { display: none; }
.mb-topbar { grid-column: 2; position: sticky; top: 0; z-index: 20; height: var(--mb-topbar-height); background: var(--md-sys-color-surface); border-bottom: var(--mb-card-border); display: flex; align-items: center; gap: var(--mb-space-3); padding: 0 var(--mb-gutter-desktop); }
.mb-topbar.scrolled { box-shadow: 0 1px 0 var(--md-sys-color-outline-variant); }
.mb-topbar .mb-topbar-title { font: var(--md-sys-typescale-title-medium); font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mb-topbar .mb-topbar-actions { margin-left: auto; display: flex; align-items: center; gap: var(--mb-space-2); }
.mb-content { grid-column: 2; min-width: 0; padding: 0 var(--mb-gutter-desktop) var(--mb-space-12); }
.mb-content-inner { max-width: var(--mb-content-max); margin: 0 auto; }
@media (max-width: 599px) {
  .mb-app { grid-template-columns: minmax(0, 1fr); }
  .mb-rail { display: none; }
  .mb-topbar, .mb-content { grid-column: 1; }
  .mb-topbar { padding: 0 var(--mb-gutter); }
  .mb-content { padding: 0 var(--mb-gutter) calc(var(--mb-navbar-height) + var(--mb-space-6)); }
  .mb-navbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: var(--mb-navbar-height); background: var(--md-sys-color-surface); border-top: var(--mb-card-border); justify-content: space-around; align-items: center; padding: 0 var(--mb-space-2); }
  .mb-navbar .mb-nav-item { width: auto; flex: 1 1 0; min-width: 0; overflow: hidden; }
  .mb-navbar { overflow: hidden; }
  .mb-navbar .mb-nav-item .mb-nav-ind { width: 64px; }
}

/* ---- Cards ---------------------------------------------------------------------------- */
.md-card { border-radius: var(--mb-card-radius); padding: var(--mb-space-4) var(--mb-space-5); background: var(--md-sys-color-surface-container-lowest); border: var(--mb-card-border); color: var(--md-sys-color-on-surface); }
.md-card.elevated { box-shadow: var(--md-sys-elevation-1); }
.md-card.filled { background: var(--md-sys-color-surface-container-high); }
.md-card.outlined { background: var(--md-sys-color-surface-container-low); }
.md-card > h2:first-child, .md-card > h3:first-child { margin-top: 0; }

/* ---- Buttons -------------------------------------------------------------------------- */
.md-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--mb-space-2); height: 34px; padding: 0 var(--mb-space-4); border-radius: var(--md-sys-shape-corner-small); border: 0; cursor: pointer; font: var(--md-sys-typescale-label-large); letter-spacing: var(--md-sys-typescale-label-large-tracking); text-decoration: none; white-space: nowrap; position: relative; background: transparent; color: var(--md-sys-color-primary); }
.md-btn .ms { width: 18px; height: 18px; margin-left: -8px; }
.md-btn::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0; transition: opacity var(--md-sys-motion-duration-short); }
.md-btn:hover::before { opacity: var(--md-sys-state-hover-opacity); }
.md-btn:active::before { opacity: var(--md-sys-state-pressed-opacity); }
.md-btn.filled { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
.md-btn.tonal { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
.md-btn.outlined { border: var(--mb-card-border); color: var(--md-sys-color-on-surface); background: var(--md-sys-color-surface); }
.md-btn.text { padding: 0 var(--mb-space-3); }
.md-btn:disabled, .md-btn[aria-disabled="true"] { cursor: not-allowed; color: color-mix(in srgb, var(--md-sys-color-on-surface) 38%, transparent); background: color-mix(in srgb, var(--md-sys-color-on-surface) 12%, transparent); border-color: transparent; }
.md-btn.text:disabled { background: transparent; }
.md-icon-btn { width: 40px; height: 40px; border-radius: var(--md-sys-shape-corner-full); border: 0; background: transparent; color: var(--md-sys-color-on-surface-variant); display: inline-grid; place-items: center; cursor: pointer; position: relative; padding: 0; }
.md-icon-btn .ms { width: 24px; height: 24px; }
.md-icon-btn::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0; }
.md-icon-btn:hover::before { opacity: var(--md-sys-state-hover-opacity); }
.md-icon-btn.small { width: 24px; height: 24px; } .md-icon-btn.small .ms { width: 18px; height: 18px; }
.md-icon-btn.outlined { border: 1px solid var(--md-sys-color-outline); }
.md-icon-btn.tonal { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }

/* Help affordance: a small outlined icon button that opens a tooltip (hover, focus or tap) */
.md-help { appearance: none; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--md-sys-color-outline-variant); background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface-variant); font: var(--md-sys-typescale-label-small); letter-spacing: 0; display: inline-grid; place-items: center; cursor: help; padding: 0; vertical-align: middle; margin-left: 4px; line-height: 1; }
.md-help:hover, .md-help:focus-visible { border-color: var(--md-sys-color-primary); color: var(--md-sys-color-primary); }

/* ---- Segmented buttons ---------------------------------------------------------------- */

.banner .ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--md-sys-color-surface-container);color:var(--md-sys-color-on-surface-variant)}
.banner .ico .ms{width:24px;height:24px}
.banner b.t{font-size:15px;display:block}
.banner .s{font-size:12.5px;color:var(--md-sys-color-on-surface-variant);margin-top:2px}

/* horizon selector */
.hsel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.hsel .lab{font-size:12.5px;color:var(--md-sys-color-on-surface-variant)}
.hsel .md-segmented > button{min-width:52px;justify-content:center}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;margin-top:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}

/* agreement */
.agl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.agl li{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:10px 12px;border:var(--mb-card-border);border-radius:var(--mb-panel-radius);background:var(--md-sys-color-surface);min-width:0}
.agl li.top{border-color:var(--md-sys-color-primary);box-shadow:inset 3px 0 0 var(--md-sys-color-primary)}
.agl .rk{font-size:17px;font-weight:800;color:var(--md-sys-color-primary);width:18px;text-align:center}
.agl .who{min-width:0}
.agl .who .nm{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.agl .who .nm small{font-weight:500;color:var(--md-sys-color-on-surface-variant);font-size:12px}
.agl .who .sent{font-size:12.5px;margin-top:1px} .agl .who .sent b{font-weight:700}
.agl .bar{height:6px;border-radius:3px;background:var(--md-sys-color-surface-container-highest);margin-top:6px;overflow:hidden;display:flex}
.agl .bar i{display:block;height:100%} .agl .bar i.r{background:var(--md-sys-color-primary)} .agl .bar i.b{background:var(--mb-chart-2)} .agl .bar i.a{background:var(--mb-chart-3)}
.agl .fam{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px;font-size:11px;color:var(--md-sys-color-on-surface-variant)}
.agl .fam b{color:var(--md-sys-color-on-surface);font-weight:600} .agl .fam .sw{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:3px;vertical-align:0}
.agl .fam .sw.r{background:var(--md-sys-color-primary)} .agl .fam .sw.b{background:var(--mb-chart-2)} .agl .fam .sw.a{background:var(--mb-chart-3)}
.agl .hz{text-align:center} .agl .hz svg{width:88px;height:38px;display:block} .agl .hz small{display:block;font-size:10px;color:var(--md-sys-color-on-surface-variant);margin-top:1px}
.agl .hz rect.on{fill:var(--md-sys-color-primary)} .agl .hz rect.off{fill:var(--md-sys-color-surface-container-highest)} .agl .hz text{font-size:9px;fill:var(--md-sys-color-on-surface-variant)} .agl .hz text.on{fill:var(--md-sys-color-primary);font-weight:700}
.agl .right{text-align:right;min-width:0}
.agl .right .l{font-size:10.5px;color:var(--md-sys-color-on-surface-variant);margin-top:2px;white-space:nowrap}

/* head-to-head */
.h2h{display:grid;gap:10px}
.cmp{border:var(--mb-card-border);border-radius:var(--mb-panel-radius);background:var(--md-sys-color-surface);padding:10px 12px;min-width:0}
.cmp .ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.cmp .ch .nm{font-weight:700;font-size:14px}
.cmp .ch .amt{margin-left:auto;color:var(--md-sys-color-on-surface-variant);font-size:12px}
.fams{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.fam-box{border:1px solid var(--md-sys-color-surface-container-highest);border-radius:6px;padding:8px 10px;background:var(--md-sys-color-surface-container-lowest);min-width:0}
.fam-box .fh{display:flex;align-items:center;gap:6px;font-size:11.5px;margin-bottom:6px}
.fam-box .fh .ms{width:15px;height:15px;color:var(--md-sys-color-primary)}
.fam-box .fh b{font-weight:700;font-size:12px}
.fam-box .fh small{color:var(--md-sys-color-on-surface-variant);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;padding:6px 0;border-top:1px solid var(--md-sys-color-surface-container-high);font-size:12.5px}
.pk .rule{font-size:11px;color:var(--md-sys-color-on-surface-variant);grid-column:1 / span 3}
.pk .det{grid-column:1 / span 3;font-size:11.5px;color:var(--md-sys-color-on-surface-variant)}
.pk .gain{font-weight:600;text-align:right;white-space:nowrap;grid-column:3;grid-row:2 / span 2}
.pk .viab{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600} .pk .viab .ms{width:13px;height:13px}
.pk .viab.yes{color:var(--mb-color-up)} .pk .viab.no{color:var(--mb-color-down)}
.cand{margin-top:6px;font-size:12px} .cand summary{cursor:pointer;color:var(--md-sys-color-primary);font-weight:600;font-size:12px}
.cand table{margin-top:6px} .cand td,.cand th{padding:4px 6px;font-size:12px}
.sumline{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:8px 10px;border-radius:var(--mb-panel-radius);background:var(--md-sys-color-surface-container);margin-bottom:10px}
.sumline .ms{width:16px;height:16px;flex:none}

/* rule vs AI */
.rva{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:var(--mb-card-border);border-radius:var(--mb-panel-radius);padding:8px 10px;background:var(--md-sys-color-surface);min-width:0}
.tile .l{font-size:10.5px;color:var(--md-sys-color-on-surface-variant);letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.tile .v{font-size:18px;font-weight:700;line-height:1.15;margin-top:2px;overflow-wrap:anywhere;letter-spacing:-.3px}
.tile .s{font-size:11px;color:var(--md-sys-color-on-surface-variant);margin-top:2px}
.tile.lead{border-color:var(--md-sys-color-primary);background:var(--md-sys-color-primary-container)}
.h3{margin:12px 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap} .h3:first-child{margin-top:0}
.grid22{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px;font-size:12.5px;align-items:stretch}
.grid22 .hd{font-size:10.5px;color:var(--md-sys-color-on-surface-variant);letter-spacing:.06em;text-transform:uppercase;font-weight:500;padding:4px 6px;align-self:end}
.grid22 .rh{font-weight:600;padding:8px 6px;display:flex;align-items:center;gap:6px} .grid22 .rh .ms{width:15px;height:15px;color:var(--md-sys-color-primary)}
.grid22 .cell{border:var(--mb-card-border);border-radius:6px;padding:6px 8px;background:var(--md-sys-color-surface);min-width:0}
.grid22 .cell .v{font-weight:700;font-size:14px} .grid22 .cell .s{font-size:11px;color:var(--md-sys-color-on-surface-variant)}
.grid22 .cell.none{border-style:dashed;color:var(--md-sys-color-on-surface-variant);font-size:12px}
.badge-few{font:500 10.5px/14px var(--md-ref-typeface-plain);border:1px solid var(--md-sys-color-outline-variant);border-radius:4px;padding:0 4px;color:var(--md-sys-color-on-surface-variant);white-space:nowrap}

/* news card */
.nl{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.nl li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;padding:7px 0;border-top:1px solid var(--md-sys-color-surface-container-high);font-size:12.5px;min-width:0}
.nl li:first-child{border-top:0}
.nl .mb-dir{margin-top:1px}
.nl .hd{min-width:0;overflow-wrap:anywhere} .nl .hd a.t{color:inherit;text-decoration:none;font-weight:600} .nl .hd a.t:hover{text-decoration:underline}
.nl .hd small{display:block;color:var(--md-sys-color-on-surface-variant);font-size:11px;margin-top:2px}
.nl .hd .md-badge{margin-left:4px;vertical-align:1px}
.aside{font-size:12.5px;margin:6px 0 0} .aside summary{cursor:pointer;color:var(--md-sys-color-primary);font-weight:600;font-size:12px}

/* open trades */
.ot{width:100%;border-collapse:collapse;font-size:12.5px}
.ot th{font:500 10.5px/14px var(--md-ref-typeface-plain);letter-spacing:.06em;text-transform:uppercase;color:var(--md-sys-color-on-surface-variant);text-align:left;padding:6px 6px;border-bottom:1px solid var(--md-sys-color-outline-variant);white-space:nowrap}
.ot td{padding:6px 6px;border-bottom:1px solid var(--md-sys-color-surface-container-high);vertical-align:middle}
.ot td:first-child{white-space:nowrap}
.ot td.num,.ot th.num{text-align:right;white-space:nowrap}
.ot tr.grp td{background:var(--md-sys-color-surface-container);font-weight:700;padding:6px;font-size:12px}
.ot tr.grp td small{font-weight:500;color:var(--md-sys-color-on-surface-variant);margin-left:8px}
.ot .st{display:inline-flex;align-items:center;gap:4px;white-space:nowrap} .ot .st .ms{width:14px;height:14px}
.ot .st.flag{color:var(--mb-color-on-warn-container);font-weight:600} .ot .st.ok{color:var(--mb-color-up)}
.ot .v2{display:none}
.rng{display:inline-flex;align-items:center;gap:6px} .rng svg{width:96px;height:18px;display:block} .rng small{color:var(--md-sys-color-on-surface-variant);font-size:10.5px;white-space:nowrap}
.vtag{font:600 9.5px/1 var(--md-ref-typeface-plain);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--md-sys-color-outline-variant);border-radius:4px;padding:2px 4px;color:var(--md-sys-color-on-surface-variant);margin-left:4px;vertical-align:middle}

/* alerts */
.al{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.al li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--mb-color-warn);border-radius:var(--mb-panel-radius);background:var(--mb-color-warn-container);color:var(--mb-color-on-warn-container);font-size:12.5px;min-width:0}
.al li .ms{width:18px;height:18px;margin-top:1px} .al li b{color:var(--md-sys-color-on-surface)}
.al li .d{color:var(--md-sys-color-on-surface);margin-top:2px} .al li small{display:block;margin-top:2px;font-size:11.5px}

/* runs */
.runs{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.runs li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border:var(--mb-card-border);border-radius:var(--mb-panel-radius);background:var(--md-sys-color-surface);font-size:12.5px}
.runs li .mb-mark{width:18px;height:18px} .runs li .mb-mark .ms{width:12px;height:12px}
.runs li small{display:block;font-size:11px;color:var(--md-sys-color-on-surface-variant)}
.runs li .t{text-align:right;font-weight:600;white-space:nowrap} .runs li .t small{font-weight:500}

/* legend, footer, phone sheet */
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--md-sys-color-on-surface-variant);margin-top:16px;align-items:center}
footer{color:var(--md-sys-color-on-surface-variant);font-size:12px;text-align:center;padding:24px 0 8px} footer code{font-family:var(--md-ref-typeface-mono)}
.more{position:fixed;left:0;right:0;bottom:var(--mb-navbar-height);z-index:19;background:var(--md-sys-color-surface);border-top:var(--mb-card-border);padding:8px 16px 12px;display:none;grid-template-columns:1fr 1fr;gap:6px}
.more.on{display:grid}
.more a{display:flex;align-items:center;gap:8px;padding:8px 10px;border:var(--mb-card-border);border-radius:var(--mb-panel-radius);color:inherit;text-decoration:none;font-size:13px}
.more a .ms{width:18px;height:18px;color:var(--md-sys-color-primary)}

@media (max-width: 1000px){ .grid{grid-template-columns:1fr} .strip{grid-template-columns:repeat(3,1fr)} .strip > div:nth-child(3n+1){border-left:0} .strip > div:nth-child(n+4){border-top:1px solid var(--md-sys-color-outline-variant)} }
@media (max-width: 760px){
  .pad{padding:0 var(--mb-gutter)}
  .hhead{grid-template-columns:1fr} .hhead .right{text-align:left}
  .strip{grid-template-columns:repeat(2,1fr)} .strip > div{border-left:1px solid var(--md-sys-color-outline-variant)} .strip > div:nth-child(odd){border-left:0} .strip > div:nth-child(n+3){border-top:1px solid var(--md-sys-color-outline-variant)}
  .banner{grid-template-columns:auto 1fr} .banner .act{grid-column:1 / span 2}
  .fams{grid-template-columns:1fr}
  .ot th.v1,.ot td.v1,.ot span.v1{display:none} .ot small.v1{display:none} .ot .v2{display:table-cell} .ot td:first-child{white-space:normal} .ot .st{white-space:normal;align-items:start} .ot tr.grp td small{display:block;margin-left:0}
  .agl li{grid-template-columns:auto auto minmax(0,1fr) auto} .agl .hz{grid-column:2 / span 3;text-align:left} .agl .hz svg{width:96px}
  .mb-topbar .ask span,.mb-topbar .md-chip{display:none}
  .tape .it{padding:0 12px}
}
</style>

/* ---------- tooltip (hover, focus, tap; Escape closes) ---------- */
const tip = $('#tip'); let tipPinned = null;
function showTip(target, html) { tip.innerHTML = html; tip.classList.add('on'); const r = target.getBoundingClientRect(); let left = r.left + r.width/2 - tip.offsetWidth/2, top = r.top - tip.offsetHeight - 10; left = Math.max(8, Math.min(window.innerWidth - tip.offsetWidth - 8, left)); if (top < 8) top = r.bottom + 12; tip.style.left = left + 'px'; tip.style.top = top + 'px'; }
function hideTip() { if (tipPinned) return; tip.classList.remove('on'); }
document.addEventListener('pointerover', e => { const t = e.target.closest('[data-tip]'); if (t && !tipPinned) showTip(t, t.dataset.tip); });
document.addEventListener('pointerout', e => { if (e.target.closest('[data-tip]')) hideTip(); });
document.addEventListener('focusin', e => { const t = e.target.closest('[data-tip]'); if (t) showTip(t, t.dataset.tip); });
document.addEventListener('focusout', e => { if (e.target.closest('[data-tip]')) { tipPinned = null; hideTip(); } });
document.addEventListener('click', e => { const t = e.target.closest('[data-tip]'); if (t && t.tagName !== 'A' && !t.classList.contains('md-btn') && t.closest('.md-segmented') == null) { if (tipPinned === t) { tipPinned = null; hideTip(); } else { tipPinned = t; showTip(t, t.dataset.tip); } e.preventDefault(); } else if (tipPinned) { tipPinned = null; hideTip(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { tipPinned = null; hideTip(); } });

  card.append(el('h2', {}, 'Rule vs AI', help('Who is better: profit after costs on the same companies and amounts (decision 8). Last close: the post-close run’s end-of-day analysis per family and per pick rule. To date: the head-to-head scoreboard, family × pick rule, every horizon pooled.'), el('span', {class:'sp'}), el('a', {class:'go', href:'../06-rule-vs-ai/page.html'}, 'Compare', icon('ms-chevron_right'))));

    for (const [f, x] of fams) t.append(el('div', {class:'tile' + (x.trades > 0 && x.net_pnl === best ? ' lead' : ''), 'data-tip': `${FAMILY[f][0]}, accuracy view: ${x.trades} trades settled on ${fmtD(e.session_date)}, ${x.wins} with a profit after costs.${x.trades > 0 && x.net_pnl === best ? ' Led the day.' : ''}`}, el('div', {class:'l'}, FAMILY[f][0]), el('div', {class:'v'}, x.trades ? moneyDelta(cur, x.net_pnl) : el('span', {class:'muted'}, 'no trades')), el('div', {class:'s'}, x.trades ? `${x.wins} of ${x.trades} won${x.trades > 0 && x.net_pnl === best ? ' · led' : ''}` : 'none settled')));
    card.append(t);
    const pr = el('div', {class:'rva', style:'margin-top:8px;grid-template-columns:1fr 1fr'});
    for (const r of ['best_expected_gain','highest_probability']) { const x = e.results[r]; pr.append(el('div', {class:'tile'}, el('div', {class:'l'}, PICK[r] + ' picks'), el('div', {class:'v'}, x.trades ? moneyDelta(cur, x.net_pnl) : el('span', {class:'muted'}, 'no trades')), el('div', {class:'s'}, `${x.trades} head-to-head trade${x.trades === 1 ? '' : 's'}`))); }
    card.append(pr);
    card.append(el('p', {class:'note', style:'margin-top:8px'}, el('span', {class:'micro'}, 'EOD analyst · '), e.summary, ' ', el('a', {href:'../06-rule-vs-ai/page.html', 'data-tip': `Cites ${e.cited_ids.length} trade ids and ${e.reason_ids.length} AI reasons; gated.`}, 'reasons')));
  }
  card.append(el('div', {class:'h3'}, el('span', {class:'micro'}, 'To date · head-to-head · all horizons'), help('Head-to-head view: one trade per company, family and pick rule each day. Profit after costs, settled trades and win rate. Fewer than 20 trades: too few to rank (SPEC section 6).')));
  const g = el('div', {class:'grid22'});
  g.append(el('div'), ...['best_expected_gain','highest_probability'].map(r => el('div', {class:'hd'}, PICK[r])));
  for (const f of ['rule','ai']) {
    g.append(el('div', {class:'rh'}, icon(FAMILY[f][1]), FAMILY[f][0].replace(' strategies','').replace(' traders','')));
    for (const r of ['best_expected_gain','highest_probability']) {
      const row = p.to_date.find(x => x.family === f && x.pick_rule === r);
      if (!row) { g.append(el('div', {class:'cell none'}, 'no settled trade yet')); continue; }
      g.append(el('div', {class:'cell'}, el('div', {class:'v'}, moneyDelta(cur, row.net_pnl)), el('div', {class:'s'}, `${row.trades} trade${row.trades === 1 ? '' : 's'} · ${pct(row.win_rate)} won · ${sgn(row.mean_return_pct)}/trade `, row.sample_badge === 'too_few_to_rank' ? el('span', {class:'badge-few', 'data-tip':'Fewer than 20 settled trades: too few to rank; the number is shown but proves nothing yet.'}, 'too few to rank') : null)));
    }
  }
  card.append(g);
  return card;
}

function newsCard(m) {
  const p = P(m), items = p.news, card = el('section', {class:'card', 'aria-label':'News'});
  const can = items.filter(n => CAN_CARRY.includes(n.status)), aside = items.filter(n => !CAN_CARRY.includes(n.status));
  card.append(el('h2', {}, 'News that can carry a call', el('span', {class:'mb-tag live'}, 'live'), help('Stories about the active companies whose verification status is confirmed (a filing or company release) or corroborated (independent outlets): only these may be the main evidence of a call (DESIGN.md 3b). Rumours and promotional items never support a call; single-source and unverified items lower confidence. The company page has each company’s full feed.'), el('span', {class:'sp'}, `${items.length} stored by the cut-off`)));
  const badge = st => { const s = STATUS[st] || [st, '', null]; return el('span', {class:'md-badge ' + st, 'data-tip': s[1]}, s[2] ? icon(s[2]) : null, s[0]); };
  const sent = v => { const s = v == null ? 'flat' : v > 0.05 ? 'up' : v < -0.05 ? 'dn' : 'flat'; return el('span', {class:'mb-dir ' + s, 'aria-label': 'sentiment ' + (v ?? 'n/a'), 'data-tip': v == null ? 'sentiment not scored' : `sentiment ${v > 0 ? '+' : ''}${v} (−1 very negative to +1 very positive), the news analyst’s score`}, icon(s === 'up' ? 'ms-arrow_upward' : s === 'dn' ? 'ms-arrow_downward' : 'ms-remove')); };
  const fmtT = iso => fmtLocal(iso, m, true);
  const item = n => el('li', {}, sent(n.enrichment.sentiment), el('div', {class:'hd'}, ...n.primary_tickers.map(t => el('a', {class:'tk', href: companyPage(t), style:'margin-right:4px'}, t)), el('a', {class:'t', href: n.url, rel:'noopener', target:'_blank'}, n.title), badge(n.status), el('small', {}, `${n.source} · ${n.enrichment.materiality} materiality · ${n.enrichment.event_type} · ${n.independent_origins} independent origin${n.independent_origins === 1 ? '' : 's'}${n.primary_ids.length ? `, ${n.primary_ids.length} filing` : ''} · ${fmtT(n.published_at)}`)));
  if (can.length) { const ul = el('ul', {class:'nl'}); can.forEach(n => ul.append(item(n))); card.append(ul); }
  else card.append(el('div', {class:'quiet'}, `Nothing that changes a call: none of the ${items.length} stored stor${items.length === 1 ? 'y' : 'ies'} is confirmed by a filing or corroborated by independent outlets.`));
  if (aside.length) {

    const det = el('details', {class:'aside'}, el('summary', {}, `Set aside: ${Object.entries(counts).map(([k, v]) => `${v} ${(STATUS[k] || [k])[0]}`).join(', ')}`));
    const ul = el('ul', {class:'nl', style:'margin-top:6px'}); aside.forEach(n => ul.append(item(n))); det.append(ul); card.append(det);
  }
  return card;
}

function rangeBar(cur, r, ck) {
  const last = ck ? ck.last_price : r.last_price;
  const lo = Math.min(r.lo80, r.entry_price, last) * 0.997, hi = Math.max(r.hi80, r.entry_price, last, r.target_price) * 1.003, X = v => (v - lo) / (hi - lo) * 92 + 2;
  const s = svgEl('svg', {viewBox:'0 0 96 18', role:'img', 'aria-label':`80% range ${price(cur, r.lo80)} to ${price(cur, r.hi80)}, last ${price(cur, last)}`});
  s.append(svgEl('rect', {x: X(r.lo80), y: 5, width: X(r.hi80) - X(r.lo80), height: 8, rx: 2, fill: 'var(--mb-chart-band-80)'}));
  s.append(svgEl('rect', {x: X(r.lo50), y: 5, width: X(r.hi50) - X(r.lo50), height: 8, rx: 2, fill: 'var(--mb-chart-band-50)'}));
  s.append(svgEl('line', {x1: X(r.entry_price), x2: X(r.entry_price), y1: 3, y2: 15, stroke: 'var(--md-sys-color-outline)', 'stroke-width': 1.5, 'stroke-dasharray': '2 1.5'}));
  s.append(svgEl('path', {d: `M${X(r.target_price)-3},1 L${X(r.target_price)+3},1 L${X(r.target_price)},5 Z`, fill: 'var(--mb-chart-1)'}));
  s.append(svgEl('line', {x1: X(last), x2: X(last), y1: 2, y2: 16, stroke: 'var(--md-sys-color-on-surface)', 'stroke-width': 2}));
  return el('span', {class:'rng', 'data-tip': `Predicted 50% range ${price(cur, r.lo50)}–${price(cur, r.hi50)}, 80% range ${price(cur, r.lo80)}–${price(cur, r.hi80)}; target ${price(cur, r.target_price)} (the triangle); entry ${price(cur, r.entry_price)} (dotted); ${ck ? 'price at the check' : 'last close'} ${price(cur, last)} (the dark line).`}, s, el('small', {}, `${price(cur, r.lo80)}–${price(cur, r.hi80)}`));
}

function openTrades(m) {
  const p = P(m), cur = p.currency, rows = p.open_trades;
  const card = el('section', {class:'card', 'aria-label':'Open paper trades'});
  const h2h = rows.filter(r => r.view === 'head_to_head').length;
  card.append(el('h2', {}, 'Open paper trades', el('span', {class:'mb-tag paper'}, 'paper'), help('Every paper trade that has entered (bought at the open of its entry session) and not yet exited, all strategies and horizons: the accuracy view (one trade per qualifying prediction) and the head-to-head view (H2H). Unrealised = the latest stored close against the entry, before costs. Range = where the price sits in the trade’s own predicted range. Check = the latest intraday check of the day, where one exists.'), el('span', {class:'sp'}, `${rows.length} open · ${rows.length - h2h} accuracy, ${h2h} head-to-head`), el('a', {class:'go', href:'../07-paper-portfolios/page.html'}, 'All trades', icon('ms-chevron_right'))));
  if (!rows.length) { card.append(el('div', {class:'quiet'}, 'No open paper trade.')); return card; }
  const checks = {}; for (const c of p.trade_checks) checks[c.trade_id] = c;
  const tb = el('table', {class:'ot'});
  tb.append(el('thead', {}, el('tr', {}, el('th', {}, 'Strategy'), el('th', {}, 'Horizon'), el('th', {class:'num v1'}, 'Entry'), el('th', {class:'num v1'}, 'Last'), el('th', {class:'num'}, 'Unrealised'), el('th', {class:'v1'}, 'Predicted range'), el('th', {class:'num v1'}, 'To target'), el('th', {}, 'Today’s check'))));
  const tbody = el('tbody');
  const byT = {}; for (const r of rows) (byT[r.ticker] = byT[r.ticker] || []).push(r);
  for (const [t, trs] of Object.entries(byT)) {
    const c = companyOf(m, t), sum = trs.reduce((a, r) => a + r.unrealised_pnl, 0);
    tbody.append(el('tr', {class:'grp'}, el('td', {colspan: 8}, el('a', {class:'tk', href: companyPage(t), 'data-tip': `${c.name}: open its company page (chart with targets and ranges, today’s path, settled results).`}, t), ` ${c.name}`, el('small', {}, `${trs.length} open · last ${price(cur, trs[0].last_price)} (${fmtD(trs[0].last_price_date, false)}) · unrealised `), moneyDelta(cur, sum, cur === 'INR' ? 0 : 2))));
    for (const r of trs.slice().sort((a, b) => a.horizon_days - b.horizon_days || a.strategy_id.localeCompare(b.strategy_id))) {
      const st = stratOf(m, r.strategy_id), ck = checks[r.trade_id];
      let status;
      if (!ck) status = el('span', {class:'st muted', 'data-tip':'No intraday check stored for this trade by the cut-off.'}, '—');
      else { const b = BAND[ck.band] || [ck.band, '']; const fl = ck.flags.map(f => FLAG[f] || f); status = el('span', {class:'st ' + (ck.flagged ? 'flag' : b[1]), 'data-tip': `${fmtLocal(ck.check_at, m)}: ${price(cur, ck.last_price)}, ${sgn(ck.ret_since_entry_pct)} since entry, ${b[0]}${fl.length ? '; ' + fl.join(', ') : ''}. Session ${ck.session_number} of the holding window.`}, icon(ck.flagged ? 'ms-warning' : 'ms-check'), ck.flagged ? fl.join(', ') : b[0]); }
      tbody.append(el('tr', {}, el('td', {}, st.name, r.view === 'head_to_head' ? el('span', {class:'vtag', 'data-tip':'Head-to-head view: one of the up to four daily picks for this company.'}, 'h2h') : null), el('td', {}, el('span', {class:'h-lab'}, `N+${r.horizon_days}`), el('small', {class:'muted v1', style:'white-space:nowrap'}, ` ${fmtD(r.entry_date)} → ${fmtD(r.exit_date)}`)), el('td', {class:'num v1'}, price(cur, r.entry_price)), el('td', {class:'num v1'}, price(cur, r.last_price)), el('td', {class:'num'}, moneyDelta(cur, r.unrealised_pnl, cur === 'INR' ? 0 : 2), el('span', {class:'v1'}, ' ', delta(r.unrealised_pct))), el('td', {class:'v1'}, rangeBar(cur, r, ck)), el('td', {class:'num v1'}, el('span', {'data-tip': r.to_target_pct < 0 ? `Already past the target ${price(cur, r.target_price)}.` : `${sgn(r.to_target_pct)} to the target ${price(cur, r.target_price)}.`}, r.to_target_pct < 0 ? 'past target' : sgn(r.to_target_pct))), el('td', {}, status)));
    }
  }
  tb.append(tbody);
  card.append(el('div', {class:'md-table-wrap'}, tb));
  return card;
}

function alerts(m) {
  const p = P(m), cur = p.currency, flagged = p.trade_checks.filter(c => c.flagged);
  const card = el('section', {class:'card', 'aria-label':'Alerts'});
  card.append(el('h2', {}, 'Alerts', help('Flagged intraday trade checks of the latest check today: an open paper trade outside its range, far from its target, or moving against the prediction. Monitoring only; nothing is traded on an alert.'), el('span', {class:'sp'}, p.trade_checks.length ? `check at ${fmtLocal(p.trade_checks[0].check_at, m)}` : 'no check yet')));
  if (!p.trade_checks.length) { card.append(el('div', {class:'quiet'}, 'No intraday check stored yet today. Checks run twice per session; the first one fills this card.')); return card; }
  if (!flagged.length) { card.append(el('div', {class:'quiet'}, `No open trade is flagged at the ${fmtLocal(p.trade_checks[0].check_at, m)} check.`)); return card; }
  const ul = el('ul', {class:'al'});
  const byT = {}; for (const c of flagged) (byT[c.ticker] = byT[c.ticker] || []).push(c);
  for (const [t, cks] of Object.entries(byT)) {
    const c = companyOf(m, t), flags = [...new Set(cks.flatMap(x => x.flags))].map(f => FLAG[f] || f);
    const li = el('li');
    li.append(icon('ms-warning'));
    li.append(el('div', {}, el('b', {}, el('a', {class:'tk', href: companyPage(t)}, t), ` ${c.name}: ${cks.length} open trade${cks.length === 1 ? '' : 's'} ${flags.join(' and ')}`),
      el('div', {class:'d'}, `${price(cur, cks[0].last_price)} at ${fmtLocal(cks[0].check_at, m)} · ${sgn(cks[0].ret_since_entry_pct)} since entry ${price(cur, cks[0].entry_price)}`),
      el('small', {}, cks.map(x => `${stratOf(m, x.strategy_id).name} N+${x.horizon_days} (${(BAND[x.band] || [x.band])[0]}, session ${x.session_number})`).join(' · '))));
    ul.append(li);
  }
  card.append(ul);
  return card;
}

function runs(m) {
  const p = P(m), r = p.status.runs, news = r.news;
  const card = el('section', {class:'card', 'aria-label':'Last runs'});
  card.append(el('h2', {}, 'Last runs', help('The routines of this market: pre-open (collect, model, strategies, AI traders, picks), two intraday checks, post-close (settlement, end-of-day analysis) and the news run every four hours. A tick means the run finished and its gates passed.')));
  const ul = el('ul', {class:'runs'});
  const mark = ok => el('span', {class:'mb-mark ' + (ok == null ? 'na' : ok ? 'ok' : 'no'), 'aria-label': ok == null ? 'not run yet' : ok ? 'ok' : 'failed'}, icon(ok == null ? 'ms-schedule' : ok ? 'ms-check' : 'ms-close'));
  const item = (ok, what, sub, when) => el('li', {}, mark(ok), el('span', {}, what, el('small', {}, sub)), el('span', {class:'t'}, when));
  ul.append(item(r.pre_open.ok, 'Pre-open', 'collect · model · strategies · AI traders · picks', fmtLocal(r.pre_open.at, m)));
  if (r.intraday.length) r.intraday.forEach((x, i) => ul.append(item(x.ok, `Intraday check ${i + 1}`, 'open trades vs range and target', fmtLocal(x.at, m))));
  else ul.append(item(null, 'Intraday checks', 'twice per session · none yet today', '—'));
  ul.append(item(r.post_close.ok, 'Post-close', r.post_close.at ? 'settlement · end-of-day analysis' : 'settlement · end-of-day analysis · not yet', r.post_close.at ? fmtLocal(r.post_close.at, m) : el('span', {}, el('small', {}, 'next '), fmtLocal(r.post_close.next_at, m))));
  ul.append(item(news.ok, 'News', `every 4 hours · ${news.new_items} new items`, fmtLocal(news.at, m)));
  card.append(ul);
  card.append(el('p', {class:'note'}, `Cut-off ${fmtLocal(p.cutoff, m, true)}: every number on this page was stored by then.`));
  return card;
}

function legend() {
  return el('div', {class:'legend', 'aria-label':'Legend'}, el('span', {}, el('span', {class:'mb-delta up'}, '+1.2%'), ' up'), el('span', {}, el('span', {class:'mb-delta down'}, '−1.2%'), ' down, always with the sign'),
    el('span', {}, el('span', {class:'mb-tag live'}, 'live'), ' stored by the pipeline'), el('span', {}, el('span', {class:'mb-tag paper'}, 'paper'), ' every signal and trade until proven'),
    el('span', {}, el('span', {class:'md-badge confirmed_primary'}, icon('ms-verified_user'), 'confirmed'), ' ', el('span', {class:'md-badge corroborated'}, icon('ms-check'), 'corroborated'), ' can carry a call'),
    el('span', {}, el('span', {class:'md-badge rumour'}, icon('ms-close'), 'rumour'), ' ', el('span', {class:'md-badge promotional'}, icon('ms-close'), 'promotional'), ' never'),
    el('span', {}, 'Click a company for its page, a ticker in a ranking for its strategies.'));
}

/* ---------- page ---------- */
function render() {
  const p = P(market);
  if (horizon == null) horizon = p.default_horizon;
  document.title = `Market brief · Home · ${LABEL[market]}`;
  $('#title').textContent = `Home · ${p.name}`;
  marketSeg(); tape(market);
  const page = $('#page'); page.innerHTML = '';
  page.append(header(market), strip(market), banner(market), horizonSelector(market));
  const grid = el('div', {class:'grid'});
  grid.append(el('div', {class:'col'}, agreement(market), headToHead(market)), el('div', {class:'col'}, alerts(market), ruleVsAi(market), newsCard(market), runs(market)));
  page.append(grid, el('div', {style:'margin-top:16px'}, openTrades(market)), legend());
  page.append(el('footer', {}, `Personal research project. Example data from the data catalogue; nothing here is investment advice and nothing trades. as_of ${p.as_of} · cutoff ${p.cutoff} · built_at ${p.built_at} · `, el('code', {}, D.endpoint.replace('{market}', market))));
}
render();
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h in D.markets && h !== market) { market = h; horizon = null; render(); } });
</script>
