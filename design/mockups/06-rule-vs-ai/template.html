<script>const D = /*__DATA__*/null;</script>
<!--@@SHARED_JS@@-->
<script>
let cost = 'market';
shell(PAGES.compare, 'Rule vs AI');
onMarketChange = () => render();
const REGIME_WORDS = {CALM: 'calm', TRENDING: 'trending', EVENT_HEAVY: 'event-heavy', UNSTABLE: 'unstable'};
const val = (r, k) => cost === 'your' && r.your_cost && k in r.your_cost ? r.your_cost[k] : r[k];
const luckOf = r => cost === 'your' && r.your_cost ? r.your_cost.luck_test : r.luck_test;
const yc = (p, t) => p.your_costs.find(x => x.trade_id === t.trade_id) || null;
const tNet = (p, t) => cost === 'your' && yc(p, t) ? yc(p, t).net_pnl_your : t.net_pnl;
const tRet = (p, t) => cost === 'your' && yc(p, t) ? yc(p, t).return_pct_your : t.return_pct;
const famRow = (p, f) => p.rows.find(r => r.scope === 'strategy' && r.family === f && r.horizon_days === 'all' && r.basis === 'forward') || null;
function luckBar(r) {
  const t = luckOf(r); if (!t || t.low_pct == null) return el('span', {class:'muted', 'data-tip':'Fewer than 2 trades: no luck interval yet.'}, 'none yet');
  const lo = Math.min(t.corrected_low_pct ?? t.low_pct, t.low_pct, 0), hi = Math.max(t.corrected_high_pct ?? t.high_pct, t.high_pct, 0), X = v => 4 + (v - lo) / ((hi - lo) || 1) * 88;
  const s = svgEl('svg', {viewBox:'0 0 96 16', role:'img', 'aria-label': `luck interval ${sgn(t.low_pct)} to ${sgn(t.high_pct)}, corrected ${sgn(t.corrected_low_pct)} to ${sgn(t.corrected_high_pct)}`});
  s.append(svgEl('line', {class:'z', x1: X(0), x2: X(0), y1: 1, y2: 15}), svgEl('line', {class:'raw', x1: X(t.low_pct), x2: X(t.high_pct), y1: 8, y2: 8}));
  if (t.corrected_low_pct != null) s.append(svgEl('line', {class:'cor' + (t.corrected ? ' edge' : ''), x1: X(t.corrected_low_pct), x2: X(t.corrected_high_pct), y1: 8, y2: 8}));
  s.append(svgEl('circle', {class:'mean', cx: X(val(r, 'mean_return_pct')), cy: 8, r: 2.5}));
  return el('span', {class:'luck', 'data-tip': `Luck test (${t.n} trades): mean return per trade ${sgn(val(r, 'mean_return_pct'))}; 95% interval ${sgn(t.low_pct)} to ${sgn(t.high_pct)} (thin), corrected for the ${t.m} rows compared ${sgn(t.corrected_low_pct)} to ${sgn(t.corrected_high_pct)} (thick). ${t.corrected ? 'Excludes zero: an edge may be real.' : 'Includes zero: could be luck; no edge claimed.'}`}, s, el('span', {class:'mb-label ' + (t.corrected ? 'success' : 'neutral')}, t.corrected ? 'edge' : 'luck?'));
}

/* ---------- scorecard ---------- */
function scorecard(p) {
  const cur = p.currency, R = famRow(p, 'rule'), A = famRow(p, 'ai');
  const card = el('section', {class:'card', 'aria-label':'Head-to-head scorecard'});
  card.append(el('div', {class:'head'}, el('h2', {}, 'Head-to-head: the strongest rule strategy vs the strongest AI trader'), help('The head-to-head view (F1, decisions 41-42): every session, for each company, the family’s strongest strategy picks one horizon under each of two pick rules (best expected gain, highest probability); each pick is one paper trade of the company’s amount. Rule and AI trade on identical company-days, so their results compare fairly. Figures after the selected costs; the luck test says whether the gap could be chance.'), el('div', {class:'end'}, el('span', {class:'mb-tag paper'}, 'paper'), `forward · as of the ${fmtD(p.as_of, false)} close`)));
  const side = (f, r) => { const s = el('div', {class:'side' + (r && R && A && val(r, 'net_pnl') > Math.max(val(R, 'net_pnl'), val(A, 'net_pnl')) - 1e-9 && val(R, 'net_pnl') !== val(A, 'net_pnl') ? ' lead' : '')});
    s.append(el('div', {class:'fh'}, avatar(FAMILY[f][1], f === 'ai' ? 'info' : '', 'sm'), el('b', {}, FAMILY[f][0]), r ? el('small', {}, `· ${stratOf(market, r.strategy_id).name}`) : el('small', {}, '· no settled head-to-head trade yet')));
    if (!r) { s.append(el('div', {class:'quiet'}, 'Nothing settled yet in the head-to-head view.')); return s; }
    s.append(el('div', {class:'net'}, moneyDelta(cur, val(r, 'net_pnl'), dec(cur)), el('small', {}, `profit after ${cost} cost on ${r.trades} trade${r.trades === 1 ? '' : 's'} · ${r.sample_badge === 'too_few_to_rank' ? `too few to rank (under ${MIN_TRADES_TO_RANK})` : 'enough to rank'}`)));
    s.append(el('div', {class:'st'}, el('div', {'data-tip': `${pct(val(r, 'win_rate'))} of trades made money after ${cost} cost.`}, 'Win rate', el('b', {}, pct(val(r, 'win_rate')))), el('div', {'data-tip':'Average distance of the exit close from the predicted target, in percent (F1.9).'}, 'Target error', el('b', {}, sgn(r.avg_target_error_pct))), el('div', {'data-tip': `Mean return per trade after ${cost} cost; drawdown ${money(cur, val(r, 'max_drawdown'), dec(cur), true)}, worst streak ${val(r, 'worst_losing_streak')}.`}, 'Per trade', el('b', {}, sgn(val(r, 'mean_return_pct'))))));
    s.append(luckBar(r)); return s; };
  const mid = el('div', {class:'mid'});
  if (R && A) { const d = val(R, 'net_pnl') - val(A, 'net_pnl'); mid.append(icon('ms-layers'), el('div', {class:'who'}, Math.abs(d) < 1e-9 ? 'Level' : d > 0 ? 'Rule ahead' : 'AI ahead'), el('div', {}, Math.abs(d) < 1e-9 ? 'identical results so far' : `by ${money(cur, Math.abs(d), dec(cur))} after ${cost} cost`), el('div', {class:'muted'}, `${R.trades + A.trades} trades in all · ${p.status.paper_label}`)); }
  else mid.append(icon('ms-layers'), el('div', {class:'who'}, 'No verdict yet'));
  card.append(el('div', {class:'vs'}, side('rule', R), mid, side('ai', A)));
  card.append(el('p', {class:'note'}, 'A lead on a handful of trades is mostly luck (SPEC section 6): the luck bar must clear zero after correction before anyone is called better. Nothing here is advice.'));
  return card;
}

/* ---------- today's picks ---------- */
function picksCard(p) {
  const cur = p.currency, today = p.picks.filter(k => k.session_date === p.session_date), picked = today.filter(k => k.status === 'picked');
  const card = el('section', {class:'card', 'aria-label':'Today’s head-to-head picks'});
  card.append(el('div', {class:'head'}, el('h2', {}, `Today’s picks for ${fmtD(p.session_date)}`), el('span', {class:'mb-tag paper'}, 'paper'), help('The paper trades both families will make at the open of the session being predicted: for each company, the strongest rule strategy and the strongest AI trader each pick one horizon per pick rule. "Clears market costs" is the ranking view; "viable at your cost" adds your broker’s charges (decision 51).'), el('div', {class:'end'}, picked.length ? viableLine(picked) : 'no pick today')));
  if (!today.length) { card.append(el('div', {class:'quiet'}, 'No head-to-head picks stored for the session.')); return card; }
  const g = el('div', {class:'pks'});
  for (const f of ['rule', 'ai']) {
    const fk = picked.filter(k => k.family === f), box = el('div', {class:'pkbox'});
    const any = fk[0], st = any ? stratOf(market, any.strategy_id) : null;
    box.append(el('div', {class:'h'}, avatar(FAMILY[f][1], f === 'ai' ? 'info' : '', 'sm'), el('b', {}, FAMILY[f][0]), st ? el('span', {class:'muted'}, `· ${st.name} · ${fk.length} pick${fk.length === 1 ? '' : 's'}`) : el('span', {class:'muted'}, '· no candidate today')));
    for (const k of fk) box.append(el('div', {class:'pk'}, el('span', {class:'l1'}, el('a', {class:'tk', href: companyPage(k.ticker)}, k.ticker), el('small', {}, `${companyOf(market, k.ticker).name} · ${PICK[k.pick_rule]}`), el('span', {class:'h-lab'}, `N+${k.horizon_days}`)), el('span', {class:'l2'}, odds(k.prob_up, `${pct(k.prob_up, 1)} chance of a rise from the open to the N+${k.horizon_days} close.`), el('span', {class:'g'}, moneyDelta(cur, k.expected_gain_pct * k.amount / 100, dec(cur))), ...costLabels(cur, k))));
    if (!fk.length) box.append(el('div', {class:'quiet'}, `No ${f === 'rule' ? 'rule strategy' : 'AI trader'} buys any company at any horizon today.`));
    g.append(box);
  }
  card.append(g);
  return card;
}

/* ---------- matches on identical company-days ---------- */
function matches(p) {
  const cur = p.currency, groups = {};
  for (const t of p.trades) { const k = `${t.entry_date}|${t.ticker}|${t.pick_rule}`; (groups[k] = groups[k] || {entry_date: t.entry_date, ticker: t.ticker, pick_rule: t.pick_rule, rule: null, ai: null})[t.family] = t; }
  const list = Object.values(groups).sort((a, b) => b.entry_date.localeCompare(a.entry_date) || a.ticker.localeCompare(b.ticker) || a.pick_rule.localeCompare(b.pick_rule));
  const card = el('section', {class:'card', 'aria-label':'Matches'});
  const both = list.filter(g => g.rule && g.ai), ruleW = both.filter(g => tNet(p, g.rule) > tNet(p, g.ai)).length, aiW = both.filter(g => tNet(p, g.ai) > tNet(p, g.rule)).length;
  card.append(el('div', {class:'head'}, el('h2', {}, 'Match by match: identical company-days'), el('span', {class:'mb-tag paper'}, 'paper'), help(`One row per company, entry session and pick rule in the head-to-head view (the entry session under the company name). Where both families’ trades have settled, the row says who made more after ${cost} cost (a draw when the picks were the same horizon, so the same trade). A side whose pick is still running shows "open"; "no candidate" means that family had no strategy buying the company that day.`), el('div', {class:'end'}, `after ${cost} cost · `, both.length ? `${both.length} match${both.length === 1 ? '' : 'es'}: rule ${ruleW}, AI ${aiW}, draw ${both.length - ruleW - aiW}` : 'no completed match yet')));
  if (!list.length) { card.append(el('div', {class:'quiet'}, 'No settled head-to-head trade yet.')); return card; }
  const tb = el('table', {class:'md-table tbl mt'});
  tb.append(el('thead', {}, el('tr', {}, el('th', {}, 'Company · entry'), el('th', {class:'cm'}, 'Pick rule'), el('th', {}, 'Rule'), el('th', {}, 'AI'), el('th', {}, 'Who won'))));
  const body = el('tbody');
  const other = (g, f) => p.picks.find(k => k.session_date === g.entry_date && k.ticker === g.ticker && k.pick_rule === g.pick_rule && k.family === f) || null;
  const res = (g, f) => { const t = g[f]; if (t) return el('span', {class:'res'}, el('b', {}, moneyDelta(cur, tNet(p, t), dec(cur))), el('small', {}, `${stratOf(market, t.strategy_id).name} · N+${t.horizon_days} · ${sgn(tRet(p, t))}`, el('span', {class:'cw'}, ` · target ${t.target_reached ? 'reached' : 'missed'}, error ${Math.abs(t.target_error_pct).toFixed(2)}%`)));
    const k = other(g, f); if (k && k.status === 'picked') return el('span', {class:'res'}, el('b', {class:'muted'}, 'open'), el('small', {}, `${stratOf(market, k.strategy_id).name} · N+${k.horizon_days} · not settled by the cut-off`)); return el('span', {class:'muted', 'data-tip': k ? 'This family had no strategy buying this company at any horizon that day.' : 'No head-to-head pick stored for this family and day.'}, k ? 'no candidate' : 'no pick stored'); };
  for (const g of list) {
    let who;
    if (g.rule && g.ai) who = tNet(p, g.rule) === tNet(p, g.ai) ? el('span', {class:'mb-label neutral', 'data-tip':'Both families picked the same horizon, so the same trade: a draw.'}, 'draw') : tNet(p, g.rule) > tNet(p, g.ai) ? el('span', {class:'mb-label'}, icon('ms-settings'), 'rule') : el('span', {class:'mb-label info'}, icon('ms-bolt'), 'AI');
    else { const k = other(g, g.rule ? 'ai' : 'rule'); who = el('span', {class:'muted'}, k && k.status === 'picked' ? 'waiting' : 'no match'); }
    body.append(el('tr', {}, el('td', {}, el('a', {class:'tk', href: companyPage(g.ticker)}, g.ticker), el('small', {class:'muted', style:'display:block;font-size:11px'}, `${companyOf(market, g.ticker).name} · entered ${fmtD(g.entry_date, false)}`)), el('td', {class:'cm'}, PICK[g.pick_rule] || g.pick_rule), el('td', {}, res(g, 'rule')), el('td', {}, res(g, 'ai')), el('td', {class:'win'}, who)));
  }
  tb.append(body); card.append(el('div', {class:'md-table-wrap'}, tb));
  return card;
}

/* ---------- pick rules and regimes ---------- */
function slices(p) {
  const cur = p.currency, card = el('section', {class:'card', 'aria-label':'By pick rule and regime'});
  card.append(el('div', {class:'head'}, el('h2', {}, 'Gain-pick vs probability-pick, and by regime'), el('span', {class:'mb-tag paper'}, 'paper'), help('The same head-to-head trades cut two ways (F7.1): by the pick rule that chose the horizon (best expected gain vs highest probability) and by the market regime at prediction time (F2.6).')));
  const pr = p.rows.filter(r => r.scope === 'pick_rule' && r.horizon_days === 'all').sort((a, b) => a.family.localeCompare(b.family) || a.pick_rule.localeCompare(b.pick_rule));
  const rg = p.rows.filter(r => r.scope === 'strategy_regime').sort((a, b) => a.family.localeCompare(b.family) || String(a.regime).localeCompare(String(b.regime)));
  const tbl = (rows, firstLabel, firstOf) => { const t = el('table', {class:'md-table tbl mt'}); t.append(el('thead', {}, el('tr', {}, el('th', {}, firstLabel), el('th', {class:'num'}, 'Trades'), el('th', {class:'num'}, `Profit after ${cost} cost`), el('th', {class:'num'}, 'Win rate'), el('th', {class:'num cm'}, 'Target error'), el('th', {}, 'Luck test')))); const b = el('tbody'); for (const r of rows) b.append(el('tr', {}, el('td', {}, famLabel(r.family, FAMILY_SHORT[r.family]), ' ', firstOf(r)), el('td', {class:'num'}, String(r.trades)), el('td', {class:'num'}, moneyDelta(cur, val(r, 'net_pnl'), dec(cur))), el('td', {class:'num'}, pct(val(r, 'win_rate'))), el('td', {class:'num cm'}, sgn(r.avg_target_error_pct)), el('td', {}, luckBar(r)))); t.append(b); return el('div', {class:'md-table-wrap'}, t); };
  card.append(el('div', {class:'sub2', style:'margin:0 0 8px'}, 'By pick rule'), pr.length ? tbl(pr, 'Family × pick rule', r => PICK[r.pick_rule] || r.pick_rule) : el('div', {class:'quiet'}, 'No pick-rule row yet.'));
  card.append(el('div', {class:'sub2', style:'margin:14px 0 8px'}, 'By market regime at prediction time'), rg.length ? tbl(rg, 'Family × regime', r => el('span', {}, REGIME_WORDS[r.regime] || r.regime, el('small', {class:'muted', style:'display:block;font-size:11px'}, stratOf(market, r.strategy_id).name))) : el('div', {class:'quiet'}, 'No regime row yet.'));
  return card;
}

/* ---------- per company ---------- */
function perCompany(p) {
  const cur = p.currency, card = el('section', {class:'card', 'aria-label':'Per company'});
  card.append(el('div', {class:'head'}, el('h2', {}, 'Per company'), el('span', {class:'mb-tag paper'}, 'paper'), help(`Rule vs AI on each company, head-to-head view: settled trades, profit after ${cost} cost and how many made money, summed from the settled head-to-head trades (a per-company scoreboard row is requested from W1). A per-company lead on a few trades is mostly luck.`), el('div', {class:'end'}, `after ${cost} cost`, el('a', {class:'go', href: PAGES.watchlist}, 'Watchlist', icon('ms-chevron_right')))));
  const tickers = [...new Set(p.trades.map(t => t.ticker))].sort();
  if (!tickers.length) { card.append(el('div', {class:'quiet'}, 'No settled head-to-head trade on any company yet.')); return card; }
  const tb = el('table', {class:'md-table tbl mt'});
  tb.append(el('thead', {}, el('tr', {}, el('th', {}, 'Company'), el('th', {}, 'Rule'), el('th', {}, 'AI'), el('th', {}, 'Ahead'))));
  const body = el('tbody');
  const agg = ts => ts.length ? {n: ts.length, net: ts.reduce((s, t) => s + tNet(p, t), 0), win: ts.filter(t => tNet(p, t) > 0).length} : null;
  const cell = a => a ? el('span', {class:'res'}, el('b', {}, moneyDelta(cur, a.net, dec(cur))), el('small', {}, `${a.n} trade${a.n === 1 ? '' : 's'} · ${a.win} won`)) : el('span', {class:'muted'}, 'no trade');
  for (const t of tickers) { const r = agg(p.trades.filter(x => x.ticker === t && x.family === 'rule')), a = agg(p.trades.filter(x => x.ticker === t && x.family === 'ai')); let who = el('span', {class:'muted'}, '—'); if (r && a) who = r.net === a.net ? el('span', {class:'mb-label neutral'}, 'level') : r.net > a.net ? el('span', {class:'mb-label'}, 'rule') : el('span', {class:'mb-label info'}, 'AI'); else if (r || a) who = el('span', {class:'muted'}, 'one side only');
    body.append(el('tr', {}, el('td', {}, el('a', {class:'tk', href: companyPage(t), 'data-tip': `${companyOf(market, t).name}: open the company page.`}, t), el('small', {class:'muted', style:'display:block;font-size:11px'}, companyOf(market, t).name)), el('td', {}, cell(r)), el('td', {}, cell(a)), el('td', {}, who))); }
  tb.append(body); card.append(el('div', {class:'md-table-wrap'}, tb));
  return card;
}

/* ---------- cumulative lines rule vs ai ---------- */
let cumHost;
function cumCard(p) { const card = el('section', {class:'card', 'aria-label':'Cumulative profit'}); card.append(el('div', {class:'head'}, el('h2', {}, 'Cumulative profit after market cost, head-to-head'), help('Each family’s settled head-to-head trades added up by exit date (F2.8), starting at zero on the first entry date. Dotted line = zero.'), el('div', {class:'end'}, el('span', {class:'mb-tag paper'}, 'paper')))); cumHost = el('div', {class:'cum'}); card.append(cumHost); return card; }
function drawCum(p) {
  const host = cumHost; if (!host || !host.isConnected) return; host.innerHTML = '';
  const cur = p.currency, exits = [...new Set(p.trades.map(t => t.exit_date_actual || t.exit_date))].sort();
  if (!exits.length) { host.append(el('div', {class:'quiet'}, 'No settled head-to-head trade yet.')); return; }
  const start = p.trades.map(t => t.entry_date).sort()[0], dates = [start, ...exits.filter(d => d !== start)];
  const lines = ['rule', 'ai'].map(f => { let c = 0; return {f, pts: dates.map(d => { for (const t of p.trades) if (t.family === f && (t.exit_date_actual || t.exit_date) === d) c += t.net_pnl; return c; })}; });
  const W = Math.max(280, host.clientWidth), phone = W < 560, H = 200, L = phone ? 52 : 64, R = phone ? 12 : 60, T = 12, B = 26;
  let lo = Math.min(0, ...lines.flatMap(l => l.pts)), hi = Math.max(0, ...lines.flatMap(l => l.pts)); const pad = (hi - lo) * 0.1 || 1; lo -= pad; hi += pad;
  const X = i => L + (dates.length === 1 ? (W - L - R) / 2 : i / (dates.length - 1) * (W - L - R)), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const svg = svgEl('svg', {viewBox:`0 0 ${W} ${H}`, width: W, height: H, role:'img', 'aria-label': `Cumulative head-to-head profit by exit date: rule ${money(cur, lines[0].pts.at(-1), dec(cur), true)}, AI ${money(cur, lines[1].pts.at(-1), dec(cur), true)}.`});
  const grid = svgEl('g', {class:'grid'}), ax = svgEl('g', {class:'ax'});
  for (const v of niceTicks(lo, hi, 4)) { grid.append(svgEl('line', {x1: L, x2: W - R, y1: Y(v), y2: Y(v)})); const t = svgEl('text', {x: L - 6, y: Y(v) + 4, 'text-anchor':'end'}); t.textContent = money(cur, v, 0, true); ax.append(t); }
  dates.forEach((d, i) => { const t = svgEl('text', {x: X(i), y: H - 8, 'text-anchor':'middle'}); t.textContent = fmtD(d, false); ax.append(t); });
  svg.append(grid, svgEl('line', {class:'zero', x1: L, x2: W - R, y1: Y(0), y2: Y(0)}));
  for (const l of lines) { const k = l.f === 'rule' ? 'r' : 'a'; svg.append(svgEl('polyline', {class:`ln ${k}`, points: l.pts.map((v, i) => `${X(i)},${Y(v)}`).join(' ')})); l.pts.forEach((v, i) => { const c = svgEl('circle', {class:`pt ${k}`, cx: X(i), cy: Y(v), r: 4}); c.append(svgEl('title')); c.lastChild.textContent = `${FAMILY[l.f][0]} through ${fmtD(dates[i])}: ${money(cur, v, dec(cur), true)}`; c.setAttribute('tabindex', '0'); c.setAttribute('data-tip', c.lastChild.textContent); svg.append(c); }); if (!phone) { const t = svgEl('text', {class:'lab', x: W - R + 8, y: Y(l.pts.at(-1)) + 4 + (l.f === 'ai' && Math.abs(Y(lines[0].pts.at(-1)) - Y(l.pts.at(-1))) < 13 ? 13 : 0)}); t.textContent = FAMILY_SHORT[l.f]; svg.append(t); } }
  svg.append(ax); host.append(svg);
  host.append(el('div', {class:'legend2', style:'margin-top:6px'}, el('span', {}, el('i', {class:'sw r'}), 'rule'), el('span', {}, el('i', {class:'sw a'}), 'AI'), el('span', {class:'muted'}, 'identical picks add the same trade to both lines')));
}
function niceTicks(lo, hi, n) { const span = hi - lo, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag, stepv = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag; const out = []; for (let v = Math.ceil(lo / stepv) * stepv; v <= hi; v += stepv) out.push(+v.toFixed(6)); return out; }

/* ---------- why: EOD analyst ---------- */
function why(p) {
  const cur = p.currency, e = p.eod[0], card = el('section', {class:'card', 'aria-label':'Why: the end-of-day analyst'});
  card.append(el('div', {class:'head'}, el('h2', {}, 'Why: the end-of-day analyst'), el('span', {class:'mb-tag paper'}, 'paper'), help('After each close the EOD analyst (Sonnet, F6.1) sums the day per family and per pick rule, writes a summary of at most 150 words citing ids, and a reason of at most 60 words for every head-to-head trade settled that day, grounded in the trade’s automatic reason split (market, sector, news, company). A deterministic gate checks every id and number. It explains; it never predicts.'), el('div', {class:'end'}, e ? `session ${fmtD(e.session_date)} · ${e.settled_trades} trades settled` : '')));
  if (!e) { card.append(el('div', {class:'quiet'}, 'No end-of-day analysis stored by the cut-off.')); return card; }
  const f3 = el('div', {class:'fam3'});
  for (const f of ['rule', 'baseline', 'ai']) { const x = e.results[f]; f3.append(el('div', {class:'f'}, el('div', {class:'l'}, el('i', {class:'sw ' + FAMILY[f][2]}), FAMILY[f][0]), el('div', {class:'v'}, moneyDelta(cur, x.net_pnl, dec(cur))), el('div', {class:'s'}, x.trades ? `${x.wins} of ${x.trades} trade${x.trades === 1 ? '' : 's'} made money (accuracy view, market cost)` : 'no trade settled'))); }
  card.append(f3);
  card.append(el('div', {class:'lead-row'}, ...['best_expected_gain', 'highest_probability'].map(k => el('span', {'data-tip': `Head-to-head trades chosen by the ${PICK[k].toLowerCase()} rule that settled this session.`}, `${PICK[k]}: `, el('b', {}, e.results[k].trades ? `${money(cur, e.results[k].net_pnl, dec(cur), true)} on ${e.results[k].trades}` : 'no trade')))));
  card.append(el('div', {class:'summ', style:'margin-top:12px'}, icon('ms-description'), el('div', {}, e.summary)));
  if (p.reasons.length) { const ul = el('ul', {class:'rl'}); for (const r of p.reasons) ul.append(el('li', {}, el('div', {class:'rh'}, famLabel(stratOf(market, r.strategy_id).family, FAMILY_SHORT[stratOf(market, r.strategy_id).family]), el('b', {}, stratOf(market, r.strategy_id).name), el('a', {class:'tk', href: companyPage(r.ticker)}, r.ticker), el('span', {}, `· settled ${fmtD(r.session_date)}`)), el('div', {}, r.text), el('div', {class:'ids'}, ...r.cited_ids.map(id => el('code', {}, id))))); card.append(ul); }
  else card.append(el('div', {class:'quiet', style:'margin-top:10px'}, 'No head-to-head reason stored yet.'));
  return card;
}

/* ---------- weekly research review ---------- */
function review(p) {
  const cur = p.currency, r = p.reviews[0], card = el('section', {class:'card rev', 'aria-label':'Weekly research review'});
  card.append(el('div', {class:'head'}, el('h2', {}, 'The week’s research review'), help('Every Saturday the research director (Opus, F6.2) reads the scoreboard, the news-impact study, the week’s EOD analyses and lessons, and writes who is ahead and why, which information helped, and proposals as config diffs. It changes nothing itself: every proposal stays "proposed" until the owner approves it.'), el('div', {class:'end'}, r ? `${r.iso_week} · ${fmtD(r.period_start, false)}–${fmtD(r.period_end, false)}` : '')));
  if (!r) { card.append(el('div', {class:'quiet'}, `No weekly review written by the cut-off. The next one (${p.review_due.iso_week}) is due on Saturday ${fmtDY(p.review_due.date)}, after the cut-off; a review from before it is requested from W1 for the example data.`)); return card; }
  card.append(el('h3', {}, 'Who leads'), el('div', {class:'lead-row'}, ...r.leaders.map(l => el('span', {}, famLabel(l.scope, FAMILY_SHORT[l.scope] || l.scope), ' ', el('b', {}, stratOf(market, l.strategy_id).name), ` ${money(cur, l.net_pnl, dec(cur), true)} on ${l.trades}`))));
  card.append(el('h3', {}, 'Findings')); const ul = el('ul', {class:'rl'}); for (const f of r.findings) ul.append(el('li', {}, el('div', {}, f.text), el('div', {class:'ids'}, ...f.cited_ids.map(id => el('code', {}, id))))); card.append(ul);
  card.append(el('h3', {}, 'Proposals (nothing applied until the owner approves)'));
  for (const q of r.proposals) card.append(el('div', {class:'prop'}, el('div', {class:'ph'}, el('b', {}, `${q.kind} · ${q.file}`), el('span', {class:'mb-label ' + (q.status === 'proposed' ? 'warn' : 'neutral')}, q.status), el('code', {}, q.proposal_id)), el('div', {style:'margin-top:4px'}, q.rationale), el('pre', {}, q.diff), el('div', {class:'ids', style:'margin-top:6px'}, ...q.cited_ids.map(id => el('code', {}, id)))));
  card.append(el('p', {class:'note'}, `Full report: ${r.report_path}`));
  return card;
}

function legend() {
  return el('div', {class:'legend2', 'aria-label':'Legend'}, el('span', {}, 'Legend (sample values): ', el('span', {class:'mb-delta up'}, '+1.2%'), ' up, ', el('span', {class:'mb-delta down'}, '−1.2%'), ' down, always with the sign'),
    el('span', {}, el('i', {class:'sw r'}), 'rule ', el('i', {class:'sw b'}), 'baselines ', el('i', {class:'sw a'}), 'AI'),
    el('span', {}, el('span', {class:'mb-label success'}, 'edge'), ' the corrected luck interval excludes zero; ', el('span', {class:'mb-label neutral'}, 'luck?'), ' it does not'),
    el('span', {}, el('span', {class:'mb-tag paper'}, 'paper'), ' every signal and trade until proven; nothing here is advice'));
}

let ro;
function render() {
  const p = P(market);
  document.title = `Market brief · Rule vs AI · ${LABEL[market]}`; $('#title').textContent = `Rule vs AI · ${p.name}`;
  sideFoot(market); marketSeg(() => render());
  const page = $('#page'); page.innerHTML = '';
  const bar = el('div', {class:'ctrls'}); const sg = el('div', {class:'md-segmented dense light', role:'group', 'aria-label':'Costs'}); for (const [k, t] of [['market', 'Market cost'], ['your', 'Your cost']]) sg.append(el('button', {type:'button', 'aria-pressed': String(k === cost), onclick: () => { cost = k; render(); }}, t)); bar.append(el('span', {class:'c'}, 'Costs', help('Market cost: brokerage, taxes and fees (the ranking view). Your cost adds your own broker’s charges; the go-live bar uses it (decision 50). The switch changes the scorecard, the slice tables, the matches and the per-company sums (per-trade your-cost figures from the cost views); the cumulative lines and the EOD analyst stay on market cost.'), sg));
  page.append(pageHead(market, 'Rule vs AI', `head-to-head paper trades on identical company-days · ${p.name} · data as of the ${fmtD(p.as_of, false)} close · research only`), paperBand(market, p.go_live, Object.keys(p.strategies).length), bar);
  page.append(el('div', {style:'margin-top:16px'}, scorecard(p)), el('div', {style:'margin-top:16px'}, picksCard(p)), el('div', {style:'margin-top:16px'}, matches(p)));
  page.append(el('div', {style:'margin-top:16px'}, slices(p)));
  const grid = el('div', {class:'grid even'}); grid.append(perCompany(p), cumCard(p)); page.append(grid);
  page.append(el('div', {style:'margin-top:16px'}, why(p)), el('div', {style:'margin-top:16px'}, review(p)), legend(), footer(market, D.endpoint));
  makeFocusable(page); drawCum(p);
  if (ro) ro.disconnect(); ro = new ResizeObserver(() => { const svg = cumHost && cumHost.querySelector('svg'); if (cumHost && cumHost.isConnected && (!svg || Math.abs(cumHost.clientWidth - svg.clientWidth) > 2)) drawCum(P(market)); }); ro.observe(cumHost);
}
render();
</script>
