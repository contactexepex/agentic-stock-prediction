# B12, company pages (docs/ws/b12.md; schemas in api/schemas/company.yaml).
/api/v1/markets/{market}/stocks/{ticker}:
  get:
    tags: [stocks]
    operationId: getCompanyPage
    summary: >-
      The company page: agreement, picks and predictions with targets and ranges, open trades and today's checks,
      settled results and why they moved, news with status, results digest, events, bars (design/mockups/03-company)
    x-read-model: rm.stock
    parameters:
      - $ref: '#/components/parameters/Market'
      - $ref: '#/components/parameters/Ticker'
    responses:
      '200':
        description: The company page (page_key = ticker; every collected company, deleted ones never)
        headers:
          ETag: {$ref: '#/components/headers/ETag'}
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompanyPageResponse'}
      '404': {$ref: '#/components/responses/NotFound'}
      '503': {$ref: '#/components/responses/Unavailable'}
/api/v1/markets/{market}/stocks/{ticker}/bars:
  get:
    tags: [stocks]
    operationId: getCompanyBars
    summary: The company's split-adjusted daily bars up to the as-of date (the company page's `bars`)
    x-read-model: rm.bars
    parameters:
      - $ref: '#/components/parameters/Market'
      - $ref: '#/components/parameters/Ticker'
    responses:
      '200':
        description: The bars read model (page_key = ticker)
        headers:
          ETag: {$ref: '#/components/headers/ETag'}
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompanyBarsResponse'}
      '404': {$ref: '#/components/responses/NotFound'}
      '503': {$ref: '#/components/responses/Unavailable'}
/api/v1/markets/{market}/stocks/{ticker}/strategies:
  get:
    tags: [stocks]
    operationId: getStockStrategies
    summary: >-
      Every strategy's view of one company: agreement, the head-to-head picks, all strategies' predictions and their
      record on this company and overall (design/mockups/04-stock-strategies)
    x-read-model: rm.stock_strategies
    parameters:
      - $ref: '#/components/parameters/Market'
      - $ref: '#/components/parameters/Ticker'
    responses:
      '200':
        description: The stock strategies read model (page_key = ticker)
        headers:
          ETag: {$ref: '#/components/headers/ETag'}
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StockStrategiesResponse'}
      '404': {$ref: '#/components/responses/NotFound'}
      '503': {$ref: '#/components/responses/Unavailable'}
/api/v1/markets/{market}/trades:
  get:
    tags: [portfolio]
    operationId: getTrades
    summary: >-
      Open paper trades, the latest intraday check and the last 5 sessions' settled trades of the market, or with
      `ticker` one company's open trades and checks plus its settled trades and AI reasons of the last 60 sessions
      (docs/SPEC.md sections 4-5). Paper only: nothing is traded
    x-read-model: rm.trades
    parameters:
      - $ref: '#/components/parameters/Market'
      - name: ticker
        in: query
        required: false
        description: One collected company (page_key = ticker); without it the market's page (page_key `_`)
        schema: {$ref: '#/components/schemas/Ticker'}
    responses:
      '200':
        description: The trades read model
        headers:
          ETag: {$ref: '#/components/headers/ETag'}
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TradesResponse'}
      '404': {$ref: '#/components/responses/NotFound'}
      '503': {$ref: '#/components/responses/Unavailable'}
/api/v1/markets/{market}/stocks/{ticker}/lifecycle/{date}:
  get:
    tags: [stocks]
    operationId: getCompanyLifecycle
    summary: >-
      One session's path of a company: predictions and picks made for it, its intraday trade checks, the trades
      settled on it and the AI reasons (docs/SPEC.md sections 4-5; the last 30 sessions, older: 404)
    x-read-model: rm.lifecycle
    parameters:
      - $ref: '#/components/parameters/Market'
      - $ref: '#/components/parameters/Ticker'
      - name: date
        in: path
        required: true
        description: The session date (YYYY-MM-DD); page_key = `<ticker>:<date>`
        schema: {$ref: '#/components/schemas/IsoDate'}
    responses:
      '200':
        description: The lifecycle read model
        headers:
          ETag: {$ref: '#/components/headers/ETag'}
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LifecycleResponse'}
      '404': {$ref: '#/components/responses/NotFound'}
      '503': {$ref: '#/components/responses/Unavailable'}
