# The Watchlist page (B11; replaces the 1.0 watchlist). Builder: scripts/marketbrief/warehouse/rm_watchlist.py; route
# web/app/api/v1/markets/[market]/watchlist.
/api/v1/markets/{market}/watchlist:
  get:
    tags: [markets]
    operationId: getWatchlist
    summary: The Watchlist page (02-watchlist) - every company with agreement, open trades, checks and ranges
    x-read-model: rm.watchlist
    parameters:
      - $ref: '#/components/parameters/Market'
    responses:
      '200':
        description: The Watchlist page read model
        headers:
          ETag: {$ref: '#/components/headers/ETag'}
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WatchlistResponse'}
      '404': {$ref: '#/components/responses/NotFound'}
      '503': {$ref: '#/components/responses/Unavailable'}
