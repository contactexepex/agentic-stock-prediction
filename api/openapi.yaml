openapi: 3.1.0
info:
  title: market-brief app API
  version: 2.0.0
  summary: Read API over the precomputed read models (docs/ARCHITECTURE.md section 4), plus planned governed writes.
  description: |
    Research only: nothing here places, routes or suggests a trade, and nothing is investment advice.
    Every signal carries "Paper only — no proven edge yet" until the weekly review's `model_skill` is true.

    Each read response is `ReadModelMeta` plus `payload`. The payload schema of each response doubles as the
    read-model payload schema: WS1 writes exactly that JSON into `rm.<table>.payload` (the table is named in
    each operation's `x-read-model`), and WS2 returns it verbatim. Field names are those of the dashboard
    payload (`scripts/marketbrief/presentation/dashboard/`), the data-kind schemas
    (`scripts/marketbrief/core/schema*.py`) and the views (`sql/views.sql`); `x-source` names where each comes
    from. Everything is as of the build's cut-off (`ReadModelMeta.cutoff`); nothing stored after it is used.

    Version 2.0 (owner's decision of 2026-10-08, option A): the approved mockups' page payloads replace the never-built
    1.0 payloads on the handover paths watchlist, stocks/{ticker}, track-record and news (their page sessions B11-B13
    replace the 1.0 schemas Watchlist, StockDetail, TrackRecord and NewsFeed); the other 1.0 endpoints stay, and the
    1.0 write endpoints are replaced as docs/SPEC.md section 5 says.

    Layout (2.0, docs/ws/b4.md "Contract layout"): this file holds the shared parts (info, security, parameters,
    responses, the schemas every page uses) and the platform paths; each page session adds `api/paths/<page>.yaml`
    (a map of path -> path item) and `api/schemas/<page>.yaml` (a map of schema name -> schema). The bundle
    (`python -m marketbrief.warehouse.openapi_spec`, from scripts/) merges them into one document; every `$ref` is
    written against that bundled document (`#/components/schemas/Market`).

    Serve-time fields (2.0 page payloads): the stored payload carries no time of its build, so a rebuild of the same data
    keeps its hash. The route adds `cutoff` and `built_at` (the row's envelope) at the top of a page payload and
    `freshness` (`Freshness`, from `built_at` and the request time) to its `status` block; the status page gets
    `freshness` at its top. Everything else is the stored payload verbatim (1.0 pages entirely).

    Horizons are N+k (decision 37): buy at the open of D, the first session after the as-of close; sell at the close
    of the k-th market session after D (weekends and holidays skipped); k in `config/strategies.yaml` `horizons`.

    Conventions:
    - `x-status: planned` marks an operation, schema or field whose data is not built yet. Planned operations
      answer 501 until built; planned fields are omitted from payloads until built.
    - `x-read-model` on a read operation names its `rm` table.
    - Numbers are as stored or as the existing dashboard code computes them. Returns, changes, shares and
      probabilities are fractions (0.018 = 1.8%). The scoring fields ending in `_pct` (is50_pct, is80_pct,
      qs_pct, width50_pct, width80_pct) are percent of price (x100); `atr_pct` is a fraction (ATR / close).
    - Missing values are `null`, never invented.
  license:
    name: Private research project
servers:
  - url: /
    description: The owner's private Vercel deployment (Vercel Authentication)
tags:
  - name: markets
  - name: stocks
  - name: record
  - name: portfolio
  - name: requests
  - name: internal
security:
  - vercelAuthentication: []
paths:
  /api/v1/markets:
    get:
      tags: [markets]
      operationId: listMarkets
      summary: Markets with their name, currency and freshness
      description: |
        Composed by the route from the `rm.status` page of each market (two keyed reads, each cached): the envelope
        has market `_all`, page_key `_`, the newest as_of, cutoff and built_at of the two, and the SHA-256 of the
        composed payload (also its ETag). A market whose status page is missing is left out; none at all is a 404.
      x-read-model: rm.status
      responses:
        '200':
          description: The markets list
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketListResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/markets/{market}/status:
    get:
      tags: [markets]
      operationId: getMarketStatus
      summary: Last daily and news run, session plan and freshness of one market
      x-read-model: rm.status
      parameters:
        - $ref: '#/components/parameters/Market'
      responses:
        '200':
          description: The status read model
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketStatusResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/markets/{market}/overview:
    get:
      tags: [markets]
      operationId: getMarketOverview
      summary: Regime, benchmark, cues, sector heatmap, signal tiers and the skill disclaimer
      x-read-model: rm.overview
      parameters:
        - $ref: '#/components/parameters/Market'
      responses:
        '200':
          description: The overview read model
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OverviewResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/markets/{market}/watchlist:
    get:
      tags: [markets]
      operationId: getWatchlist
      summary: One row per watchlist company (last session, model P(up), calls, ranges, quality)
      x-read-model: rm.watchlist
      parameters:
        - $ref: '#/components/parameters/Market'
      responses:
        '200':
          description: The watchlist read model
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WatchlistResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/markets/{market}/stocks/{ticker}:
    get:
      tags: [stocks]
      operationId: getStockDetail
      summary: Signal with model_prob and explanation, ranges, bull vs bear, news with status, events
      x-read-model: rm.stock
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/Ticker'
      responses:
        '200':
          description: The stock read model (page_key = ticker)
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockDetailResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/markets/{market}/stocks/{ticker}/bars:
    get:
      tags: [stocks]
      operationId: getStockBars
      summary: Split-adjusted daily OHLCV up to the as-of date, with the published ranges for the fan
      x-read-model: rm.bars
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/Ticker'
      responses:
        '200':
          description: The bars read model (page_key = ticker)
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BarsResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/markets/{market}/runs:
    get:
      tags: [markets]
      operationId: listRuns
      summary: Recent daily runs, news runs and read-model builds of one market
      x-status: planned
      x-read-model: rm.runs
      parameters:
        - $ref: '#/components/parameters/Market'
      responses:
        '200':
          description: The runs read model
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunListResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/company-requests:
    post:
      tags: [requests]
      operationId: createCompanyRequest
      summary: Ask for a company to be added to a watchlist (a human applies config changes)
      x-status: planned
      x-owner: WS2 (endpoint), WS4 (validation and import)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompanyRequest'}
      responses:
        '200':
          description: Accepted into the inbox (or the receipt of an earlier request with the same key)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboxReceipt'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/inbox/{inbox_id}:
    get:
      tags: [requests]
      operationId: getInboxEntry
      summary: The state of a submitted entry (pending, imported or rejected with reason)
      x-status: planned
      x-owner: WS2
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema: {type: string, maxLength: 64}
      responses:
        '200':
          description: The receipt with its current state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboxReceipt'}
        '404': {$ref: '#/components/responses/NotFound'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /api/v1/internal/revalidate:
    post:
      tags: [internal]
      operationId: revalidateReadModels
      summary: Called by the sync after a build commits; invalidates the cache tags of the changed keys
      x-owner: B4 (endpoint and caller)
      security:
        - revalidateSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevalidateRequest'}
      responses:
        '200':
          description: The tags invalidated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RevalidateResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Invalid'}

components:
  securitySchemes:
    vercelAuthentication:
      type: apiKey
      in: cookie
      name: _vercel_jwt
      description: Vercel Authentication (deployment protection) session cookie; OAuth only once the remote MCP endpoint goes live.
    revalidateSecret:
      type: apiKey
      in: header
      name: X-Revalidate-Secret
      description: REVALIDATE_SECRET from the environment; the caller also sends Vercel's protection-bypass header.
  headers:
    ETag:
      description: '"<payload_sha256>" of the read model; unchanged across builds that produce the same payload'
      schema: {type: string}
  parameters:
    Market:
      name: market
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Market'}
    Ticker:
      name: ticker
      in: path
      required: true
      description: A ticker of the market's watchlist (config/markets/<market>.yaml `tickers`)
      schema: {$ref: '#/components/schemas/Ticker'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key (UUID); becomes the inbox_id. A repeat returns the first receipt.
      schema: {type: string, minLength: 16, maxLength: 64, pattern: '^[A-Za-z0-9-]+$'}
  responses:
    NotFound:
      description: Unknown market, ticker or key
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unavailable:
      description: The warehouse is down, capped or the read model is missing; links point to the static reports
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotImplemented:
      description: A planned operation that is not built yet
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: The Idempotency-Key was used with a different body
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Invalid:
      description: The body failed validation
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Missing or wrong secret
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    # ---------- shared scalars ----------
    Market:
      type: string
      enum: [india, us]
    Ticker:
      type: string
      pattern: '^[A-Z0-9.&-]{1,20}$'
    Horizon:
      type: integer
      minimum: 1
      maximum: 5
      description: >-
        k of N+k: sell at the close of the k-th market session after D (decision 37); the list is config/strategies.yaml
        `horizons` (1-5 today). Legacy rows keep their own label (`horizon_label` legacy_cc, legacy_5d_d4)
    IsoDate:
      type: string
      format: date
    IsoTime:
      type: string
      format: date-time
    NullableNumber:
      type: [number, 'null']
    NewsStatus:
      type: string
      description: Verification status as of the cut-off (constants/verification.py STATUS_PRECEDENCE)
      enum: [contradicted, confirmed_primary, corroborated, rumour, promotional, single_source, unverified]
    LabelBasis:
      type: string
      description: Scoring basis (analytics/call_basis.py); the two are never pooled
      enum: [close_to_close, open_to_close]
    Problem:
      type: object
      description: RFC 9457 problem details
      required: [title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        fallback_links:
          type: array
          description: Static pages that work without the warehouse (reports/<market>/dashboard.html, the latest report)
          items: {type: string}

    # ---------- envelope ----------
    ReadModelMeta:
      type: object
      description: The metadata columns of every rm.<table> row (docs/ARCHITECTURE.md 4.1)
      required: [market, page_key, as_of, cutoff, built_at, schema_version, source_commit, payload_sha256]
      properties:
        market: {type: string, enum: [india, us, _all]}
        page_key: {type: string, description: '`_` for market-level pages, the ticker for per-stock pages'}
        as_of: {type: ['string', 'null'], format: date, description: Newest indicator snapshot stored by the cut-off}
        cutoff: {$ref: '#/components/schemas/IsoTime'}
        built_at: {$ref: '#/components/schemas/IsoTime'}
        schema_version: {type: string, description: info.version of this spec the payload conforms to}
        source_commit: {type: string, description: git commit of data/ the build read}
        payload_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    MarketListResponse:
      allOf:
        - $ref: '#/components/schemas/ReadModelMeta'
        - type: object
          required: [payload]
          properties:
            payload: {$ref: '#/components/schemas/MarketList'}
    MarketStatusResponse:
      allOf:
        - $ref: '#/components/schemas/ReadModelMeta'
        - type: object
          required: [payload]
          properties:
            payload: {$ref: '#/components/schemas/MarketStatus'}
    OverviewResponse:
      allOf:
        - $ref: '#/components/schemas/ReadModelMeta'
        - type: object
          required: [payload]
          properties:
            payload: {$ref: '#/components/schemas/Overview'}
    WatchlistResponse:
      allOf:
        - $ref: '#/components/schemas/ReadModelMeta'
        - type: object
          required: [payload]
          properties:
            payload: {$ref: '#/components/schemas/Watchlist'}
    StockDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ReadModelMeta'
        - type: object
          required: [payload]
          properties:
            payload: {$ref: '#/components/schemas/StockDetail'}
    BarsResponse:
      allOf:
        - $ref: '#/components/schemas/ReadModelMeta'
        - type: object
          required: [payload]
          properties:
            payload: {$ref: '#/components/schemas/Bars'}
    RunListResponse:
      allOf:
        - $ref: '#/components/schemas/ReadModelMeta'
        - type: object
          required: [payload]
          properties:
            payload: {$ref: '#/components/schemas/RunList'}

    # ---------- payloads ----------
    MarketList:
      type: object
      x-source: core/market_config.market_names + config/markets/*.yaml + rm.status
      required: [markets]
      properties:
        markets:
          type: array
          items:
            type: object
            required: [market, name, currency]
            properties:
              market: {$ref: '#/components/schemas/Market'}
              name: {type: string}
              currency: {type: string}
              symbol: {type: string, description: CURRENCY_SYMBOLS of the currency}
              as_of: {type: ['string', 'null'], format: date}
              last_daily_run_at: {type: ['string', 'null'], format: date-time}
              last_news_run_at: {type: ['string', 'null'], format: date-time}
              freshness: {$ref: '#/components/schemas/Freshness'}

    MarketStatus:
      x-source: warehouse/rm_platform.status_pages
      description: >-
        The status page (rm.status): the shared status block plus the 1.0 fields. Served with `freshness` at the top
        (serve mode status)
      allOf:
        - {$ref: '#/components/schemas/StatusBlock'}
        - type: object
          required: [market, name, as_of, session, last_daily_run, last_news_run]
          properties:
            plan:
              oneOf: [{$ref: '#/components/schemas/SessionPlan'}, {type: 'null'}]
            last_daily_run:
              type: ['object', 'null']
              description: The newest features snapshot stored by the cut-off (the daily run's indicator step)
              x-source: warehouse/rm_platform.last_daily_run
              properties:
                as_of_date: {$ref: '#/components/schemas/IsoDate'}
                computed_at: {$ref: '#/components/schemas/IsoTime'}
            last_news_run:
              oneOf:
                - {$ref: '#/components/schemas/NewsRun'}
                - {type: 'null'}
            last_build:
              x-status: planned
              x-owner: B4
              oneOf:
                - {$ref: '#/components/schemas/Build'}
                - {type: 'null'}

    # ---------- shared page blocks (2.0; warehouse/rm_common.py, docs/DATA_CATALOGUE.md) ----------
    PageHeader:
      type: object
      x-source: warehouse/rm_common.header
      description: >-
        The top of every 2.0 page payload: the market, its name and currency, the newest indicator snapshot date;
        `cutoff` and `built_at` are added when served (the row's envelope)
      required: [market, name, currency, as_of]
      properties:
        market: {$ref: '#/components/schemas/Market'}
        name: {type: string, description: 'The market''s name, e.g. "India (NSE)"'}
        currency: {type: string, enum: [INR, USD]}
        as_of: {type: ['string', 'null'], format: date}
        cutoff: {type: string, format: date-time, description: Serve-time (the envelope's cutoff)}
        built_at: {type: string, format: date-time, description: Serve-time (the envelope's built_at)}
    HorizonChoice:
      type: object
      x-source: warehouse/rm_common.horizons
      required: [horizons, default_horizon]
      properties:
        horizons:
          type: array
          items: {$ref: '#/components/schemas/Horizon'}
        default_horizon:
          description: The horizon a page opens on (N+1, decision 39), or `all` on pages that pool horizons
          oneOf: [{$ref: '#/components/schemas/Horizon'}, {type: string, const: all}]
    Freshness:
      type: object
      description: Serve-time (web/lib/data/serve.ts) from the row's built_at and the request time
      required: [state, built_at, age_minutes]
      properties:
        state: {type: string, enum: [fresh, stale, unknown], description: 'stale after 480 minutes (FRESH_MINUTES)'}
        built_at: {type: ['string', 'null'], format: date-time}
        age_minutes: {type: ['integer', 'null']}
    SessionStatus:
      type: object
      x-source: pipeline/market_status.status
      description: pipeline/market_status.status evaluated at the build's cut-off (not at request time)
      required: [local_time, trading_day, session_date, previous_session, calendar_covered, session_open_utc,
                 session_close_utc, in_session, late_run]
      properties:
        local_time: {type: string}
        trading_day: {type: boolean}
        session_date: {$ref: '#/components/schemas/IsoDate'}
        previous_session: {$ref: '#/components/schemas/IsoDate'}
        calendar_covered: {type: boolean}
        session_open_utc: {$ref: '#/components/schemas/IsoTime'}
        session_close_utc: {$ref: '#/components/schemas/IsoTime'}
        in_session: {type: boolean}
        late_run: {type: boolean}
    LevelBlock:
      type: object
      x-source: warehouse/rm_common.level_block
      description: A market-level symbol (role benchmark or vol_index) at its last stored close
      required: [symbol, name, close, close_date, change_pct, change_5d_pct]
      properties:
        symbol: {type: string}
        name: {type: string}
        close: {$ref: '#/components/schemas/NullableNumber'}
        close_date: {$ref: '#/components/schemas/IsoDate'}
        change_pct: {type: ['number', 'null'], description: '% from the previous close'}
        change_5d_pct: {type: ['number', 'null'], description: '% from the close 5 sessions earlier'}
    RunMark:
      type: object
      required: [at, ok]
      properties:
        at: {type: ['string', 'null'], format: date-time}
        ok: {type: ['boolean', 'null']}
        next_at: {type: ['string', 'null'], format: date-time, description: 'post_close: the next scheduled run (SPEC section 7)'}
        new_items: {type: ['integer', 'null'], description: 'news: items the run stored'}
    Runs:
      type: object
      x-source: warehouse/rm_common.runs
      description: >-
        The newest runs stored by the cut-off: pre-open (newest features snapshot), the intraday checks of the session
        being predicted (intraday_runs, market-closed rows left out), post-close (newest settlement or end-of-day
        analysis) and news (news_runs)
      required: [pre_open, intraday, post_close, news]
      properties:
        pre_open: {$ref: '#/components/schemas/RunMark'}
        intraday:
          type: array
          items: {$ref: '#/components/schemas/RunMark'}
        post_close: {$ref: '#/components/schemas/RunMark'}
        news: {$ref: '#/components/schemas/RunMark'}
    StatusBlock:
      type: object
      x-source: warehouse/rm_common.status_block
      description: The Market status record every 2.0 page carries as `status`; `freshness` is added when served
      required: [market, name, currency, as_of, session, regime, benchmark, vol_index, runs, paper_label]
      properties:
        market: {$ref: '#/components/schemas/Market'}
        name: {type: string}
        currency: {type: string, enum: [INR, USD]}
        as_of: {type: ['string', 'null'], format: date}
        session: {$ref: '#/components/schemas/SessionStatus'}
        regime: {type: ['string', 'null'], description: The newest regime code stored by the cut-off}
        benchmark:
          oneOf: [{$ref: '#/components/schemas/LevelBlock'}, {type: 'null'}]
        vol_index:
          oneOf: [{$ref: '#/components/schemas/LevelBlock'}, {type: 'null'}]
        runs: {$ref: '#/components/schemas/Runs'}
        paper_label: {type: string, description: '"Paper only — no proven edge yet" until the weekly review''s model_skill'}
        freshness: {$ref: '#/components/schemas/Freshness'}
    GoLive:
      type: object
      x-source: warehouse/rm_common.go_live
      description: >-
        The reference strategy's (rule.model_news.v1) position against the go-live bar: its accuracy row, all
        horizons, forward basis (lab/scoreboard.go_live); with no settled trade yet: not proven, 0 months, 300
        trades needed, baseline comparison null
      required: [proven, months_forward, trades_needed, beats_best_baseline]
      properties:
        proven: {type: boolean}
        months_forward: {type: number}
        trades_needed: {type: integer}
        beats_best_baseline: {type: ['boolean', 'null']}
    StrategyEntry:
      type: object
      x-source: warehouse/rm_common.strategies
      description: >-
        A registry entry (config/strategies.yaml) with `live` (live_from set and on or before the session being
        predicted) and `settled_trades` (its settled accuracy-view trades stored by the cut-off). A page carries the
        fields its mockup lists
      required: [id, family, name]
      properties:
        id: {type: string}
        family: {type: string, enum: [rule, baseline, ai]}
        name: {type: string}
        description: {type: string}
        compared_to: {type: ['string', 'null']}
        differs_in: {type: ['string', 'null']}
        parameters: {type: object}
        threshold: {$ref: '#/components/schemas/NullableNumber'}
        horizons:
          type: array
          items: {$ref: '#/components/schemas/Horizon'}
        live_from: {type: ['string', 'null'], format: date}
        live: {type: boolean}
        settled_trades: {type: integer}
    StrategyMap:
      type: object
      description: Strategy id -> StrategyEntry
      additionalProperties: {$ref: '#/components/schemas/StrategyEntry'}
    BuySplit:
      type: object
      required: [buy, of]
      properties:
