# B13: the Paper portfolios page's write (mcp/tools.yaml add_paper_trade)
PaperTradeSubmission:
  type: object
  description: The add-trade form's body (web/lib/data/paper-trades.ts; validated again by the tool layer and by portfolio.py import-inbox)
  additionalProperties: false
  required: [ticker, side, quantity, trade_date, price_basis]
  properties:
    ticker: {$ref: '#/components/schemas/Ticker'}
    side: {type: string, enum: [buy, sell]}
    quantity: {type: number, exclusiveMinimum: 0, description: Whole shares in India; fractional allowed in the US}
    trade_date: {$ref: '#/components/schemas/IsoDate'}
    price_basis: {type: string, enum: [open, close, manual], description: 'A stored bar''s open or close, or a manual price inside that day''s range'}
    price: {type: number, description: Only with price_basis manual}
    note: {type: string, maxLength: 200}
PaperTradeReceipt:
  type: object
  description: The tool layer's outcome as the route returns it (web/lib/data/paper-trades.ts receipt; ToolOutcome of web/lib/tools/types.ts)
  required: [command_id, result, refusal_code, message, inbox_id, record_ids, budget_left, paper]
  properties:
    command_id: {type: string}
    result: {type: string, enum: [pending, accepted, duplicate, refused, failed]}
    refusal_code: {type: ['string', 'null']}
    message: {type: ['string', 'null']}
    inbox_id: {type: ['string', 'null'], description: The Idempotency-Key, once the request is in the inbox}
    record_ids:
      type: array
      items: {type: string}
    budget_left: {type: ['integer', 'null']}
    paper: {type: boolean, const: true}
PaperPortfoliosResponse:
  allOf:
    - $ref: '#/components/schemas/ReadModelMeta'
    - type: object
      required: [payload]
      properties:
        payload: {$ref: '#/components/schemas/PaperPortfolios'}
PaperPortfolios:
  x-source: warehouse/rm_portfolio.portfolio_pages
  description: >-
    One market's Paper portfolios page as of the cut-off: the head-to-head portfolios (scoreboard rows of scopes
    strategy and pick_rule, forward basis), every open paper trade (B4's open-trade derivation) and the rows of the
    latest intraday trade check (B12's), and the owner's own paper trades and FIFO positions with the EUR view of US
    positions, and every paper trade in one place (all_trades). Research only: a paper trade is a record, never an
    order. Paper only.
  allOf:
    - $ref: '#/components/schemas/PageHeader'
    - $ref: '#/components/schemas/HorizonChoice'
    - type: object
      required: [status, go_live, strategies, companies, h2h_rows, open_trades, trade_checks, owner, all_trades]
      properties:
        status: {$ref: '#/components/schemas/StatusBlock'}
        go_live: {$ref: '#/components/schemas/GoLive'}
        strategies: {$ref: '#/components/schemas/StrategyMap'}
        companies:
          type: array
          items: {$ref: '#/components/schemas/CompanyBrief'}
        h2h_rows:
          type: array
          description: Scoreboard rows of the head-to-head view, scopes strategy and pick_rule (without ticker, regime, median_reached_session and go_live)
          items: {$ref: '#/components/schemas/H2hPortfolioRow'}
        open_trades:
          type: array
          items: {$ref: '#/components/schemas/OpenTrade'}
        trade_checks:
          type: array
          items: {$ref: '#/components/schemas/TradeCheck'}
        owner: {$ref: '#/components/schemas/OwnerPortfolio'}
        all_trades: {$ref: '#/components/schemas/AllTrades'}
H2hPortfolioRow:
  type: object
  x-source: warehouse/rm_portfolio.h2h_rows
  required: [scope, market, view, basis, strategy_id, family, pick_rule, horizon_days, trades, net_pnl, luck_test, your_cost]
  properties:
    scope: {type: string, enum: [strategy, pick_rule]}
    market: {$ref: '#/components/schemas/Market'}
    view: {$ref: '#/components/schemas/ScoreView'}
    basis: {$ref: '#/components/schemas/ScoreBasis'}
    strategy_id: {type: ['string', 'null']}
    family: {type: ['string', 'null'], enum: [rule, baseline, ai, null]}
    pick_rule: {type: ['string', 'null']}
    horizon_days: {$ref: '#/components/schemas/HorizonOrAll'}
    trades: {type: integer}
    net_pnl: {$ref: '#/components/schemas/NullableNumber'}
    mean_return_pct: {$ref: '#/components/schemas/NullableNumber'}
    win_rate: {$ref: '#/components/schemas/NullableNumber'}
    target_reached_rate: {$ref: '#/components/schemas/NullableNumber'}
    avg_target_error_pct: {$ref: '#/components/schemas/NullableNumber'}
    range_hit_rate: {$ref: '#/components/schemas/NullableNumber'}
    worst_losing_streak: {type: ['integer', 'null']}
    max_drawdown: {$ref: '#/components/schemas/NullableNumber'}
    sample_badge: {type: ['string', 'null']}
    first_entry: {type: ['string', 'null'], format: date}
    last_exit: {type: ['string', 'null'], format: date}
    as_of: {type: ['string', 'null'], format: date}
    luck_test:
      oneOf: [{$ref: '#/components/schemas/LuckTest'}, {type: 'null'}]
    your_cost:
      oneOf: [{$ref: '#/components/schemas/YourCostView'}, {type: 'null'}]
OwnerPortfolio:
  type: object
  x-source: warehouse/rm_portfolio.owner
  required: [trades, positions, default_amount, paper]
  properties:
    trades:
      type: array
      items: {$ref: '#/components/schemas/OwnerTrade'}
    positions:
      type: array
      items: {$ref: '#/components/schemas/OwnerPosition'}
    default_amount: {type: number, description: 'The default paper amount per trade (₹1,00,000 / $1,000)'}
    paper: {type: boolean, const: true}
OwnerTrade:
  type: object
  x-source: warehouse/rm_portfolio.owner_trades
  description: One stored row of the owner's paper trades (kind portfolio_trades; active, cancel or correcting rows), without the channel identity
  required: [id, market, ticker, side, quantity, price_basis, trade_date, source, entered_at]
  properties:
    id: {type: string}
    market: {$ref: '#/components/schemas/Market'}
    ticker: {$ref: '#/components/schemas/Ticker'}
    side: {type: string}
    quantity: {$ref: '#/components/schemas/NullableNumber'}
    price: {$ref: '#/components/schemas/NullableNumber'}
    price_basis: {type: ['string', 'null']}
    trade_date: {type: ['string', 'null'], format: date}
    source: {type: string}
    idempotency_key: {type: ['string', 'null']}
    entered_at: {$ref: '#/components/schemas/IsoTime'}
    note: {type: ['string', 'null']}
    supersedes: {type: ['string', 'null']}
OwnerPosition:
  type: object
  x-source: warehouse/rm_portfolio.owner_positions
  description: An open position (FIFO), marked to the latest stored close by the cut-off, before costs
  required: [market, ticker, quantity, avg_price, last_close, last_close_date, currency, cost, value, pnl, pnl_pct, eur_view]
  properties:
    market: {$ref: '#/components/schemas/Market'}
    ticker: {$ref: '#/components/schemas/Ticker'}
    quantity: {type: number}
    avg_price: {type: number}
    last_close: {$ref: '#/components/schemas/NullableNumber'}
    last_close_date: {type: ['string', 'null'], format: date}
    currency: {type: string, enum: [INR, USD]}
    cost: {type: number}
    value: {$ref: '#/components/schemas/NullableNumber'}
    pnl: {$ref: '#/components/schemas/NullableNumber'}
    pnl_pct: {$ref: '#/components/schemas/NullableNumber'}
    eur_view:
      oneOf: [{$ref: '#/components/schemas/EurView'}, {type: 'null'}]
EurView:
  type: object
  x-source: portfolio/eur_view.eur_view
  description: The EUR view of a US position (rate change and BUX's FX fee, F1.11)
  required: [ticker, quantity, mark_date, eurusd_at_buy, eurusd_now, fx_fee_rate, cost_usd, value_usd, cost_eur, value_eur, fx_effect_eur, pnl_eur]
  properties:
    ticker: {$ref: '#/components/schemas/Ticker'}
    quantity: {type: number}
    mark_date: {$ref: '#/components/schemas/IsoDate'}
    eurusd_at_buy: {type: number}
    eurusd_now: {type: number}
    fx_fee_rate: {type: number}
    cost_usd: {type: number}
    value_usd: {type: number}
    cost_eur: {type: number}
    value_eur: {type: number}
    fx_effect_eur: {type: number}
    pnl_eur: {type: number}
    note: {type: ['string', 'null']}
AllTrades:
  type: object
  x-source: warehouse/all_trades.all_trades
  description: >-
    Every paper trade in one place as of the cut-off (owner request 2026-10-12). Scope all = the accuracy view (every
    strategy), head_to_head = the head-to-head view (never pooled with all: two views of the same predictions), mine =
    the owner's own trades (WS4's FIFO ledger, your cost only). Listed: every open trade and the closed or not-entered
    trades whose exit is in the window. Win / loss on the net P&L after market cost (mine: after your cost).
  required: [window, summary, trades]
  properties:
    window:
      type: object
      required: [sessions, from, to]
      properties:
        sessions: {type: integer}
        from: {type: ['string', 'null'], format: date}
        to: {type: ['string', 'null'], format: date}
    summary:
      type: array
      description: Per scope and family, period to_date and window; not_entered trades are never counted
      items: {$ref: '#/components/schemas/AllTradesSummaryRow'}
    trades:
      type: array
      description: Open trades first, then by exit (or entry) date newest first, then by id
      items: {$ref: '#/components/schemas/AllTradesRow'}
AllTradesSummaryRow:
  type: object
  required: [scope, family, period, open, closed, wins, losses, flat, win_rate, net_pnl_market, net_pnl_your,
             pnl_your_missing, currency]
  properties:
    scope: {type: string, enum: [all, head_to_head, mine]}
    family: {type: string, enum: [all, rule, ai, baseline, mine]}
    period: {type: string, enum: [to_date, window]}
    open: {type: integer}
    closed: {type: integer}
    wins: {type: integer}
    losses: {type: integer}
    flat: {type: integer}
    win_rate: {type: ['number', 'null'], description: Wins as a percent of closed trades; null without any}
    net_pnl_market: {type: ['number', 'null'], description: Sum over closed trades after market cost (null for mine)}
    net_pnl_your: {type: ['number', 'null'], description: Sum over closed trades with a your-cost figure}
    pnl_your_missing: {type: integer, description: Closed trades without a your-cost figure yet}
    currency: {type: ['string', 'null']}
AllTradesRow:
  type: object
  required: [id, scope, view, strategy_id, family, pick_rule, side, ticker, horizon_days, entry_date, exit_date, state,
             not_entered_reason, outcome, entry_price, entry_price_source, exit_or_last_price, last_price_source,
             last_price_date, last_price_time, price_pending, quantity, amount, currency, unrealised_pnl,
             unrealised_pct, pnl_market, pnl_your, return_pct_market, return_pct_your, settled_at, paper]
  properties:
    id: {type: string, description: The trade id (strategy trades) or the portfolio trade id (mine)}
    scope: {type: string, enum: [all, head_to_head, mine]}
    view: {type: ['string', 'null'], enum: [accuracy, head_to_head, null]}
    strategy_id: {type: ['string', 'null']}
    family: {type: string, enum: [rule, ai, baseline, mine]}
    pick_rule: {type: ['string', 'null']}
    side: {type: ['string', 'null'], enum: [buy, sell, null], description: 'Mine only: buy = an open lot, sell = a closed sale over the FIFO lots it closes'}
    ticker: {$ref: '#/components/schemas/Ticker'}
    horizon_days: {type: ['integer', 'null']}
    entry_date: {type: ['string', 'null'], format: date}
    exit_date: {type: ['string', 'null'], format: date, description: The actual exit on closed rows; the planned exit on open rows}
    state: {type: string, enum: [open, closed, not_entered]}
    not_entered_reason: {type: ['string', 'null'], enum: [no_entry, skipped_price_above_amount, null]}
    outcome: {type: ['string', 'null'], enum: [win, loss, flat, null], description: Closed rows only}
    entry_price: {type: ['number', 'null']}
    entry_price_source: {type: ['string', 'null'], enum: [daily_bar, intraday_check, null]}
    exit_or_last_price: {type: ['number', 'null'], description: The exit price (closed) or the last price (open)}
    last_price_source: {type: ['string', 'null'], enum: [daily_close, intraday_check, null]}
    last_price_date: {type: ['string', 'null'], format: date}
    last_price_time: {type: ['string', 'null'], format: date-time, description: The intraday check's time; null for a daily close}
    price_pending: {type: boolean, description: Entered at D's open but no price stored or checked yet}
    quantity: {type: ['number', 'null']}
    amount: {type: ['number', 'null']}
    currency: {type: ['string', 'null']}
    unrealised_pnl: {type: ['number', 'null'], description: Open rows only, before costs}
    unrealised_pct: {type: ['number', 'null'], description: Open rows only, before costs}
    pnl_market: {type: ['number', 'null'], description: Closed strategy rows, net after market cost; null for mine}
    pnl_your: {type: ['number', 'null'], description: Closed rows, net after your cost}
    return_pct_market: {type: ['number', 'null']}
    return_pct_your: {type: ['number', 'null']}
    settled_at: {type: ['string', 'null'], format: date-time}
    paper: {type: boolean, const: true}
