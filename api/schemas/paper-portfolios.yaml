# B13: the Paper portfolios page's write (mcp/tools.yaml add_paper_trade)
PaperTradeSubmission:
  type: object
  description: The add-trade form's body (web/lib/data/paper-trades.ts; validated again by the tool layer and by portfolio.py import-inbox)
  additionalProperties: false
  required: [ticker, side, quantity, trade_date, price_basis]
  properties:
    ticker: {$ref: '#/components/schemas/Ticker'}
    side: {type: string, enum: [buy, sell]}
    quantity: {type: number, exclusiveMinimum: 0, description: Whole shares in India; fractional allowed in the US}
    trade_date: {$ref: '#/components/schemas/IsoDate'}
    price_basis: {type: string, enum: [open, close, manual], description: 'A stored bar''s open or close, or a manual price inside that day''s range'}
    price: {type: number, description: Only with price_basis manual}
    note: {type: string, maxLength: 200}
PaperTradeReceipt:
  type: object
  description: The tool layer's outcome as the route returns it (web/lib/data/paper-trades.ts receipt; ToolOutcome of web/lib/tools/types.ts)
  required: [command_id, result, refusal_code, message, inbox_id, record_ids, budget_left, paper]
  properties:
    command_id: {type: string}
    result: {type: string, enum: [pending, accepted, duplicate, refused, failed]}
    refusal_code: {type: ['string', 'null']}
    message: {type: ['string', 'null']}
    inbox_id: {type: ['string', 'null'], description: The Idempotency-Key, once the request is in the inbox}
    record_ids:
      type: array
      items: {type: string}
    budget_left: {type: ['integer', 'null']}
    paper: {type: boolean, const: true}
PaperPortfoliosResponse:
  allOf:
    - $ref: '#/components/schemas/ReadModelMeta'
    - type: object
      required: [payload]
      properties:
        payload: {$ref: '#/components/schemas/PaperPortfolios'}
PaperPortfoliosTable:
  description: "An rm.portfolio page: `_` is the Paper portfolios page (PaperPortfolios), `trades:<D>` one accuracy-view entry session (PortfolioSession), `open:<k>` the open trades of hold k (PortfolioHold), `finished:<D>` the trades that exited on session D (PortfolioFinished)"
  anyOf:
    - {$ref: '#/components/schemas/PaperPortfolios'}
    - {$ref: '#/components/schemas/PortfolioSession'}
    - {$ref: '#/components/schemas/PortfolioHold'}
    - {$ref: '#/components/schemas/PortfolioFinished'}
PortfolioHoldResponse:
  allOf:
    - $ref: '#/components/schemas/ReadModelMeta'
    - type: object
      required: [payload]
      properties:
        payload: {$ref: '#/components/schemas/PortfolioHold'}
PortfolioHold:
  type: object
  x-source: warehouse/trade_pages.open_pages
  description: >-
    Every open accuracy-view paper trade of one hold k (bought at the open of D, sells at the close of the k-th session
    after D), whatever its entry session, as of the cut-off, with the hold's split (rm.portfolio page key `open:<k>`;
    UX3). Paper only.
  required: [market, as_of, horizon_days, summary, trades, paper]
  properties:
    market: {$ref: '#/components/schemas/Market'}
    as_of: {type: ['string', 'null'], format: date}
    horizon_days: {type: integer, minimum: 1}
    summary: {$ref: '#/components/schemas/OpenHold'}
    trades:
      type: array
      description: By planned exit, then by id
      items: {$ref: '#/components/schemas/AllTradesRow'}
    paper: {type: boolean, const: true}
PortfolioFinishedResponse:
  allOf:
    - $ref: '#/components/schemas/ReadModelMeta'
    - type: object
      required: [payload]
      properties:
        payload: {$ref: '#/components/schemas/PortfolioFinished'}
PortfolioFinished:
  type: object
  x-source: warehouse/trade_pages.finished_pages
  description: >-
    Every accuracy-view paper trade that exited on session D (closed, or not entered with D as its planned exit), as of
    the cut-off, with the session's counts per family; the last 10 sessions (rm.portfolio page key `finished:<D>`;
    UX3). Paper only.
  required: [market, as_of, session_date, summary, trades, paper]
  properties:
    market: {$ref: '#/components/schemas/Market'}
    as_of: {type: ['string', 'null'], format: date}
    session_date: {$ref: '#/components/schemas/IsoDate'}
    summary: {$ref: '#/components/schemas/FinishedSession'}
    trades:
      type: array
      description: By exit date newest first, then by id
      items: {$ref: '#/components/schemas/AllTradesRow'}
    paper: {type: boolean, const: true}
OpenSplit:
  type: object
  description: >-
    Open trades against their prediction, on the price since the buy (a "down" prediction flips it): going_with moved
    the predicted way, going_against did not, pending has no price yet. Money before costs.
  required: [open, going_with, going_against, pending, flagged, profit, loss, unrealised_pnl]
  properties:
    open: {type: integer}
    going_with: {type: integer}
    going_against: {type: integer}
    pending: {type: integer}
    flagged: {type: integer, description: Open trades whose latest intraday check is flagged}
    profit: {type: ['number', 'null'], description: Sum of the open trades with a gain so far}
    loss: {type: ['number', 'null'], description: Sum of the open trades with a loss so far}
    unrealised_pnl: {type: ['number', 'null']}
OpenHold:
  description: One hold's open accuracy-view trades, with the split per family (rule, ai, baseline; never pooled with head-to-head)
  allOf:
    - $ref: '#/components/schemas/OpenSplit'
    - type: object
      required: [horizon_days, exit_dates, by_family]
      properties:
        horizon_days: {type: integer, minimum: 1}
        exit_dates:
          type: array
          items: {$ref: '#/components/schemas/IsoDate'}
        by_family:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/OpenSplit'
              - type: object
                required: [family]
                properties:
                  family: {type: string, enum: [rule, ai, baseline]}
FinishedCounts:
  type: object
  required: [closed, wins, losses, flat, net_pnl_market, net_pnl_your]
  properties:
    closed: {type: integer}
    wins: {type: integer}
    losses: {type: integer}
    flat: {type: integer}
    net_pnl_market: {type: ['number', 'null']}
    net_pnl_your: {type: ['number', 'null']}
FinishedSession:
  description: One exit session's accuracy-view trades (not entered ones counted apart, never in the others), per family
  allOf:
    - $ref: '#/components/schemas/FinishedCounts'
    - type: object
      required: [session_date, not_entered, by_family]
      properties:
        session_date: {$ref: '#/components/schemas/IsoDate'}
        not_entered: {type: integer}
        by_family:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/FinishedCounts'
              - type: object
                required: [family]
                properties:
                  family: {type: string, enum: [rule, ai, baseline]}
TradeWhy:
  type: object
  x-source: warehouse/trade_why
  description: >-
    Why a strategy trade is going the way it is. Open (source intraday_check): its ticker's latest intraday check by
    the cut-off on or after the entry session - the move since that session's open, the benchmark's move, the sector's
    move, the market's pull on the stock (benchmark x beta), the stock's beta and its own move (residual), all in
    percent, and the deviation-explainer's note when one was
    written. Closed (source settlement): B2's automatic reason (move, market, sector, news and company parts, main
    reason code) and the newest end-of-day AI reason.
  required: [source, check_at, session_date, move_pct, market_pct, market_pull_pct, sector_pct, own_pct, news_pct,
             company_pct, beta, sector_source, reason_code, note, ai_reason]
  properties:
    source: {type: string, enum: [intraday_check, settlement]}
    check_at: {type: ['string', 'null'], format: date-time}
    session_date: {type: ['string', 'null'], format: date}
    move_pct: {type: ['number', 'null']}
    market_pct: {type: ['number', 'null']}
    market_pull_pct: {type: ['number', 'null'], description: "Open - the market's part of the move: the benchmark's move times the stock's beta"}
    sector_pct: {type: ['number', 'null']}
    own_pct: {type: ['number', 'null']}
    news_pct: {type: ['number', 'null']}
    company_pct: {type: ['number', 'null']}
    beta: {type: ['number', 'null']}
    sector_source: {type: ['string', 'null']}
    reason_code: {type: ['string', 'null']}
    note: {type: ['string', 'null']}
    ai_reason: {type: ['string', 'null']}
PortfolioLearning:
  type: object
  x-source: warehouse/trade_why.learning
  description: >-
    What the system learns, as stored by the cut-off: the reflector's lessons (only the AI forecaster, read_by, reads
    them, from the next run), the newest weekly research review (it changes nothing without the owner's approval) and
    the next one's time, and the rule strategies on their newest session (best chance of a rise against their bar).
  required: [lessons, review, next_review_at, rule_today]
  properties:
    lessons:
      type: object
      required: [count, newest, read_by]
      properties:
        count: {type: integer}
        read_by: {type: string}
        newest:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, prediction_id, ticker, horizon_days, lesson, written_at]
              properties:
                id: {type: string}
                prediction_id: {type: string}
                ticker: {type: string}
                horizon_days: {type: ['integer', 'null']}
                lesson: {type: ['string', 'null']}
                written_at: {type: ['string', 'null'], format: date-time}
    review:
      oneOf:
        - type: 'null'
        - type: object
          required: [id, iso_week, written_at, first_finding, findings, proposals]
          properties:
            id: {type: string}
            iso_week: {type: ['string', 'null']}
            written_at: {type: ['string', 'null'], format: date-time}
            first_finding: {type: ['string', 'null']}
            findings: {type: integer}
            proposals: {type: integer}
    next_review_at: {type: string, format: date-time}
    rule_today:
      oneOf:
        - type: 'null'
        - type: object
          required: [session_date, predictions, qualifying, best_prob_up, bar]
          properties:
            session_date: {$ref: '#/components/schemas/IsoDate'}
            predictions: {type: integer}
            qualifying: {type: integer}
            best_prob_up: {type: ['number', 'null']}
            bar: {type: ['number', 'null']}
PortfolioSessionResponse:
  allOf:
    - $ref: '#/components/schemas/ReadModelMeta'
    - type: object
      required: [payload]
      properties:
        payload: {$ref: '#/components/schemas/PortfolioSession'}
PortfolioSession:
  type: object
  x-source: warehouse/all_trades.session_pages
  description: >-
    Every accuracy-view paper trade entered on one session D (open, closed or not entered) as of the cut-off, with the
    session's counts; one page per entry session of the last 60 (rm.portfolio page key `trades:<D>`). Paper only.
  required: [market, as_of, session_date, summary, trades, paper]
  properties:
    market: {$ref: '#/components/schemas/Market'}
    as_of: {type: ['string', 'null'], format: date}
    session_date: {$ref: '#/components/schemas/IsoDate'}
    summary: {$ref: '#/components/schemas/AllTradesSession'}
    trades:
      type: array
      description: Open first, then by exit (or entry) date newest first, then by id
      items: {$ref: '#/components/schemas/AllTradesRow'}
    paper: {type: boolean, const: true}
PaperPortfolios:
  x-source: warehouse/rm_portfolio.portfolio_pages
  description: >-
    One market's Paper portfolios page as of the cut-off: the head-to-head portfolios (scoreboard rows of scopes
    strategy and pick_rule, forward basis), the open head-to-head trades (B4's open-trade derivation) and their rows of
    the latest intraday trade check (B12's), and the owner's own paper trades and FIFO positions with the EUR view of US
    positions, and every paper trade in one place (all_trades). Research only: a paper trade is a record, never an
    order. Paper only.
  allOf:
    - $ref: '#/components/schemas/PageHeader'
    - $ref: '#/components/schemas/HorizonChoice'
    - type: object
      required: [status, go_live, strategies, companies, h2h_rows, open_trades, trade_checks, owner, all_trades]
      properties:
        status: {$ref: '#/components/schemas/StatusBlock'}
        go_live: {$ref: '#/components/schemas/GoLive'}
        strategies: {$ref: '#/components/schemas/StrategyMap'}
        companies:
          type: array
          items: {$ref: '#/components/schemas/CompanyBrief'}
        h2h_rows:
          type: array
          description: Scoreboard rows of the head-to-head view, scopes strategy and pick_rule (without ticker, regime, median_reached_session and go_live)
          items: {$ref: '#/components/schemas/H2hPortfolioRow'}
        open_trades:
          type: array
          items: {$ref: '#/components/schemas/OpenTrade'}
        trade_checks:
          type: array
          items: {$ref: '#/components/schemas/TradeCheck'}
        owner: {$ref: '#/components/schemas/OwnerPortfolio'}
        all_trades: {$ref: '#/components/schemas/AllTrades'}
H2hPortfolioRow:
  type: object
  x-source: warehouse/rm_portfolio.h2h_rows
  required: [scope, market, view, basis, strategy_id, family, pick_rule, horizon_days, trades, net_pnl, luck_test, your_cost]
  properties:
    scope: {type: string, enum: [strategy, pick_rule]}
    market: {$ref: '#/components/schemas/Market'}
    view: {$ref: '#/components/schemas/ScoreView'}
    basis: {$ref: '#/components/schemas/ScoreBasis'}
    strategy_id: {type: ['string', 'null']}
    family: {type: ['string', 'null'], enum: [rule, baseline, ai, null]}
    pick_rule: {type: ['string', 'null']}
    horizon_days: {$ref: '#/components/schemas/HorizonOrAll'}
    trades: {type: integer}
    net_pnl: {$ref: '#/components/schemas/NullableNumber'}
    mean_return_pct: {$ref: '#/components/schemas/NullableNumber'}
    win_rate: {$ref: '#/components/schemas/NullableNumber'}
    target_reached_rate: {$ref: '#/components/schemas/NullableNumber'}
    avg_target_error_pct: {$ref: '#/components/schemas/NullableNumber'}
    range_hit_rate: {$ref: '#/components/schemas/NullableNumber'}
    worst_losing_streak: {type: ['integer', 'null']}
    max_drawdown: {$ref: '#/components/schemas/NullableNumber'}
    sample_badge: {type: ['string', 'null']}
    first_entry: {type: ['string', 'null'], format: date}
    last_exit: {type: ['string', 'null'], format: date}
    as_of: {type: ['string', 'null'], format: date}
    luck_test:
      oneOf: [{$ref: '#/components/schemas/LuckTest'}, {type: 'null'}]
    your_cost:
      oneOf: [{$ref: '#/components/schemas/YourCostView'}, {type: 'null'}]
OwnerPortfolio:
  type: object
  x-source: warehouse/rm_portfolio.owner
  required: [trades, positions, default_amount, paper]
  properties:
    trades:
      type: array
      items: {$ref: '#/components/schemas/OwnerTrade'}
    positions:
      type: array
      items: {$ref: '#/components/schemas/OwnerPosition'}
    default_amount: {type: number, description: 'The default paper amount per trade (₹1,00,000 / $1,000)'}
    paper: {type: boolean, const: true}
OwnerTrade:
  type: object
  x-source: warehouse/rm_portfolio.owner_trades
  description: One stored row of the owner's paper trades (kind portfolio_trades; active, cancel or correcting rows), without the channel identity
  required: [id, market, ticker, side, quantity, price_basis, trade_date, source, entered_at]
  properties:
    id: {type: string}
    market: {$ref: '#/components/schemas/Market'}
    ticker: {$ref: '#/components/schemas/Ticker'}
    side: {type: string}
    quantity: {$ref: '#/components/schemas/NullableNumber'}
    price: {$ref: '#/components/schemas/NullableNumber'}
    price_basis: {type: ['string', 'null']}
    trade_date: {type: ['string', 'null'], format: date}
    source: {type: string}
    idempotency_key: {type: ['string', 'null']}
    entered_at: {$ref: '#/components/schemas/IsoTime'}
    note: {type: ['string', 'null']}
    supersedes: {type: ['string', 'null']}
OwnerPosition:
  type: object
  x-source: warehouse/rm_portfolio.owner_positions
  description: An open position (FIFO), marked to the latest stored close by the cut-off, before costs
  required: [market, ticker, quantity, avg_price, last_close, last_close_date, currency, cost, value, pnl, pnl_pct, eur_view]
  properties:
    market: {$ref: '#/components/schemas/Market'}
    ticker: {$ref: '#/components/schemas/Ticker'}
    quantity: {type: number}
    avg_price: {type: number}
    last_close: {$ref: '#/components/schemas/NullableNumber'}
    last_close_date: {type: ['string', 'null'], format: date}
    currency: {type: string, enum: [INR, USD]}
    cost: {type: number}
    value: {$ref: '#/components/schemas/NullableNumber'}
    pnl: {$ref: '#/components/schemas/NullableNumber'}
    pnl_pct: {$ref: '#/components/schemas/NullableNumber'}
    eur_view:
      oneOf: [{$ref: '#/components/schemas/EurView'}, {type: 'null'}]
EurView:
  type: object
  x-source: portfolio/eur_view.eur_view
  description: The EUR view of a US position (rate change and BUX's FX fee, F1.11)
  required: [ticker, quantity, mark_date, eurusd_at_buy, eurusd_now, fx_fee_rate, cost_usd, value_usd, cost_eur, value_eur, fx_effect_eur, pnl_eur]
  properties:
    ticker: {$ref: '#/components/schemas/Ticker'}
    quantity: {type: number}
    mark_date: {$ref: '#/components/schemas/IsoDate'}
    eurusd_at_buy: {type: number}
    eurusd_now: {type: number}
    fx_fee_rate: {type: number}
    cost_usd: {type: number}
    value_usd: {type: number}
    cost_eur: {type: number}
    value_eur: {type: number}
    fx_effect_eur: {type: number}
    pnl_eur: {type: number}
    note: {type: ['string', 'null']}
AllTrades:
  type: object
  x-source: warehouse/all_trades.all_trades
  description: >-
    Every paper trade in one place as of the cut-off (owner request 2026-10-12). Scope all = the accuracy view (every
    strategy), head_to_head = the head-to-head view (never pooled with all: two views of the same predictions), mine =
    the owner's own trades (WS4's FIFO ledger, your cost only). The summary counts every trade; listed here: the
    head-to-head and owner's trades (every open one, and the closed or not-entered ones whose exit is in the window;
    older ones are counted in the summary and listed nowhere). The accuracy view is listed per entry session on GET
    /portfolios/sessions/{date} (index: sessions). Win / loss on the net P&L after market cost (mine: after your cost).
  required: [window, summary, trades, sessions]
  properties:
    window:
      type: object
      required: [sessions, from, to]
      properties:
        sessions: {type: integer}
        from: {type: ['string', 'null'], format: date}
        to: {type: ['string', 'null'], format: date}
    summary:
      type: array
      description: Per scope and family, period to_date and window; not_entered trades are never counted
      items: {$ref: '#/components/schemas/AllTradesSummaryRow'}
    trades:
      type: array
      description: Head-to-head and mine (the accuracy view is on the session pages); open, and closed or not entered with the exit in the window; open first, then by exit (or entry) date newest first, then by id
      items: {$ref: '#/components/schemas/AllTradesRow'}
    sessions:
      type: array
      description: The accuracy-view entry sessions that have a page (the last 60), newest first
      items: {$ref: '#/components/schemas/AllTradesSession'}
    open_holds:
      type: array
      description: UX3 - per hold with open accuracy-view trades (shortest first) its split and per-family split; the trades on GET /portfolios/open/{k}
      items: {$ref: '#/components/schemas/OpenHold'}
    finished_sessions:
      type: array
      description: UX3 - per exit session of the last 10 with accuracy-view trades (newest first) its counts per family; the trades on GET /portfolios/finished/{date}
      items: {$ref: '#/components/schemas/FinishedSession'}
    learning: {$ref: '#/components/schemas/PortfolioLearning'}
AllTradesSession:
  type: object
  description: One accuracy-view entry session's counts (not_entered trades never counted in the others)
  required: [session_date, entered, not_entered, open, closed, wins, losses, flat, win_rate, net_pnl_market, net_pnl_your,
             unrealised_pnl, flagged_open]
  properties:
    session_date: {$ref: '#/components/schemas/IsoDate'}
    entered: {type: integer, description: Every accuracy-view trade of the session, not_entered included}
    not_entered: {type: integer}
    open: {type: integer}
    closed: {type: integer}
    wins: {type: integer}
    losses: {type: integer}
    flat: {type: integer}
    win_rate: {type: ['number', 'null']}
    net_pnl_market: {type: ['number', 'null']}
    net_pnl_your: {type: ['number', 'null']}
    unrealised_pnl: {type: ['number', 'null'], description: Sum over the session's open trades with a price, before costs}
    flagged_open: {type: integer}
AllTradesSummaryRow:
  type: object
  required: [scope, family, period, open, closed, wins, losses, flat, win_rate, net_pnl_market, net_pnl_your,
             pnl_your_missing, unrealised_pnl, flagged_open, currency]
  properties:
    scope: {type: string, enum: [all, head_to_head, mine]}
    family: {type: string, enum: [all, rule, ai, baseline, mine]}
    period: {type: string, enum: [to_date, window]}
    open: {type: integer}
    closed: {type: integer}
    wins: {type: integer}
    losses: {type: integer}
    flat: {type: integer}
    win_rate: {type: ['number', 'null'], description: Wins as a percent of closed trades; null without any}
    net_pnl_market: {type: ['number', 'null'], description: Sum over closed trades after market cost (null for mine)}
    net_pnl_your: {type: ['number', 'null'], description: Sum over closed trades with a your-cost figure}
    pnl_your_missing: {type: integer, description: Closed trades without a your-cost figure yet}
    unrealised_pnl: {type: ['number', 'null'], description: Sum over the open trades with a price, before costs}
    flagged_open: {type: integer, description: Open trades whose latest intraday check is flagged}
    currency: {type: ['string', 'null']}
AllTradesRow:
  type: object
  required: [id, scope, view, strategy_id, family, pick_rule, side, ticker, horizon_days, entry_date, exit_date, state,
             not_entered_reason, outcome, entry_price, entry_price_source, exit_or_last_price, last_price_source,
             last_price_date, last_price_time, price_pending, quantity, amount, currency, unrealised_pnl,
             unrealised_pct, pnl_market, pnl_your, return_pct_market, return_pct_your, settled_at, lo80, lo50, hi50,
             hi80, target_price, to_target_pct, check, paper]
  properties:
    id: {type: string, description: The trade id (strategy trades) or the portfolio trade id (mine)}
    scope: {type: string, enum: [all, head_to_head, mine]}
    view: {type: ['string', 'null'], enum: [accuracy, head_to_head, null]}
    strategy_id: {type: ['string', 'null']}
    family: {type: string, enum: [rule, ai, baseline, mine]}
    pick_rule: {type: ['string', 'null']}
    side: {type: ['string', 'null'], enum: [buy, sell, null], description: 'Mine only: buy = an open lot, sell = a closed sale over the FIFO lots it closes'}
    ticker: {$ref: '#/components/schemas/Ticker'}
    horizon_days: {type: ['integer', 'null']}
    entry_date: {type: ['string', 'null'], format: date}
    exit_date: {type: ['string', 'null'], format: date, description: The actual exit on closed rows; the planned exit on open rows}
    state: {type: string, enum: [open, closed, not_entered]}
    not_entered_reason: {type: ['string', 'null'], enum: [no_entry, skipped_price_above_amount, null]}
    outcome: {type: ['string', 'null'], enum: [win, loss, flat, null], description: Closed rows only}
    entry_price: {type: ['number', 'null']}
    entry_price_source: {type: ['string', 'null'], enum: [daily_bar, intraday_check, null]}
    exit_or_last_price: {type: ['number', 'null'], description: The exit price (closed) or the last price (open)}
    last_price_source: {type: ['string', 'null'], enum: [daily_close, intraday_check, null]}
    last_price_date: {type: ['string', 'null'], format: date}
    last_price_time: {type: ['string', 'null'], format: date-time, description: The intraday check's time; null for a daily close}
    price_pending: {type: boolean, description: Entered at D's open but no price stored or checked yet}
    quantity: {type: ['number', 'null']}
    amount: {type: ['number', 'null']}
    currency: {type: ['string', 'null']}
    unrealised_pnl: {type: ['number', 'null'], description: Open rows only, before costs}
    unrealised_pct: {type: ['number', 'null'], description: Open rows only, before costs}
    pnl_market: {type: ['number', 'null'], description: Closed strategy rows, net after market cost; null for mine}
    pnl_your: {type: ['number', 'null'], description: Closed rows, net after your cost}
    return_pct_market: {type: ['number', 'null']}
    return_pct_your: {type: ['number', 'null']}
    settled_at: {type: ['string', 'null'], format: date-time}
    lo80: {type: ['number', 'null'], description: Open strategy rows - the trade's own 80% range (null otherwise)}
    lo50: {type: ['number', 'null']}
    hi50: {type: ['number', 'null']}
    hi80: {type: ['number', 'null']}
    target_price: {type: ['number', 'null']}
    to_target_pct: {type: ['number', 'null']}
    check:
      description: Open strategy rows - the trade's row of the market's latest intraday check by the cut-off, or null
      oneOf:
        - type: 'null'
        - type: object
          required: [check_at, band, flags, flagged, ret_since_entry_pct]
          properties:
            check_at: {type: string, format: date-time}
            band: {type: ['string', 'null']}
            flags:
              type: ['array', 'null']
              items: {type: string}
            flagged: {type: ['boolean', 'null']}
            ret_since_entry_pct: {type: ['number', 'null']}
    direction: {type: ['string', 'null'], enum: [up, down, null], description: UX3 - the prediction's direction (strategy rows)}
    prob_up: {type: ['number', 'null'], description: UX3 - the prediction's chance of a rise (null for always buy and follow yesterday)}
    reason: {type: ['string', 'null'], description: "UX3 - the AI trader's own words for its prediction (null for rule strategies and benchmarks)"}
    why:
      description: UX3 - strategy rows (open with a check of its entry session or later, or closed and entered), else null
      oneOf:
        - type: 'null'
        - $ref: '#/components/schemas/TradeWhy'
    sessions:
      description: UX3 - open strategy rows - of the hold's k + 1 market sessions (entry session D to the exit session), those up to the latest price's session (0 while the price is pending); null otherwise
      oneOf:
        - type: 'null'
        - type: object
          required: [held, total]
          properties:
            held: {type: integer, minimum: 0}
            total: {type: integer, minimum: 1}
    paper: {type: boolean, const: true}
