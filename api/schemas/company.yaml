  description: >-
    A settled paper trade (kind paper_trades_settled, the newest settlement of the trade), market-cost view, with
    its automatic reason (F1.10); a row with a status other than `settled` (no entry, skipped) carries nulls
  x-source: warehouse/rm_common.settled_trades
  required: [id, trade_id, prediction_id, strategy_id, family, view, market, ticker, horizon_days, entry_date,
             exit_date, status, settled_at]
  properties:
    id: {type: string}
    trade_id: {type: string}
    prediction_id: {type: string}
    strategy_id: {type: string}
    family: {type: string, enum: [rule, baseline, ai]}
    view: {type: string, enum: [accuracy, head_to_head]}
    pick_rule: {type: ['string', 'null']}
    market: {$ref: '#/components/schemas/Market'}
    ticker: {$ref: '#/components/schemas/Ticker'}
    horizon_days: {$ref: '#/components/schemas/Horizon'}
    made_at: {type: ['string', 'null'], format: date-time}
    entry_date: {$ref: '#/components/schemas/IsoDate'}
    exit_date: {$ref: '#/components/schemas/IsoDate'}
    exit_date_actual: {type: ['string', 'null'], format: date}
    status: {type: string}
    flags:
      type: ['array', 'null']
      items: {type: string}
    amount: {$ref: '#/components/schemas/NullableNumber'}
    currency: {type: ['string', 'null']}
    entry_price: {$ref: '#/components/schemas/NullableNumber'}
    exit_price: {$ref: '#/components/schemas/NullableNumber'}
    quantity: {$ref: '#/components/schemas/NullableNumber'}
    gross_pnl: {$ref: '#/components/schemas/NullableNumber'}
    costs: {$ref: '#/components/schemas/NullableNumber'}
    net_pnl: {$ref: '#/components/schemas/NullableNumber'}
    return_pct: {$ref: '#/components/schemas/NullableNumber'}
    prob_up: {$ref: '#/components/schemas/NullableNumber'}
    target_price: {$ref: '#/components/schemas/NullableNumber'}
    lo80: {$ref: '#/components/schemas/NullableNumber'}
    hi80: {$ref: '#/components/schemas/NullableNumber'}
    range_hit: {type: ['boolean', 'null']}
    target_reached: {type: ['boolean', 'null']}
    target_reached_session: {type: ['integer', 'null']}
    max_favourable_pct: {$ref: '#/components/schemas/NullableNumber'}
    max_adverse_pct: {$ref: '#/components/schemas/NullableNumber'}
    move_pct: {$ref: '#/components/schemas/NullableNumber'}
    market_pct: {$ref: '#/components/schemas/NullableNumber'}
    sector_pct: {$ref: '#/components/schemas/NullableNumber'}
    news_pct: {$ref: '#/components/schemas/NullableNumber'}
    company_pct: {$ref: '#/components/schemas/NullableNumber'}
    reason_code: {type: ['string', 'null']}
    reason_codes:
      type: ['array', 'null']
      items: {type: string}
    news_ids:
      type: ['array', 'null']
      items: {type: string}
    reason_detail: {type: ['object', 'null'], description: 'benchmark, benchmark_pct, beta, sector_source, news_statuses; note on skipped rows'}
    regime: {type: ['string', 'null']}
    settled_at: {$ref: '#/components/schemas/IsoTime'}
AiReason:
  type: object
  description: An AI reason of the EOD analyst (kind trade_reasons_ai), at most 60 words; never advice
  x-source: warehouse/company_sources.REASONS_SQL
  required: [id, market, ticker, session_date, kind, text, created_at]
  properties:
    id: {type: string}
    trade_id: {type: ['string', 'null']}
    market: {$ref: '#/components/schemas/Market'}
    ticker: {$ref: '#/components/schemas/Ticker'}
    strategy_id: {type: ['string', 'null']}
    session_date: {$ref: '#/components/schemas/IsoDate'}
    kind: {type: string}
    rank: {type: ['integer', 'null']}
    text: {type: string}
    cited_ids:
      type: ['array', 'null']
      items: {type: string}
    reason_codes:
      type: ['array', 'null']
      items: {type: string}
    created_at: {$ref: '#/components/schemas/IsoTime'}
ResultsDigest:
  type: object
  description: A results digest (kind results_digests, macro results_digests_asof); numbers as of the release
  x-source: warehouse/company_sources.DIGESTS_SQL
  required: [id, release_kind, ticker, release_at, status, created_at]
